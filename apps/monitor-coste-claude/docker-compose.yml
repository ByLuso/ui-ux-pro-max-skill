name: claude-usage-monitor

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus exporter (métricas de Claude Code)
    depends_on:
      - loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-90d}
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  pushgateway:
    image: prom/pushgateway:v1.10.0
    command: ["--persistence.file=/data/pushgateway.db", "--persistence.interval=1m"]
    volumes:
      - pushgateway-data:/data
    ports:
      - "9091:9091"
    restart: unless-stopped

  usage-exporter:
    build: ./usage-exporter
    env_file:
      - path: .env
        required: false
    environment:
      PUSHGATEWAY_URL: http://pushgateway:9091
      EXPORTER_PORT: "9101"
    ports:
      - "9101:9101"   # /metrics (Admin API) + /form (registro manual claude.ai)
    depends_on:
      - pushgateway
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    env_file:
      - path: .env
        required: false
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/claude-code.json
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 5s
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      # Umbrales de alerta (usados en provisioning/alerting/alerts.yaml)
      ALERT_BURN_RATE_USD_HR: ${ALERT_BURN_RATE_USD_HR:-5}
      ALERT_DAILY_COST_USD: ${ALERT_DAILY_COST_USD:-20}
      ALERT_CLAUDE_AI_WEEKLY_PCT: ${ALERT_CLAUDE_AI_WEEKLY_PCT:-90}
    volumes:
      - ./grafana/entrypoint.sh:/entrypoint.sh:ro
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning-src:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

volumes:
  prometheus-data:
  loki-data:
  pushgateway-data:
  grafana-data:
