<style>
/* Layout: una columna tipo app (máx. 560px) con barra de pestañas fija abajo y tarjetas planas. */
:root {
  --bg: #F3F4F1; --surface: #FFFFFF; --surface2: #EDEFEB; --line: #E0E3DE; --track: #E8EBE6;
  --text: #1F2523; --muted: #6E7873; --accent: #3F7D6E; --on-accent: #FFFFFF; --accent2: #6C7FA6;
  --warn: #B98A3E; --income: #3E8A66; --expense: #B2645A; --gold: #B98A3E;
  --cyan: var(--accent); --violet: var(--accent2); --magenta: var(--warn); --void: var(--bg);
  --shadow: 0 6px 20px rgba(31, 37, 35, .10);
  --font: system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --display: var(--font); --body: var(--font); --mono: var(--font);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141817; --surface: #1C2120; --surface2: #232927; --line: #2C3330; --track: #2A302E;
  --text: #E5E9E6; --muted: #8D9893; --accent: #86BBAC; --on-accent: #12201C; --accent2: #9DADCB;
  --warn: #D3AE6B; --income: #80BC9C; --expense: #D58E84; --gold: #D3AE6B; --shadow: 0 6px 20px rgba(0,0,0,.35);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #141817; --surface: #1C2120; --surface2: #232927; --line: #2C3330; --track: #2A302E;
  --text: #E5E9E6; --muted: #8D9893; --accent: #86BBAC; --on-accent: #12201C; --accent2: #9DADCB;
  --warn: #D3AE6B; --income: #80BC9C; --expense: #D58E84; --gold: #D3AE6B; --shadow: 0 6px 20px rgba(0,0,0,.35);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; -webkit-tap-highlight-color: transparent; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
#cosmos { display: none; }
#app { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px calc(120px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input { font: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tab-view { display: flex; flex-direction: column; gap: 14px; }

/* ---- Tarjetas */
.holo { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.holo.strong { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.holo.plain { }
.holo > .in { padding: 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.holo.violet > .in, .holo.magenta > .in { }
.holo.magenta { background: color-mix(in srgb, var(--warn) 7%, var(--surface)); }
.shimmer > .in { position: relative; }

.hud { font-size: 13px; font-weight: 500; color: var(--muted); }
.hud.cyan, .hud.inc { color: var(--accent); } .hud.mag { color: var(--warn); } .hud.exp { color: var(--expense); }
.glow { font-weight: 600; line-height: 1.15; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.grad-text { color: var(--text); }
.mono { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; color: var(--muted); }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.grow { flex: 1; min-width: 0; }
.spread { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.inc { color: var(--income); } .exp { color: var(--expense); } .cy { color: var(--accent); }
.title { font-size: 28px; font-weight: 600; letter-spacing: -.02em; text-wrap: balance; }

/* ---- Controles */
.pill { font-size: 14px; font-weight: 500; padding: 8px 15px; color: var(--muted); background: var(--surface2); border-radius: 999px; white-space: nowrap; transition: background .2s, color .2s, transform .12s; }
.pill.on { background: var(--accent); color: var(--on-accent); }
.pill:active, .press:active { transform: scale(.98); }
.pills { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.pills::-webkit-scrollbar { display: none; }
.btn-primary { width: 100%; padding: 15px; background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: 15px; border-radius: 14px; transition: transform .12s; }
.btn-primary:active { transform: scale(.99); }
.btn-ghost { width: 100%; padding: 10px; font-size: 15px; color: var(--muted); }
.iconbtn { width: 40px; height: 40px; display: grid; place-items: center; background: var(--surface2); color: var(--text); border-radius: 50%; flex: none; transition: transform .12s; }
.iconbtn:active { transform: scale(.95); }
.field { width: 100%; padding: 13px 14px; background: var(--surface); border: 1px solid var(--line); color: var(--text); font-size: 16px; border-radius: 12px; }
.field:focus { outline: none; border-color: var(--accent); }
label.lbl { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }

/* ---- Cabecera */
.brand { font-weight: 600; font-size: 22px; letter-spacing: -.01em; }
.brand .ghost { display: none; }
.diamond-mark { display: none; }
.month-title { font-weight: 500; font-size: 17px; text-align: center; }
.flux { height: 6px; border-radius: 3px; background: var(--track); display: flex; gap: 4px; overflow: hidden; }
.flux .a { background: var(--income); border-radius: 3px; }
.flux .b { background: var(--expense); opacity: .8; flex: 1; border-radius: 3px; }
.stats2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.stats2 > div + div { border-left: 1px solid var(--line); padding-left: 14px; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--income); }

/* ---- Listas */
.mv { display: flex; align-items: center; gap: 12px; padding: 11px 2px; border-top: 1px solid var(--line); cursor: pointer; transition: transform .12s; }
.mv:first-child { border-top: 0; }
.mv:active { transform: scale(.99); }
.glyph { width: 42px; height: 42px; flex: none; display: grid; place-items: center; font-size: 19px; border-radius: 12px; }
.mv .name { font-weight: 500; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mv .meta { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mv .amt { font-weight: 500; font-size: 15px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.day-h { display: flex; justify-content: space-between; padding: 6px 2px 0; }
.catbar { padding: 8px; cursor: pointer; border-radius: 10px; transition: background .25s, opacity .25s, transform .12s; }
.catbar:active { transform: scale(.99); }
.catbar.dim { opacity: .45; }
.bar { position: relative; height: 8px; margin-top: 8px; }
.bar .t { position: absolute; left: 0; right: 0; top: 2px; height: 4px; background: var(--track); border-radius: 2px; }
.bar .f { position: absolute; left: 0; top: 2px; height: 4px; border-radius: 2px; width: 0; transition: width .8s cubic-bezier(.2,.8,.2,1); }
.bar .over { position: absolute; top: 2px; height: 4px; background: var(--expense); border-radius: 2px; width: 0; transition: width .8s cubic-bezier(.2,.8,.2,1) .15s; }
.bar .ideal { position: absolute; top: 0; width: 2px; height: 8px; background: var(--muted); }
.bar .dot { display: none; }
.sq { width: 8px; height: 8px; border-radius: 50%; flex: none; }

.ring-wrap { position: relative; align-self: center; width: min(260px, 74vw); aspect-ratio: 1; max-width: 100%; }
.ring-wrap canvas { width: 100%; height: 100%; display: block; }
.ring-center { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; text-align: center; }
.ring-center > div { animation: fade .25s; }
.hint { font-size: 12px; color: var(--muted); text-align: center; }

/* ---- Entrada suave */
.enter { animation: enter .42s ease-out both; animation-delay: calc(var(--i, 0) * 40ms); }
@keyframes enter { from { opacity: 0; transform: translateY(8px); } }
@keyframes fade { from { opacity: 0; } }

/* ---- Barra inferior y botón */
.nav.holo { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; background: var(--surface); border: 0; border-top: 1px solid var(--line); border-radius: 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav.holo > .in { display: flex; flex-direction: row; gap: 0; max-width: 560px; margin: 0 auto; padding: 6px max(8px, env(safe-area-inset-left, 0px)); }
.nav .spot { display: none; }
.nav button { flex: 1; padding: 4px 2px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); font-size: 11px; transition: color .2s; }
.nav button svg { width: 22px; height: 22px; padding: 4px 16px; box-sizing: content-box; border-radius: 999px; transition: background .2s; }
.nav button.on { color: var(--text); }
.nav button.on svg { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.fab { position: fixed; z-index: 21; right: max(18px, calc(50% - 262px)); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; display: grid; place-items: center; border-radius: 50%; background: var(--accent); color: var(--on-accent); box-shadow: var(--shadow); transition: transform .12s; }
.fab:active { transform: scale(.95); }
.fab[hidden] { display: none; }
.fab .core { display: grid; place-items: center; }
.fab .core svg { color: var(--on-accent); width: 24px; height: 24px; }
.particle { display: none; }

/* ---- Capas */
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(20, 24, 23, .45); display: flex; align-items: center; justify-content: center; padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: fade .2s; }
.sheet { width: min(520px, 100%); max-height: 100%; display: flex; animation: rise .28s ease-out; }
.sheet > .holo { width: 100%; display: flex; border-radius: 20px; box-shadow: var(--shadow); }
.sheet .in { width: 100%; overflow: hidden; }
.sheet .scroll { overflow-y: auto; min-height: 0; flex: 1 1 auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 4px; }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } }
.toast { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); top: calc(12px + env(safe-area-inset-top, 0px)); width: min(520px, calc(100% - 32px)); animation: drop .3s ease-out; box-shadow: var(--shadow); }
.toast.out { animation: lift .25s forwards; }
@keyframes drop { from { transform: translate(-50%, -30%); opacity: 0; } }
@keyframes lift { to { transform: translate(-50%, -30%); opacity: 0; } }
.toast .in { padding: 12px 16px !important; flex-direction: row !important; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 7px 12px; font-size: 13px; color: var(--muted); background: var(--surface2); border-radius: 999px; }
.chip.on { color: var(--text); }

/* ---- Consejos */
.tip { cursor: pointer; }
.tip .body { color: var(--muted); font-size: 14px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
.tip.open .body { -webkit-line-clamp: unset; display: block; }
.tip .src { display: none; font-size: 12px; color: var(--muted); margin-top: 6px; }
.tip.open .src { display: block; }
.tag-save { font-size: 12px; font-weight: 500; color: var(--income); background: color-mix(in srgb, var(--income) 12%, transparent); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.search { position: relative; }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
.search .field { padding-left: 40px; font-size: 15px; }
.search .clear { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 18px; width: 30px; height: 30px; }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.kv b { font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }
.banner { font-size: 13px; color: var(--muted); padding: 10px 12px; border: 1px dashed var(--line); border-radius: 12px; }
.empty { color: var(--muted); padding: 8px 2px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>

<script>
"use strict";
/* =====================================================================
 * Saldo · versión web para iPhone
 * Misma lógica que la app Android: lector de extractos PDF, asesor y consejos.

// ---------------------------------------------------------------- Utilidades
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const NF2 = new Intl.NumberFormat("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const NF0 = new Intl.NumberFormat("es-ES", { maximumFractionDigits: 0 });
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
let HIDE = false;
function euros(v, signed = false) {
  if (HIDE) return "••••• €";
  const sign = signed ? (v > 0 ? "+" : v < 0 ? "-" : "") : (v < 0 ? "-" : "");
  return sign + NF2.format(Math.abs(v)) + " €";
}
const e0 = v => NF0.format(v) + " €";
const pct = v => Math.round(v) + " %";
const DAY = 86400000;
const pad = n => String(n).padStart(2, "0");
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const monthKey = ts => { const d = new Date(ts); return `m-${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const fmtMonth = (y, m) => { const s = new Date(y, m, 1).toLocaleDateString("es-ES", { month: "long" }); return s[0].toUpperCase() + s.slice(1) + " " + y; };
const fmtShort = d => d.toLocaleDateString("es-ES", { day: "numeric", month: "short" }).replace(".", "");
function relDay(ts) {
  const d = startOfDay(new Date(ts)), t = startOfDay(new Date());
  const diff = Math.round((t - d) / DAY);
  if (diff === 0) return "Hoy";
  if (diff === 1) return "Ayer";
  return d.toLocaleDateString("es-ES", { weekday: "short", day: "numeric", month: "short" }).replace(/\./g, "");
}
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const normalize = s => String(s).toLowerCase().normalize("NFD").replace(/\p{M}+/gu, "").trim();
function parseNumber(raw) {
  const s = String(raw).replace(/[\s ]/g, "").replace(/€|eur/gi, "");
  if (!s) return null;
  const neg = /^[-−]/.test(s);
  const t = s.replace(/^[-+−]/, "");
  const lastDot = t.lastIndexOf("."), lastComma = t.lastIndexOf(",");
  let n;
  if (lastDot >= 0 && lastComma >= 0) n = lastComma > lastDot ? t.replace(/\./g, "").replace(",", ".") : t.replace(/,/g, "");
  else if (lastComma >= 0) n = t.replace(",", ".");
  else if (lastDot >= 0) n = (t.length - lastDot - 1 === 3) ? t.replace(/\./g, "") : t;
  else n = t;
  const v = Number(n);
  return Number.isFinite(v) ? (neg ? -v : v) : null;
}

// ---------------------------------------------------------------- Categorías
const CATEGORIES = [
  ["Hogar", "🏠", "#7F8FB8", ["alquiler", "hipoteca", "iberdrola", "endesa", "naturgy", "repsol luz", "agua", "canal de isabel", "ikea", "leroy", "comunidad", "gas natural", "holaluz", "totalenergies"]],

  ["Restaurantes", "🍔", "#C98E8E", ["starbucks", "mcdonald", "burger", "kfc", "telepizza", "domino", "glovo", "just eat", "uber eats", "deliveroo", "restaurante", "bar ", "cafeteria", "café", "cafe ", "100 montaditos", "foster", "vips", "goiko", "taberna", "pizzeria", "five guys", "tgb", "rodilla"]],
  ["Transporte", "🚗", "#6FA2AF", ["uber", "cabify", "bolt", "renfe", "metro", "emt", "tmb", "alsa", "repsol", "cepsa", "galp", "bp ", "shell", "gasolinera", "parking", "aparcamiento", "peaje", "blablacar", "iryo", "ouigo", "vueling", "ryanair", "iberia", "taxi", "freenow", "carburante"]],

  ["Suscripciones", "📺", "#7FAFC6", ["netflix", "spotify", "hbo", "max ", "disney", "prime video", "amazon prime", "apple.com", "icloud", "google one", "youtube", "dazn", "movistar", "vodafone", "orange", "digi", "yoigo", "pepephone", "masmovil", "o2 ", "lowi", "chatgpt", "openai", "claude", "anthropic"]],
  ["Salud", "💊", "#7FB79B", ["farmacia", "sanitas", "adeslas", "dkv", "mapfre salud", "dentista", "clinica", "clínica", "hospital", "optica", "óptica", "fisio", "medico", "médico"]],
  ["Ropa", "👕", "#CDB57E", ["zara", "bershka", "pull&bear", "pull and bear", "stradivarius", "massimo dutti", "h&m", "primark", "mango", "decathlon", "nike", "adidas", "shein", "springfield", "lefties", "kiabi", "el corte ingles", "el corte inglés", "jd sports", "foot locker", "vinted", "zalando"]],
  ["Compras", "🛍️", "#BF8585", ["amazon", "aliexpress", "temu", "mediamarkt", "media markt", "pccomponentes", "apple store", "miravia", "wallapop", "ebay", "flying tiger"]],
  ["Efectivo", "💶", "#9BA29E", ["cajero", "retirada", "reintegro", "atm"]],
  ["Bizum", "📲", "#72B2A6", ["bizum"]],
  ["Otros", "📦", "#A4AAA6", []],
].map(([name, emoji, color, keywords]) => ({ name, emoji, color, keywords }));
const INCOME_CAT = { name: "Ingresos", emoji: "💰", color: "#7FB79B", keywords: [] };
const catOf = name => name === "Ingresos" ? INCOME_CAT : (CATEGORIES.find(c => c.name === name) || CATEGORIES[CATEGORIES.length - 1]);
function guessCategory(merchant, text, income) {
  if (income) return "Ingresos";
  const m = " " + merchant.toLowerCase() + " ";
  let c = CATEGORIES.find(c => c.keywords.some(k => m.includes(k)));
  if (c) return c.name;
  const t = " " + text.toLowerCase() + " ";
  c = CATEGORIES.find(c => c.keywords.some(k => t.includes(k)));
  return c ? c.name : "Otros";
}
function prettify(s) {
  const t = s.slice(0, 32);
  return t === t.toUpperCase() ? t.toLowerCase().split(" ").map(w => w ? w[0].toUpperCase() + w.slice(1) : w).join(" ") : t;
}

// ---------------------------------------------------------------- Lector de extractos
const StatementParser = (() => {
  const months = { ene: 1, feb: 2, mar: 3, abr: 4, may: 5, jun: 6, jul: 7, ago: 8, sep: 9, set: 9, oct: 10, nov: 11, dic: 12, jan: 1, apr: 4, aug: 8, dec: 12 };
  const numericDate = /^(\d{1,2})([/\-.])(\d{1,2})(?:\2(\d{2,4}))?(?![\d,])/;
  const textDate = /^(\d{1,2})\s+(?:de\s+)?(ene|feb|mar|abr|may|jun|jul|ago|sep|set|oct|nov|dic|jan|apr|aug|dec)[a-záéíóú]*\.?(?:\s+(?:de\s+)?(\d{4}))?\b/i;

  } else out.push(P("p-cushion-ok", "Inversión", "Tu colchón de emergencia está cubierto", `Tu saldo cubre unos ${a.monthsCovered ? a.monthsCovered.toFixed(1).replace(".", ",") : "6"} meses de gastos. El dinero que pase de ${e0(a.cushion)} puede ir a objetivos a medio plazo o a inversión a largo plazo.`));
  if (a.subs.length) {
    const total = a.subs.reduce((s, x) => s + x[1], 0);

  }

  const fixed = a.groups.filter(x => ["HOUSING", "FOOD", "TRANSPORT", "HEALTH"].includes(x.g.key)).reduce((t, x) => t + x.act, 0);
  if (a.expenses > 0 && disc > 0) out.push(P("p-discretionary", "Planificación", `Gastos discrecionales: ${e0(disc)} al mes (${pct(disc / a.expenses * 100)} de tu gasto)`,

  if (a.small[0] >= 8) out.push(P("p-small", "Hábitos", `${a.small[0]} pequeñas compras de menos de 6 € suman ${e0(a.small[1])}`, `Los gastos hormiga (cafés, snacks, apps) pasan desapercibidos. Reducirlos a la mitad te ahorraría unos ${e0(a.small[1] / 2)} en este periodo.`, a.small[1] / 2));

const S = {
  movements: [], salary: null, anchor: null,
  tab: "home", ym: [new Date().getFullYear(), new Date().getMonth()], filter: 0, showIncome: false, selCat: null,
  period: "LAST_30", selGroup: null, query: "", topic: null, openTip: null,
  mode: "starting", storeNote: "",

const LS_KEY = "saldo.web.v1";
const Store = {
  db: null, uid: null, queue: {},
  loadLocal() { try { const raw = localStorage.getItem(LS_KEY); if (raw) { const d = JSON.parse(raw); S.movements = d.movements || []; S.salary = d.salary ?? null; S.anchor = d.anchor ?? null; } } catch (_) {} },
  saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify({ movements: S.movements, salary: S.salary, anchor: S.anchor })); } catch (_) {} },
  clearLocal() { try { localStorage.removeItem(LS_KEY); } catch (_) {} },
  // Una escritura cada vez por documento
  write(docId, body) {
    if (!this.db) return;
    const ref = this.db.collection("data/users/" + this.uid).doc(docId);
    const prev = this.queue[docId] || Promise.resolve();
    const next = prev.catch(() => {}).then(() => body === null ? ref.delete() : ref.set(body)).catch(err => {
      if (err && err.code === "quota_exceeded") toast("almacenamiento lleno", "Borra movimientos antiguos para seguir guardando", "var(--expense)");
      else if (err && err.code === "unavailable") setTimeout(() => this.write(docId, body), 1500 + Math.random() * 1000);
    });
    this.queue[docId] = next;
  },
  saveMonths(keys) {
    if (this.db) keys.forEach(k => { const list = S.movements.filter(m => monthKey(m.ts) === k); this.write(k, list.length ? { movements: list } : null); });
    else this.saveLocal();
  },
  saveSettings() { if (this.db) this.write("settings", { salary: S.salary, anchor: S.anchor }); else this.saveLocal(); },
  async init() {
    this.loadLocal();
    render();
    const c = window.claude;
    if (!c || typeof c.use !== "function") { S.mode = "local"; S.storeNote = "Guardado en este navegador."; render(); return; }
    let db = null, user = null;
    try { [db, user] = await Promise.all([c.use("db"), c.use("user")]); } catch (_) {}
    const id = user ? await user.id() : null;
    if (!db || !id) { S.mode = "local"; S.storeNote = "Guardado solo en este navegador. Inicia sesión en Claude para guardarlo en tu cuenta."; render(); return; }
    this.db = db; this.uid = id;
    let first = true;
    db.collection("data/users/" + id).onSnapshot(snap => {
      const movs = []; let settings = null;
      snap.docs.forEach(d => {
        if (!d.exists) return;
        const body = d.data();
        if (d.id === "settings") settings = body;
        else if (d.id.startsWith("m-") && Array.isArray(body.movements)) movs.push(...body.movements);
      });
      if (first) {
        first = false;
        // Migra lo guardado antes en el navegador
        if (snap.empty && S.movements.length) {
          const keys = [...new Set(S.movements.map(m => monthKey(m.ts)))];
          this.saveMonths(keys); this.saveSettings(); this.clearLocal();
          S.mode = "cloud"; S.storeNote = "Guardado en tu zona privada de Claude."; render(); return;
        }
        this.clearLocal();
      }
      S.movements = movs.sort((a, b) => b.ts - a.ts);
      if (settings) { S.salary = settings.salary ?? null; S.anchor = settings.anchor ?? null; }
      S.mode = "cloud"; S.storeNote = "Guardado en tu zona privada de Claude: solo tú puedes verlo.";
      render();
    }, () => { S.mode = "local"; S.storeNote = "No se pudo conectar con tu almacenamiento. Los cambios se guardan en este navegador."; this.db = null; render(); });
  },
};
function upsertMovements(list) {
  const keys = new Set();
  list.forEach(m => {
    const i = S.movements.findIndex(x => x.id === m.id);
    if (i >= 0) { keys.add(monthKey(S.movements[i].ts)); S.movements[i] = m; } else S.movements.push(m);
    keys.add(monthKey(m.ts));
  });
  S.movements.sort((a, b) => b.ts - a.ts);
  Store.saveMonths([...keys]);
}
function deleteMovement(id) {
  const m = S.movements.find(x => x.id === id); if (!m) return;
  S.movements = S.movements.filter(x => x.id !== id);
  Store.saveMonths([monthKey(m.ts)]);
}
function currentBalance() {
  const withBal = S.movements.filter(m => m.balance != null).sort((a, b) => b.ts - a.ts)[0];
  const anchors = [S.anchor, withBal ? { value: withBal.balance, ts: withBal.ts } : null].filter(Boolean);
  if (!anchors.length) return null;
  const a = anchors.sort((p, q) => q.ts - p.ts)[0];
  return a.value + S.movements.filter(m => m.ts > a.ts).reduce((s, m) => s + (m.income ? m.amount : -m.amount), 0);
}

  el.dataset.v = target;

function setupCanvas(cv) {
  const dpr = Math.min(2, devicePixelRatio || 1), r = cv.getBoundingClientRect();

}

    ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * (R - 2), cy + Math.sin(a) * (R - 2)); ctx.lineTo(cx + Math.cos(a) * (R - 2 - len), cy + Math.sin(a) * (R - 2 - len)); ctx.stroke();
  }
}
// slices: [{key,color,frac}] ; rings: [{slices, r, w, alpha}]
function ringAnimator(rings, getSel, t0 = performance.now()) {
  const fn = (cv, now) => {
    const [ctx, W, H] = setupCanvas(cv);
    const cx = W / 2, cy = H / 2, R = Math.min(W, H) / 2;
    const t = reduceMotion ? 1e9 : now - t0;
    ctx.clearRect(0, 0, W, H);
    const pulse = 0.5 + 0.5 * (Math.sin(now / 900) + 1) / 2;
    const sel = getSel();
    rings.forEach((ring, ri) => {
      const appear = Math.min(1, Math.max(0, (t - ri * 250) / 800)); const k = 1 - Math.pow(1 - appear, 3);
      const r = R * ring.r, w = R * ring.w;
      arc(ctx, cx, cy, r, 0, Math.PI * 2, getComputedStyle(document.documentElement).getPropertyValue("--track").trim() || "#E8EBE6", w);

      ring.slices.forEach(s => {
        const sweep = s.frac * Math.PI * 2 * k;
        if (sweep > 0.004) {
          const isSel = sel === s.key, dim = sel && !isSel ? 0.35 : 1;
          const ww = isSel ? w * 1.45 : w;
          ctx.globalAlpha = ring.alpha * dim;
          arc(ctx, cx, cy, r, start + gap / 2, start + Math.max(gap / 2 + 0.004, sweep - gap / 2), s.color, ww);
          ctx.globalAlpha = 1;
        }

}

  rings.forEach(ring => { const d = Math.abs(dist - R * ring.r); if (d < bd && d < R * ring.w * 1.4) { bd = d; best = ring; } });
  if (!best) return null;
  let ang = Math.atan2(y, x) + Math.PI / 2; if (ang < 0) ang += Math.PI * 2;
  let acc = 0;
  for (const s of best.slices) { acc += s.frac * Math.PI * 2; if (ang <= acc) return s.key; }
  return null;
}

  list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>',
  spark: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.9 5.6L19.5 9.5l-5.6 1.9L12 17l-1.9-5.6L4.5 9.5l5.6-1.9zM19 14l.9 2.6 2.6.9-2.6.9L19 21l-.9-2.6-2.6-.9 2.6-.9zM5 15l.7 1.8 1.8.7-1.8.7L5 20l-.7-1.8L2.5 17.5l1.8-.7z"/></svg>',

  eye: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeoff: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.9 17.9A10.5 10.5 0 0 1 12 19C5 19 1 12 1 12a18.5 18.5 0 0 1 5.1-5.9M9.9 4.2A9.9 9.9 0 0 1 12 4c7 0 11 7 11 7a18.6 18.6 0 0 1-2.2 3.2M1 1l22 22"/></svg>',
  left: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>',

  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
};
const TABS = [["home", "Inicio", ICON.home], ["history", "Historial", ICON.list], ["charts", "Gráficas", ICON.chart], ["advisor", "Asesor", ICON.spark], ["settings", "Ajustes", ICON.gear]];

// ---------------------------------------------------------------- Vistas
const holo = (inner, cls = "", style = "") => `<section class="holo ${cls}" style="${style}"><div class="in">${inner}</div></section>`;
const glyph = c => `<span class="glyph" style="background:${c.color}2E">${c.emoji}</span>`;
function movementRow(m) {
  const c = catOf(m.category);
  const src = m.source === "pdf" ? " · pdf" : "";
  return `<div class="mv" data-edit="${esc(m.id)}" role="button" tabindex="0">${glyph(c)}<div class="grow"><div class="name">${esc(m.merchant)}</div><div class="meta">${esc(relDay(m.ts))} · ${esc(m.category)}${src}</div></div><div class="amt ${m.income ? "inc" : ""}">${esc(euros(m.income ? m.amount : -m.amount, true))}</div></div>`;
}
const inMonth = (m, [y, mo]) => { const d = new Date(m.ts); return d.getFullYear() === y && d.getMonth() === mo; };

function monthHeader(monthMovs) {
  const inc = monthMovs.filter(m => m.income).reduce((s, m) => s + m.amount, 0);
  const exp = monthMovs.filter(m => !m.income).reduce((s, m) => s + m.amount, 0);
  const net = inc - exp, split = inc + exp > 0 ? inc / (inc + exp) * 100 : 50;
  return `
  <header class="row enter" style="--i:0">
    <span class="diamond-mark"></span>
    <div class="brand grow">Saldo</div>
    <button class="iconbtn" data-act="hide" aria-label="Ocultar importes">${HIDE ? ICON.eyeoff : ICON.eye}</button>
  </header>
  <div class="row enter" style="--i:1">
    <button class="iconbtn" data-act="prev" aria-label="Mes anterior">${ICON.left}</button>
    <div class="grow" style="text-align:center"><div class="month-title" id="monthTitle">${esc(fmtMonth(S.ym[0], S.ym[1]))}</div></div>
    <button class="iconbtn" data-act="next" aria-label="Mes siguiente">${ICON.right}</button>
  </div>
  ${holo(`
    <div class="hud">Balance del mes</div>
    <div class="glow" style="font-size:32px;color:${net >= 0 ? "var(--income)" : "var(--expense)"}" id="netVal" data-scr>${esc(euros(net, true))}</div>
    <div class="flux">${inc + exp > 0 ? `<span class="a" style="width:${split}%"></span><span class="b"></span>` : ""}</div>
    <div class="stats2">
      <div><div class="hud">Ingresos</div><div class="mono inc" style="font-weight:500;font-size:17px" data-scr>${esc(euros(inc, true))}</div></div>
      <div><div class="hud">Gastos</div><div class="mono exp" style="font-weight:500;font-size:17px" data-scr>${esc(euros(-exp, true))}</div></div>
    </div>`, "shimmer enter", "--i:2")}`;
}

function viewHome() {
  const monthMovs = S.movements.filter(m => inMonth(m, S.ym));
  const bal = currentBalance();
  const list = monthMovs.filter(m => m.income === S.showIncome);
  const groups = {};
  list.forEach(m => { const k = S.showIncome ? m.merchant : m.category; groups[k] = (groups[k] || 0) + m.amount; });
  const entries = Object.entries(groups).sort((a, b) => b[1] - a[1]);
  const total = entries.reduce((s, e) => s + e[1], 0);
  const pal = ["#7FB79B", "#6FA2AF", "#9DADCB", "#C9A46E", "#C98E8E", "#A4AAA6"];
  const colorOf = (k, i) => S.showIncome ? pal[i % pal.length] : catOf(k).color;
  const slices = entries.map(([k, v], i) => ({ key: k, color: colorOf(k, i), frac: v / (total || 1) }));
  const sel = entries.find(e => e[0] === S.selCat);
  const center = sel
    ? `<div><div class="tiny" style="color:${colorOf(sel[0], entries.indexOf(sel))}">${esc(sel[0])}</div><div class="glow" style="font-size:19px;color:${colorOf(sel[0], entries.indexOf(sel))}">${esc(euros(sel[1]))}</div><div class="tiny" style="font-size:9px">${Math.round(sel[1] / total * 100)}% del total</div></div>`
    : `<div><div class="glow" style="font-size:19px">${esc(euros(total))}</div><div class="tiny">${S.showIncome ? "Ingresos del mes" : "Gastos del mes"}</div></div>`;
  return `
  ${monthHeader(monthMovs)}
  ${S.movements.length === 0 ? holo(`<div class="hud mag">Sin datos todavía</div><div style="font-family:var(--display);font-weight:700;font-size:17px">Importa tu extracto del banco</div><div class="muted small">En iPhone no se pueden leer las notificaciones del banco. Descarga el extracto en PDF desde la app o la web de tu banco e impórtalo aquí, o añade movimientos con el botón ◆.</div><div><button class="pill on" data-act="import">Importar PDF</button></div>`, "magenta enter", "--i:3") : ""}
  <section class="holo strong violet shimmer enter press" style="--i:3" data-act="balance" role="button" tabindex="0"><div class="in">
    <div class="row"><div class="hud grow">Saldo en cuenta</div>${S.mode === "cloud" ? '<span class="live"><i></i>Sincronizado</span>' : ""}</div>
    ${bal === null
      ? `<div style="font-family:var(--display);font-weight:700;color:var(--cyan);font-size:18px">Toca para indicar tu saldo</div><div class="muted small">Se actualizará con cada movimiento que añadas o importes. Si el extracto incluye el saldo, se usará directamente.</div>`
      : `<div class="glow" style="font-size:36px;${bal >= 0 ? "" : "color:var(--expense)"}" id="balVal">${esc(euros(bal))}</div>
         <div class="tiny">${S.anchor ? "Ajustado " + esc(relDay(S.anchor.ts).toLowerCase()) + " · toca para cambiarlo" : "Según tus extractos"}</div>`}
  </div></section>
  ${holo(`
    <div class="pills"><button class="pill ${!S.showIncome ? "on" : ""}" data-act="showExp">Gastos</button><button class="pill ${S.showIncome ? "on" : ""}" data-act="showInc">Ingresos</button></div>
    <div class="ring-wrap" style="width:min(230px,70vw)"><canvas id="homeRing"></canvas><div class="ring-center">${center}</div></div>
    ${entries.length ? '<div class="hint">Toca el gráfico o una categoría</div>' : `<div class="empty mono small" style="text-align:center">${S.showIncome ? "Sin ingresos este mes" : "Sin gastos este mes"}</div>`}
    ${entries.map(([k, v], i) => {
      const c = colorOf(k, i), p = Math.round(v / total * 100);
      return `<div class="catbar ${S.selCat && S.selCat !== k ? "dim" : ""}" data-cat="${esc(k)}" style="background:${S.selCat === k ? c + "1F" : "transparent"}">
        <div class="row"><span class="sq" style="background:${c}"></span><span class="grow" style="font-weight:500">${esc(k)}</span><span class="mono small">${esc(euros(v))}</span><span class="mono small" style="color:${c};width:44px;text-align:right">${p}%</span></div>
        <div class="bar"><span class="t"></span><span class="f" data-w="${Math.max(2, p)}" style="background:linear-gradient(90deg,${c}26,${c})"></span><span class="dot" data-l="${Math.max(2, p)}" style="background:${c};color:${c}"></span></div></div>`;
    }).join("")}`, "enter", "--i:4")}
  <div class="row enter" style="--i:5;margin-top:4px"><div class="grow"><div style="font-weight:600;font-size:18px">Últimos movimientos</div></div><button class="mono cy small press" data-act="tab:history" >Ver todo</button></div>
  ${holo(S.movements.length ? S.movements.slice(0, 6).map(movementRow).join("") : '<div class="empty">Sin movimientos todavía.</div>', "enter", "--i:6")}
  ${rings.set("homeRing", [{ slices, r: 0.72, w: 0.17, alpha: 1 }], () => S.selCat)}`;
}

function viewHistory() {
  const monthMovs = S.movements.filter(m => inMonth(m, S.ym));
  const shown = monthMovs.filter(m => S.filter === 0 || (S.filter === 2) === m.income);
  const days = [];
  shown.forEach(m => { const k = dkey(new Date(m.ts)); let d = days.find(x => x.k === k); if (!d) days.push(d = { k, list: [] }); d.list.push(m); });
  return `${monthHeader(monthMovs)}
  <div class="pills enter" style="--i:3">${["Todo", "Gastos", "Ingresos"].map((l, i) => `<button class="pill ${S.filter === i ? "on" : ""}" data-filter="${i}">${l}</button>`).join("")}<button class="pill" data-act="import">Importar PDF</button></div>
  ${days.length ? "" : `<div class="empty mono small">Sin registros en ${esc(fmtMonth(S.ym[0], S.ym[1]))}.</div>`}
  ${days.map((d, i) => `<div class="enter" style="--i:${4 + Math.min(i, 8)};display:flex;flex-direction:column;gap:8px">
    <div class="day-h"><span class="hud cyan">${esc(relDay(d.list[0].ts))}</span><span class="mono muted small">${esc(euros(d.list.reduce((s, m) => s + (m.income ? m.amount : -m.amount), 0), true))}</span></div>
    ${holo(d.list.map(movementRow).join(""))}</div>`).join("")}`;
}

function viewCharts() {
  const now = new Date();
  const data = [5, 4, 3, 2, 1, 0].map(k => {
    const y = new Date(now.getFullYear(), now.getMonth() - k, 1);
    const list = S.movements.filter(m => inMonth(m, [y.getFullYear(), y.getMonth()]));
    return { y, inc: list.filter(m => m.income).reduce((s, m) => s + m.amount, 0), exp: list.filter(m => !m.income).reduce((s, m) => s + m.amount, 0) };
  });
  const max = Math.max(1, ...data.map(d => Math.max(d.inc, d.exp)));
  const thisM = S.movements.filter(m => inMonth(m, [now.getFullYear(), now.getMonth()]) && !m.income);
  const top = Object.entries(thisM.reduce((o, m) => (o[m.merchant] = (o[m.merchant] || 0) + m.amount, o), {})).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const bars = data.map((d, i) => {
    const hi = d.inc / max * 100, he = d.exp / max * 100;
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0">
      <div style="height:180px;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:4px">
        <span class="gbar" style="--h:${hi}%;--d:${i * 70}ms;background:var(--income)"></span>
        <span class="gbar" style="--h:${he}%;--d:${i * 70 + 35}ms;background:var(--expense);opacity:.85"></span>
      </div><span class="tiny">${esc(d.y.toLocaleDateString("es-ES", { month: "short" }).replace(".", "").slice(0, 3))}</span></div>`;
  }).join("");
  return `<div class="enter" style="--i:0;padding-top:12px"><div class="title">Gráficas</div><div class="muted">Evolución de los últimos meses</div></div>
  <style>.gbar{width:22%;max-width:20px;height:var(--h);border-radius:6px 6px 2px 2px;animation:grow .8s ease-out both;animation-delay:var(--d)}@keyframes grow{from{height:0}}</style>
  ${holo(`<div class="hud">Ingresos y gastos · 6 meses</div><div style="display:flex;gap:4px;background:repeating-linear-gradient(180deg,transparent 0 44px,var(--line) 44px 45px)">${bars}</div>
  <div class="row small mono muted"><span class="sq" style="background:var(--income)"></span>INGRESOS <span class="sq" style="background:var(--expense);margin-left:12px"></span>GASTOS</div>`, "shimmer enter", "--i:1")}
  <div class="hud enter" style="--i:2">Resultado por mes</div>
  ${holo(data.slice().reverse().map(d => `<div class="spread"><span>${esc(fmtMonth(d.y.getFullYear(), d.y.getMonth()))}</span><b class="mono ${d.inc >= d.exp ? "inc" : "exp"}">${esc(euros(d.inc - d.exp, true))}</b></div>`).join(""), "enter", "--i:3")}
  ${top.length ? holo(`<div class="hud">Dónde más gastas este mes</div>${top.map(([n, v], i) => `<div><div class="row"><span class="mono cy small">0${i + 1}</span><span class="grow">${esc(n)}</span><span class="mono">${esc(euros(v))}</span></div><div style="height:2px;margin-top:6px;background:var(--holo);width:${v / top[0][1] * 100}%"></div></div>`).join("")}`, "enter", "--i:4") : ""}`;
}

function viewAdvisor() {
  const bal = currentBalance();
  const a = analyze(S.movements, S.period, S.salary, bal);
  const tips = [...personalTips(a), ...GENERAL_TIPS];
  const needle = normalize(S.query);
  const shown = tips.filter(t => (!S.topic || (S.topic === "__ti" && t.personal) || t.topic === S.topic) && (!needle || normalize(t.title + " " + t.body + " " + t.topic).includes(needle)));
  const innerTotal = Math.max(a.income, a.expenses) || 1;
  const outer = a.groups.map(x => ({ key: x.g.key, color: x.g.color, frac: x.g.pct / 100 }));
  const inner = a.groups.map(x => ({ key: x.g.key, color: x.g.color, frac: x.act / innerTotal }));
  const deficit = a.expenses > a.income;
  const selG = a.groups.find(x => x.g.key === S.selGroup);
  const center = selG
    ? `<div style="width:130px"><div class="tiny" style="color:${selG.g.color};font-size:9px">${selG.g.emoji} ${esc(selG.g.label)}</div><div class="glow" style="font-size:24px;color:${selG.g.color}">${pct(a.pctOf(selG.act))}</div><div class="mono small">${esc(euros(selG.act))}</div><div class="tiny" style="font-size:8px">Ideal ${selG.g.pct} % · ${esc(euros(selG.rec))}</div></div>`
    : `<div><div class="tiny" style="color:${deficit ? "var(--expense)" : "var(--muted)"}">${deficit ? "Déficit" : "Ahorro"}</div><div class="glow" style="font-size:26px;color:${deficit ? "var(--expense)" : "var(--income)"}">${deficit ? pct(a.pctOf(a.expenses - a.income)) : pct(Math.max(0, a.savingsPct))}</div><div class="mono small">${esc(euros(a.savings, true))}</div><div class="tiny" style="font-size:9px">Ideal 20 %</div></div>`;
  const scoreColor = a.score >= 80 ? "var(--income)" : a.score >= 60 ? "var(--cyan)" : a.score >= 40 ? "var(--gold)" : "var(--expense)";
  const rec = a.income * 0.2, cushionF = Math.min(1, Math.max(0, (bal || 0) / a.cushion));
  return `
  <div class="enter" style="--i:0;padding-top:12px"><div class="title">Asesor</div><div class="muted">Tu economía de un vistazo</div></div>
  <div class="pills enter" style="--i:1">${PERIODS.map(([k, l]) => `<button class="pill ${S.period === k ? "on" : ""}" data-period="${k}">${l}</button>`).join("")}</div>
  <section class="holo strong violet shimmer enter press" style="--i:2" data-act="salary" role="button" tabindex="0"><div class="in"><div class="row"><div class="grow">
    <div class="hud cyan">Sueldo neto mensual</div>
    ${a.income > 0 ? `<div class="glow" style="font-size:26px" id="salVal">${esc(euros(a.income))}</div>` : `<div style="font-family:var(--display);font-weight:700;color:var(--cyan);font-size:17px">Toca para indicarlo</div>`}
    <div class="tiny" style="font-size:9px">${a.source === "MANUAL" ? "Indicado por ti · toca para cambiar" : a.source === "DETECTED" ? "Detectado en tus ingresos · toca para ajustar" : "Sin ingresos en este periodo"}</div>
  </div><span class="cy" style="font-weight:500">Editar</span></div></div></section>
  ${a.income > 0 ? `
  ${holo(`<div class="row" style="gap:16px"><div style="position:relative;width:120px;height:120px;flex:none"><canvas id="scoreRing" style="width:120px;height:120px"></canvas><div class="ring-center"><div><div class="glow" style="font-size:30px;color:${scoreColor}" id="scoreVal">0</div><div class="tiny">de 100</div></div></div></div>
    <div class="grow"><div class="hud">Salud financiera</div><div style="font-family:var(--display);font-weight:700;font-size:20px;color:${scoreColor}">${scoreLabel(a.score)}</div><div class="muted small">Ahorras el ${pct(Math.max(0, a.savingsPct))} de tu sueldo.${a.monthsCovered !== null ? ` Tu saldo cubre ${a.monthsCovered.toFixed(1).replace(".", ",")} meses de gastos.` : ""}</div></div></div>`, "enter", "--i:3")}
  ${holo(`<div class="hud cyan">Reparto de tu sueldo</div><div class="muted small">Exterior: lo recomendado · Interior: lo que gastas</div>
    <div class="ring-wrap"><canvas id="dualRing"></canvas><div class="ring-center">${center}</div></div>
    <div class="hint">Toca la rueda o una partida</div>
    ${a.groups.map(x => {
      const sav = x.g.key === "SAVINGS", scale = Math.max(x.rec, x.act) * 1.15 || 1;
      const idealP = x.rec / scale * 100, actP = x.act / scale * 100, normal = sav ? actP : Math.min(actP, idealP);
      const open = S.selGroup === x.g.key, d = x.delta;
      const msg = sav && x.over ? `Te faltan ${euros(-d)} al mes para llegar al 20 %.` : sav ? `Ahorras ${euros(d)} más de lo recomendado. ¡Bien!` : x.over ? `Te pasas ${euros(d)} al mes (${euros(d * 12)} al año).` : `Te sobran ${euros(-d)} respecto a lo recomendado.`;
      return `<div class="catbar ${S.selGroup && !open ? "dim" : ""}" data-group="${x.g.key}" style="background:${open ? x.g.color + "1F" : "transparent"}">
        <div class="row"><span style="font-size:18px">${x.g.emoji}</span><div class="grow"><div style="font-weight:600">${esc(x.g.label)}</div><div class="tiny" style="font-size:9px">Real ${pct(a.pctOf(x.act))} · Ideal ${x.g.pct} %</div></div>
          <div style="text-align:right"><div class="mono" style="font-weight:700;font-size:13px">${esc(euros(x.act))}</div><div class="mono muted" style="font-size:10px">/ ${esc(euros(x.rec))}</div></div></div>
        <div class="bar"><span class="t"></span><span class="f" data-w="${normal}" style="background:linear-gradient(90deg,${x.g.color}4D,${x.g.color})"></span>${!sav && actP > idealP ? `<span class="over" data-from="${idealP}" data-w="${actP - idealP}" style="left:${idealP}%"></span>` : ""}<span class="ideal" style="left:${idealP}%"></span><span class="dot" data-l="${actP}" style="background:${x.over ? "var(--expense)" : x.g.color};color:${x.over ? "var(--expense)" : x.g.color}"></span></div>
        ${open ? `<div class="muted small" style="margin-top:8px">${esc(x.g.hint)}</div><div class="small" style="margin-top:4px;font-weight:600;color:${x.over ? "var(--expense)" : "var(--income)"}">${esc(msg)}</div>` : ""}
      </div>`;
    }).join("")}`, "enter", "--i:4")}
  ${holo(`<div class="hud inc">Ahorro</div>

if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "pdf.worker.min.js";
async function pdfToText(data, password) {
  const doc = await pdfjsLib.getDocument({ data, password: password || undefined, isEvalSupported: false }).promise;
  let out = "";
  for (let p = 1; p <= doc.numPages; p++) {
    const page = await doc.getPage(p);
    const tc = await page.getTextContent();
    const items = tc.items.filter(i => i.str && i.str.trim()).map(i => ({ s: i.str, x: i.transform[4], y: i.transform[5], w: i.width, h: Math.abs(i.transform[3]) || 8 }));
    items.sort((a, b) => b.y - a.y || a.x - b.x);
    const lines = [];
    items.forEach(it => { const ln = lines.find(l => Math.abs(l.y - it.y) <= Math.max(2, it.h * 0.45)); if (ln) ln.items.push(it); else lines.push({ y: it.y, items: [it] }); });
    lines.sort((a, b) => b.y - a.y);
    lines.forEach(l => {
      l.items.sort((a, b) => a.x - b.x);
      let s = "", end = null;
      l.items.forEach(it => { if (end !== null && it.x - end > it.h * 0.2) s += " "; s += it.s; end = it.x + it.w; });
      out += s + "\n";
    });
  }
  return out;
}
function planImport(st) {
  const key = (d, amt, inc) => `${dkey(d)}|${Math.round(amt * 100)}|${inc}`;
  const pool = new Map();
  S.movements.forEach(m => { const k = key(new Date(m.ts), m.amount, m.income); if (!pool.has(k)) pool.set(k, []); pool.get(k).push(m); });
  const fresh = [], dups = [], updates = [];
  st.lines.forEach(l => {
    let match = null;
    for (const d of [l.date, new Date(+l.date - DAY), new Date(+l.date + DAY)]) { const arr = pool.get(key(d, l.amount, l.income)); if (arr && arr.length) { match = arr.shift(); break; } }
    if (!match) fresh.push(l); else { dups.push(l); if (l.balance !== null) updates.push([match, l.balance]); }
  });
  return { st, fresh, dups, updates };
}
function applyImport(plan) {
  const perDay = {};
  const news = plan.fresh.map(l => { const k = dkey(l.date); perDay[k] = (perDay[k] || 0) + 1; return { id: uid(), amount: l.amount, income: l.income, merchant: l.merchant, category: l.category, ts: new Date(l.date.getFullYear(), l.date.getMonth(), l.date.getDate(), 12).getTime() + perDay[k] * 1000, source: "pdf", raw: l.raw, balance: l.balance }; });
  const updated = plan.updates.map(([m, bal]) => ({ ...m, balance: bal }));
  upsertMovements([...news, ...updated]);
  return news.length;
}

async function readPdf(password) {
  const close = readingSheet();
  const t0 = Date.now();
  let result;
  try {
    if (!window.pdfjsLib) throw new Error("nolib");
    const text = await pdfToText(pdfBytes.slice(), password);
    const st = StatementParser.parse(text);
    if (!text.trim()) result = { error: "Este PDF es una imagen escaneada y no contiene texto. Descarga el extracto desde la app o la web del banco." };
    else if (!st.lines.length) result = { error: "No he encontrado movimientos en este PDF. ¿Es un extracto de cuenta o de tarjeta?" };
    else result = { plan: planImport(st) };
  } catch (err) {
    if (err && err.name === "PasswordException") result = { password: true, wrong: !!password };
    else result = { error: "No se ha podido leer el PDF. Puede que esté dañado o no sea un extracto." };
  }
  await new Promise(r => setTimeout(r, Math.max(0, 1400 - (Date.now() - t0))));
  close();
  if (result.password) passwordDialog(result.wrong);
  else if (result.error) openSheet(`<div class="hud exp">Lectura fallida</div><div style="font-family:var(--display);font-size:20px">No se pudo importar</div><div class="muted">${esc(result.error)}</div><button class="btn-primary" id="eOk">Cerrar</button>`, (ov, c) => { $("#eOk", ov).onclick = c; });
  else previewDialog(result.plan);
}

    <div class="hud cyan">Extracto detectado</div>
    <div style="font-weight:600;font-size:20px">${esc(st.bank || "Extracto bancario")}</div>
    ${st.from ? `<div class="tiny">${esc(fmtShort(st.from))} → ${esc(st.to.toLocaleDateString("es-ES", { day: "numeric", month: "short", year: "numeric" }).replace(".", ""))}</div>` : ""}
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
      <div><div class="glow cy" style="font-size:22px">${plan.fresh.length}</div><div class="tiny" style="font-size:9px">Nuevos</div></div>
      <div><div class="glow muted" style="font-size:22px">${plan.dups.length}</div><div class="tiny" style="font-size:9px">Ya tenías</div></div>
      <div><div class="glow" style="font-size:22px">${st.lines.length}</div><div class="tiny" style="font-size:9px">Total</div></div></div>
    ${plan.fresh.length ? `<div class="spread mono small"><span class="inc">${esc(euros(inc, true))}</span><span class="exp">${esc(euros(-exp, true))}</span></div>` : ""}
    ${st.finalBalance !== null ? `<div class="spread" style="background:rgba(138,92,255,.14);padding:8px 12px"><span class="tiny">Nuevo saldo</span><span class="glow cy" style="font-size:15px">${esc(euros(st.finalBalance))}</span></div>` : ""}
    <div class="scroll">
      ${st.unrecognized.length ? `<details style="background:color-mix(in srgb,var(--warn) 10%,transparent);padding:10px;border-radius:10px"><summary style="color:var(--warn);font-size:13px;cursor:pointer">${st.unrecognized.length} líneas con importes sin reconocer</summary><div class="muted small" style="margin:6px 0">No se importarán. Si son movimientos, haz una captura y envíasela al desarrollador.</div>${st.unrecognized.map(l => `<div class="mono" style="font-size:10px">&gt; ${esc(l)}</div>`).join("")}</details>` : ""}
      ${st.lines.slice().reverse().map((l, i) => { const c = catOf(l.category), isNew = fresh.has(l); return `<div class="row enter" style="--i:${Math.min(i, 12)};padding:7px 0"><span style="width:3px;height:30px;background:${isNew ? c.color : "var(--line)"}"></span><div class="grow"><div style="font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:${isNew ? "var(--text)" : "var(--muted)"}">${esc(l.merchant)}</div><div class="tiny" style="font-size:9px">${esc(fmtShort(l.date))} · ${esc(l.category)}${isNew ? "" : " · ya registrado"}</div></div><b class="mono small" style="color:${!isNew ? "var(--muted)" : l.income ? "var(--income)" : "var(--text)"}">${esc(euros(l.income ? l.amount : -l.amount, true))}</b></div>`; }).join("")}
    </div>
    ${label ? `<button class="btn-primary" id="iOk">${esc(label)}</button>` : '<div class="muted small">Todos los movimientos de este extracto ya estaban en Saldo.</div>'}
    <button class="btn-ghost" id="iNo">${label ? "Cancelar" : "Cerrar"}</button>`,
  (ov, close) => {
    $("#iNo", ov).onclick = close;
    const ok = $("#iOk", ov);
    if (ok) ok.onclick = () => {
      const n = applyImport(plan); close();
      if (st.to) S.ym = [st.to.getFullYear(), st.to.getMonth()];
      if (n > 0) S.tab = "history";
      toast("extracto importado", n > 0 ? `${n} movimientos nuevos${st.bank ? " · " + st.bank : ""}` : "Saldo actualizado", "var(--cyan)");
      render();
    };
  });
}

// ---------------------------------------------------------------- Copia de seguridad
async function exportBackup() {
  const c = window.claude;
  const dl = c && typeof c.use === "function" ? await c.use("downloads").catch(() => null) : null;
  const data = JSON.stringify({ app: "saldo", version: 1, exportedAt: new Date().toISOString(), movements: S.movements, salary: S.salary, anchor: S.anchor }, null, 1);
  if (!dl) { toast("no disponible", "Este navegador no permite descargar archivos desde aquí", "var(--expense)"); return; }
  try { await dl.save({ filename: `saldo-copia-${dkey(new Date())}.json`, data }); toast("copia guardada", `${S.movements.length} movimientos`, "var(--income)"); }
  catch (_) { toast("copia no guardada", "La descarga se canceló", "var(--muted)"); }
}
$("#backupInput").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.movements)) throw 0;
    const ids = new Set(S.movements.map(m => m.id));
    const add = d.movements.filter(m => m && m.id && typeof m.amount === "number" && typeof m.ts === "number" && !ids.has(m.id));
    upsertMovements(add);
    if (d.salary != null && S.salary == null) S.salary = d.salary;
    if (d.anchor && (!S.anchor || d.anchor.ts > S.anchor.ts)) S.anchor = d.anchor;
    Store.saveSettings();
    toast("copia restaurada", `${add.length} movimientos añadidos`, "var(--income)"); render();
  } catch (_) { toast("archivo no válido", "Elige una copia de seguridad de Saldo (.json)", "var(--expense)"); }
});

// ---------------------------------------------------------------- Eventos
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act],[data-tab],[data-edit],[data-cat],[data-group],[data-period],[data-topic],[data-tip],[data-filter]");
  if (!t) return;
  const d = t.dataset;
  if (d.tab) { haptic(); S.tab = d.tab; render(); return; }
  if (d.edit) { movementDialog(S.movements.find(m => m.id === d.edit)); return; }
  if (d.cat !== undefined) { haptic(); S.selCat = S.selCat === d.cat ? null : d.cat; render(); return; }
  if (d.group) { haptic(); S.selGroup = S.selGroup === d.group ? null : d.group; render(); return; }
  if (d.period) { S.period = d.period; S.selGroup = null; lastTab = null; render(); return; }
  if (d.topic !== undefined) { S.topic = d.topic || null; refreshTips(); t.parentElement.querySelectorAll(".pill").forEach(p => p.classList.toggle("on", p === t)); return; }
  if (d.tip) { S.openTip = S.openTip === d.tip ? null : d.tip; t.classList.toggle("open"); return; }
  if (d.filter) { S.filter = +d.filter; render(); return; }
  const act = d.act;
  if (act === "hide") { HIDE = !HIDE; render(); document.querySelectorAll("[data-scr]").forEach(el => scramble(el, el.textContent)); const bv = $("#balVal"); if (bv) scramble(bv, bv.textContent); }
  else if (act === "prev" || act === "next") { const dt = new Date(S.ym[0], S.ym[1] + (act === "next" ? 1 : -1), 1); S.ym = [dt.getFullYear(), dt.getMonth()]; S.selCat = null; render(); scramble($("#monthTitle"), $("#monthTitle").textContent); document.querySelectorAll("[data-scr]").forEach(el => scramble(el, el.textContent)); }
  else if (act === "showExp" || act === "showInc") { S.showIncome = act === "showInc"; S.selCat = null; lastTab = null; render(); }
  else if (act === "balance") numberDialog("Saldo actual", "calibración", "¿Cuánto dinero tienes ahora mismo en tu cuenta?", currentBalance(), v => { S.anchor = { value: v, ts: Date.now() }; Store.saveSettings(); toast("saldo calibrado", euros(v), "var(--violet)"); render(); });
  else if (act === "salary") numberDialog("Sueldo neto mensual", "sueldo", "Lo que cobras al mes en tu cuenta, después de impuestos. Si tienes pagas extra prorrateadas, inclúyelas.", S.salary, v => { S.salary = v && v > 0 ? v : null; Store.saveSettings(); toast("sueldo actualizado", S.salary ? euros(S.salary) + " al mes" : "Se detectará con tus ingresos", "var(--violet)"); lastTab = null; render(); }, '<button class="btn-ghost" id="nExtra">Detectar</button>');
  else if (act === "import") $("#pdfInput").click();
  else if (act === "export") exportBackup();
  else if (act === "restore") $("#backupInput").click();
  else if (act === "clearSearch") { S.query = ""; $("#tipSearch").value = ""; refreshTips(); t.remove(); }
  else if (act === "wipe") openSheet(`<div class="hud exp">Zona peligrosa</div><div style="font-family:var(--display);font-size:19px">Borrar todos los datos</div><div class="muted small">Se eliminarán ${S.movements.length} movimientos, tu saldo y tu sueldo. No se puede deshacer. Si quieres, exporta antes una copia.</div><button class="btn-primary" id="wOk" style="background:var(--expense)">Borrar todo</button><button class="btn-ghost" id="wNo">Cancelar</button>`, (ov, close) => {
    $("#wNo", ov).onclick = close;
    $("#wOk", ov).onclick = () => { const keys = [...new Set(S.movements.map(m => monthKey(m.ts)))]; S.movements = []; S.salary = null; S.anchor = null; Store.saveMonths(keys); Store.saveSettings(); close(); toast("datos borrados", "Saldo está vacío", "var(--expense)"); render(); };
  });
  else if (act && act.startsWith("tab:")) { S.tab = act.slice(4); render(); }
});
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("[role=button]")) { e.preventDefault(); e.target.click(); } });
document.addEventListener("input", e => { if (e.target.id === "tipSearch") { S.query = e.target.value; refreshTips(); } });
function refreshTips() {
  const list = $("#tipList"); if (!list) return;
  const a = analyze(S.movements, S.period, S.salary, currentBalance());
  const tips = [...personalTips(a), ...GENERAL_TIPS];
  const needle = normalize(S.query);
  const shown = tips.filter(t => (!S.topic || (S.topic === "__ti" && t.personal) || t.topic === S.topic) && (!needle || normalize(t.title + " " + t.body + " " + t.topic).includes(needle)));
  list.innerHTML = tipsHtml(shown);
  const h = list.previousElementSibling?.querySelector(".hud"); if (h) h.textContent = `Consejos · ${shown.length} de ${tips.length}`;
}
// Toques en los anillos
document.addEventListener("pointerup", e => {
  const cv = e.target.closest("#homeRing,#dualRing"); if (!cv) return;
  const def = rings.defs.get(cv.id); if (!def) return;
  const key = hitRing(e, cv, def.def);
  haptic();
  if (cv.id === "homeRing") S.selCat = key && key !== S.selCat ? key : null;
  else S.selGroup = key && key !== S.selGroup ? key : null;
  render();
});
$("#fab").addEventListener("click", e => {
  const b = $("#fab").getBoundingClientRect(); burst(b.left + b.width / 2, b.top + b.height / 2); haptic();
  $("#fab").classList.add("spin"); setTimeout(() => $("#fab").classList.remove("spin"), 520);
  setTimeout(() => movementDialog(null), 180);
});

Store.init();
</script>
