<title>Saldo</title>

<style>
/* Layout: una columna tipo app móvil (máx. 560px), barra de pestañas flotante abajo, paneles de cristal con esquinas cortadas. */
:root {
  --void: #04050B; --deep: #0A0E1C; --glass: rgba(255,255,255,.055); --glass2: rgba(255,255,255,.10);
  --line: rgba(255,255,255,.15); --track: rgba(255,255,255,.08);
  --text: #EAF6FF; --muted: #7D89A6; --cyan: #00E5FF; --violet: #8A5CFF; --magenta: #FF3DCB;
  --income: #3DFFB0; --expense: #FF4D6D; --gold: #FFD166;
  --holo: linear-gradient(120deg, var(--cyan), var(--violet), var(--magenta));
  --holo-soft: linear-gradient(120deg, rgba(0,229,255,.55), rgba(138,92,255,.35), rgba(255,61,203,.55));
  --display: "Orbitron", "Exo 2", system-ui, sans-serif;
  --body: "Exo 2", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --cut: 18px;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--void); color: var(--text); font-family: var(--body); font-size: 15px; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--void); }
#cosmos { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
#app { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px calc(130px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input { font: inherit; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.tab-view { display: flex; flex-direction: column; gap: 16px; }

/* ---- Superficies */
.holo { position: relative; padding: 1px; background: var(--holo-soft); clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)); }
.holo.strong { background: var(--holo); }
.holo.plain { background: var(--line); }
.holo > .in { background: linear-gradient(180deg, rgba(16,20,38,.92), rgba(8,11,24,.88)); clip-path: polygon(calc(var(--cut) - .4px) 0, 100% 0, 100% calc(100% - var(--cut) + .4px), calc(100% - var(--cut) + .4px) 100%, 0 100%, 0 calc(var(--cut) - .4px)); padding: 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.holo.violet > .in { background: linear-gradient(180deg, rgba(40,26,80,.85), rgba(12,12,32,.9)); }
.holo.magenta > .in { background: linear-gradient(180deg, rgba(70,14,56,.75), rgba(14,10,28,.9)); }
.shimmer > .in { position: relative; overflow: hidden; }
.shimmer > .in::after { content: ""; position: absolute; inset: -20% auto -20% -60%; width: 45%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.10), rgba(0,229,255,.07), transparent); transform: skewX(-18deg); animation: shimmer 4.6s linear infinite; pointer-events: none; }
@keyframes shimmer { to { left: 140%; } }

.hud { font-family: var(--mono); font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
.hud::before { content: "// "; }
.hud.cyan { color: var(--cyan); } .hud.mag { color: var(--magenta); } .hud.inc { color: var(--income); } .hud.exp { color: var(--expense); }
.glow { font-family: var(--display); font-weight: 700; text-shadow: 0 0 18px currentColor; line-height: 1.1; font-variant-numeric: tabular-nums; }
.grad-text { background: var(--holo); -webkit-background-clip: text; background-clip: text; color: transparent; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.tiny { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.grow { flex: 1; min-width: 0; }
.spread { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.inc { color: var(--income); } .exp { color: var(--expense); } .cy { color: var(--cyan); }

/* ---- Controles */
.pill { font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; padding: 9px 15px; color: var(--muted); background: var(--glass); border: 1px solid var(--line); clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); white-space: nowrap; transition: transform .15s; }
.pill.on { background: var(--holo); color: var(--void); border-color: transparent; }
.pill:active, .press:active { transform: scale(.95); }
.pills { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.pills::-webkit-scrollbar { display: none; }
.btn-primary { width: 100%; padding: 15px; background: var(--holo); color: var(--void); font-family: var(--mono); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: 13px; clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px); position: relative; overflow: hidden; }
.btn-primary::after { content: ""; position: absolute; inset: 0 auto 0 -50%; width: 40%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent); animation: shimmer 2.4s linear infinite; }
.btn-ghost { width: 100%; padding: 10px; font-family: var(--mono); font-size: 12px; letter-spacing: .2em; color: var(--muted); text-transform: uppercase; }
.iconbtn { width: 42px; height: 42px; display: grid; place-items: center; background: var(--glass); border: 1px solid var(--line); color: var(--cyan); clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); flex: none; transition: transform .15s; }
.iconbtn:active { transform: scale(.92); }
.field { width: 100%; padding: 13px 14px; background: rgba(255,255,255,.04); border: 1px solid var(--line); color: var(--text); font-family: var(--mono); font-size: 16px; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
.field:focus { outline: none; border-color: var(--cyan); }
label.lbl { font-family: var(--mono); font-size: 10px; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 6px; }

/* ---- Cabecera */
.brand { font-family: var(--display); font-weight: 900; letter-spacing: .4em; font-size: 18px; position: relative; }
.brand .ghost { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
.brand.glitch .g1 { opacity: .8; color: var(--cyan); transform: translate(var(--gx), var(--gy)); -webkit-text-fill-color: var(--cyan); }
.brand.glitch .g2 { opacity: .8; color: var(--magenta); transform: translate(calc(var(--gx) * -1), calc(var(--gy) * -1)); -webkit-text-fill-color: var(--magenta); }
.diamond-mark { width: 12px; height: 12px; background: var(--holo); transform: rotate(45deg); flex: none; }
.month-title { font-family: var(--display); font-weight: 700; letter-spacing: .1em; font-size: 18px; text-align: center; text-wrap: balance; }
.flux { height: 6px; border-radius: 3px; background: var(--track); position: relative; overflow: hidden; display: flex; }
.flux .a { background: linear-gradient(90deg, var(--cyan), var(--income)); }
.flux .b { background: linear-gradient(90deg, var(--magenta), var(--expense)); flex: 1; }
.flux::after { content: ""; position: absolute; top: 0; bottom: 0; width: 80px; left: -80px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.8), transparent); animation: sweep 2.6s linear infinite; }
@keyframes sweep { to { left: 100%; } }
.stats2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.stats2 > div + div { border-left: 1px solid var(--line); padding-left: 14px; }
.live { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10px; letter-spacing: .15em; color: var(--income); }
.live i { width: 6px; height: 6px; border-radius: 50%; background: var(--income); box-shadow: 0 0 0 4px rgba(61,255,176,.2); animation: pulse 1.1s ease-in-out infinite alternate; }
@keyframes pulse { from { opacity: .35; } to { opacity: 1; } }

/* ---- Listas */
.mv { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-top: 1px solid var(--line); cursor: pointer; transition: transform .15s; }
.mv:first-child { border-top: 0; }
.mv:active { transform: scale(.98); }
.glyph { width: 44px; height: 44px; flex: none; display: grid; place-items: center; font-size: 20px; clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%); }
.mv .name { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mv .meta { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mv .amt { font-family: var(--mono); font-weight: 700; font-size: 15px; white-space: nowrap; }
.day-h { display: flex; justify-content: space-between; padding: 6px 4px 0; }
.catbar { padding: 8px; cursor: pointer; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); transition: background .3s, opacity .3s, transform .15s; }
.catbar:active { transform: scale(.98); }
.catbar.dim { opacity: .4; }
.bar { position: relative; height: 10px; margin-top: 8px; }
.bar .t { position: absolute; left: 0; right: 0; top: 4px; height: 3px; background: var(--track); border-radius: 2px; }
.bar .f { position: absolute; left: 0; top: 4px; height: 3px; border-radius: 2px; width: 0; transition: width 1s cubic-bezier(.2,.8,.2,1); }
.bar .over { position: absolute; top: 4px; height: 3px; background: var(--expense); border-radius: 2px; width: 0; transition: width 1s cubic-bezier(.2,.8,.2,1) .2s; }
.bar .ideal { position: absolute; top: 0; width: 2px; height: 10px; background: #fff; }
.bar .dot { position: absolute; top: 1px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; box-shadow: 0 0 10px currentColor; transition: left 1s cubic-bezier(.2,.8,.2,1); left: 0; }
.sq { width: 8px; height: 8px; transform: rotate(45deg); flex: none; }

.ring-wrap { position: relative; align-self: center; width: min(280px, 78vw); aspect-ratio: 1; max-width: 100%; }
.ring-wrap canvas { width: 100%; height: 100%; display: block; }
.ring-center { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; text-align: center; }
.ring-center > div { animation: pop .35s cubic-bezier(.2,1.4,.4,1); }
@keyframes pop { from { transform: scale(.8); opacity: 0; } }
.hint { font-family: var(--mono); font-size: 9px; letter-spacing: .2em; color: rgba(125,137,166,.65); text-align: center; text-transform: uppercase; }

/* ---- Entrada escalonada */
.enter { animation: enter .65s cubic-bezier(.2,.9,.25,1) both; animation-delay: calc(var(--i, 0) * 60ms); }
@keyframes enter { from { opacity: 0; transform: translateY(28px) scale(.95); } }

/* ---- Barra inferior y botón */
.nav { position: fixed; z-index: 20; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); width: min(528px, calc(100% - 2 * max(16px, env(safe-area-inset-left, 0px)))); }
.nav .in { padding: 0 !important; flex-direction: row !important; gap: 0 !important; background: rgba(4,5,11,.94) !important; position: relative; }
.nav .spot { position: absolute; top: 0; bottom: 0; width: 20%; background: linear-gradient(180deg, rgba(0,229,255,.16), transparent); transition: left .45s cubic-bezier(.3,1.5,.4,1); }
.nav .spot::before { content: ""; position: absolute; top: 0; left: 15%; right: 15%; height: 3px; background: linear-gradient(90deg, transparent, var(--cyan), var(--magenta), transparent); }
.nav button { flex: 1; padding: 11px 2px 9px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); font-family: var(--mono); font-size: 9px; letter-spacing: .06em; text-transform: uppercase; position: relative; transition: color .3s; }
.nav button svg { width: 22px; height: 22px; transition: transform .35s cubic-bezier(.3,1.6,.4,1); }
.nav button.on { color: var(--text); }
.nav button.on svg { color: var(--cyan); transform: translateY(-3px) scale(1.15); }
.fab { position: fixed; z-index: 21; right: max(18px, calc(50% - 262px)); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); width: 84px; height: 84px; display: grid; place-items: center; }
.fab .core { width: 56px; height: 56px; background: var(--holo); transform: rotate(45deg); clip-path: polygon(14% 0, 86% 0, 100% 14%, 100% 86%, 86% 100%, 14% 100%, 0 86%, 0 14%); display: grid; place-items: center; transition: transform .5s cubic-bezier(.3,1.5,.4,1); }
.fab .core svg { transform: rotate(-45deg); color: var(--void); width: 26px; height: 26px; }
.fab.spin .core { transform: rotate(225deg); }
.fab::before { content: ""; position: absolute; inset: 10px; border-radius: 50%; border: 2px solid var(--cyan); animation: ripple 2.2s linear infinite; }
@keyframes ripple { from { transform: scale(.6); opacity: .5; } to { transform: scale(1.05); opacity: 0; } }
.particle { position: fixed; z-index: 22; width: 6px; height: 6px; border-radius: 50%; pointer-events: none; animation: burst .7s cubic-bezier(.1,.8,.3,1) forwards; }
@keyframes burst { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }

/* ---- Capas */
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(4,5,11,.86); display: flex; align-items: center; justify-content: center; padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: fade .25s; }
@keyframes fade { from { opacity: 0; } }
.sheet { width: min(520px, 100%); max-height: 100%; display: flex; animation: rise .4s cubic-bezier(.2,1.2,.4,1); }
.sheet > .holo { width: 100%; display: flex; }
.sheet .in { width: 100%; overflow: hidden; }
.sheet .scroll { overflow-y: auto; min-height: 0; flex: 1 1 auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 4px; }
@keyframes rise { from { transform: translateY(30px) scale(.94); opacity: 0; } }
.toast { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); top: calc(12px + env(safe-area-inset-top, 0px)); width: min(520px, calc(100% - 32px)); animation: drop .5s cubic-bezier(.2,1.4,.4,1); }
.toast.out { animation: lift .35s forwards; }
@keyframes drop { from { transform: translate(-50%, -140%); } }
@keyframes lift { to { transform: translate(-50%, -160%); opacity: 0; } }
.toast .in { padding: 13px 16px !important; flex-direction: row !important; align-items: center; position: relative; overflow: hidden; }
.toast .in::after { content: ""; position: absolute; inset: 0 auto 0 -30%; width: 30%; background: linear-gradient(90deg, transparent, var(--tc, var(--cyan)), transparent); opacity: .35; animation: shimmer 1.2s linear forwards; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 6px 10px; font-size: 13px; color: var(--muted); background: var(--glass); border: 1px solid var(--line); clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
.chip.on { color: var(--text); }

/* ---- Arranque */
#boot { position: fixed; inset: 0; z-index: 60; background: var(--void); display: grid; place-items: center; transition: opacity .45s, transform .45s; background-image: linear-gradient(rgba(0,229,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0,229,255,.04) 1px, transparent 1px); background-size: 32px 32px; }
#boot.out { opacity: 0; transform: scale(1.15); pointer-events: none; }
#boot .wrap { display: flex; flex-direction: column; align-items: center; gap: 18px; }
#boot canvas { width: 200px; height: 200px; }
#boot .logo { font-family: var(--display); font-weight: 900; font-size: 34px; letter-spacing: .9em; padding-left: .9em; animation: condense 1s cubic-bezier(.2,.9,.2,1) .2s both; }
@keyframes condense { from { letter-spacing: 1.6em; opacity: 0; } to { letter-spacing: .2em; opacity: 1; } }
#boot .bar2 { width: 220px; height: 3px; background: var(--track); }
#boot .bar2 i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--cyan), var(--magenta)); transition: width .4s; }

/* ---- Consejos */
.tip { cursor: pointer; }
.tip .body { color: var(--muted); font-size: 13px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
.tip.open .body { -webkit-line-clamp: unset; display: block; }
.tag-save { font-family: var(--mono); font-size: 9px; font-weight: 700; background: var(--income); color: var(--void); padding: 2px 6px; white-space: nowrap; }
.search { position: relative; }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--cyan); }
.search .field { padding-left: 40px; font-family: var(--body); font-size: 15px; }
.search .clear { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 18px; width: 30px; height: 30px; }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
.kv b { font-family: var(--mono); text-align: right; }
.banner { font-size: 12px; color: var(--muted); padding: 10px 12px; border: 1px dashed var(--line); }
.empty { color: var(--muted); padding: 8px 2px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>

<script>
"use strict";
/* =====================================================================
 * Saldo · versión web para iPhone
 * Misma lógica que la app Android: lector de extractos PDF, asesor y consejos.
 * ===================================================================== */

// ---------------------------------------------------------------- Utilidades
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const NF2 = new Intl.NumberFormat("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const NF0 = new Intl.NumberFormat("es-ES", { maximumFractionDigits: 0 });
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
let HIDE = false;
function euros(v, signed = false) {
  if (HIDE) return "••••• €";
  const sign = signed ? (v > 0 ? "+" : v < 0 ? "-" : "") : (v < 0 ? "-" : "");
  return sign + NF2.format(Math.abs(v)) + " €";
}
const e0 = v => NF0.format(v) + " €";
const pct = v => Math.round(v) + " %";
const DAY = 86400000;
const pad = n => String(n).padStart(2, "0");
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const monthKey = ts => { const d = new Date(ts); return `m-${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const fmtMonth = (y, m) => { const s = new Date(y, m, 1).toLocaleDateString("es-ES", { month: "long" }); return s[0].toUpperCase() + s.slice(1) + " " + y; };
const fmtShort = d => d.toLocaleDateString("es-ES", { day: "numeric", month: "short" }).replace(".", "");
function relDay(ts) {
  const d = startOfDay(new Date(ts)), t = startOfDay(new Date());
  const diff = Math.round((t - d) / DAY);
  if (diff === 0) return "Hoy";
  if (diff === 1) return "Ayer";
  return d.toLocaleDateString("es-ES", { weekday: "short", day: "numeric", month: "short" }).replace(/\./g, "");
}
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const normalize = s => String(s).toLowerCase().normalize("NFD").replace(/\p{M}+/gu, "").trim();
function parseNumber(raw) {
  const s = String(raw).replace(/[\s ]/g, "").replace(/€|eur/gi, "");
  if (!s) return null;
  const neg = /^[-−]/.test(s);
  const t = s.replace(/^[-+−]/, "");
  const lastDot = t.lastIndexOf("."), lastComma = t.lastIndexOf(",");
  let n;
  if (lastDot >= 0 && lastComma >= 0) n = lastComma > lastDot ? t.replace(/\./g, "").replace(",", ".") : t.replace(/,/g, "");
  else if (lastComma >= 0) n = t.replace(",", ".");
  else if (lastDot >= 0) n = (t.length - lastDot - 1 === 3) ? t.replace(/\./g, "") : t;
  else n = t;
  const v = Number(n);
  return Number.isFinite(v) ? (neg ? -v : v) : null;
}

  }

const S = {
  movements: [], salary: null, anchor: null,
  tab: "home", ym: [new Date().getFullYear(), new Date().getMonth()], filter: 0, showIncome: false, selCat: null,
  period: "LAST_30", selGroup: null, query: "", topic: null, openTip: null,
  mode: "starting", storeNote: "",

const LS_KEY = "saldo.web.v1";
const Store = {
  db: null, uid: null, queue: {},
  loadLocal() { try { const raw = localStorage.getItem(LS_KEY); if (raw) { const d = JSON.parse(raw); S.movements = d.movements || []; S.salary = d.salary ?? null; S.anchor = d.anchor ?? null; } } catch (_) {} },
  saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify({ movements: S.movements, salary: S.salary, anchor: S.anchor })); } catch (_) {} },
  clearLocal() { try { localStorage.removeItem(LS_KEY); } catch (_) {} },
  // Una escritura cada vez por documento
  write(docId, body) {
    if (!this.db) return;
    const ref = this.db.collection("data/users/" + this.uid).doc(docId);
    const prev = this.queue[docId] || Promise.resolve();
    const next = prev.catch(() => {}).then(() => body === null ? ref.delete() : ref.set(body)).catch(err => {
      if (err && err.code === "quota_exceeded") toast("almacenamiento lleno", "Borra movimientos antiguos para seguir guardando", "var(--expense)");
      else if (err && err.code === "unavailable") setTimeout(() => this.write(docId, body), 1500 + Math.random() * 1000);
    });
    this.queue[docId] = next;
  },
  saveMonths(keys) {
    if (this.db) keys.forEach(k => { const list = S.movements.filter(m => monthKey(m.ts) === k); this.write(k, list.length ? { movements: list } : null); });
    else this.saveLocal();
  },
  saveSettings() { if (this.db) this.write("settings", { salary: S.salary, anchor: S.anchor }); else this.saveLocal(); },
  async init() {
    this.loadLocal();
    render();
    const c = window.claude;
    if (!c || typeof c.use !== "function") { S.mode = "local"; S.storeNote = "Guardado en este navegador."; render(); return; }
    let db = null, user = null;
    try { [db, user] = await Promise.all([c.use("db"), c.use("user")]); } catch (_) {}
    const id = user ? await user.id() : null;
    if (!db || !id) { S.mode = "local"; S.storeNote = "Guardado solo en este navegador. Inicia sesión en Claude para guardarlo en tu cuenta."; render(); return; }
    this.db = db; this.uid = id;
    let first = true;
    db.collection("data/users/" + id).onSnapshot(snap => {
      const movs = []; let settings = null;
      snap.docs.forEach(d => {
        if (!d.exists) return;
        const body = d.data();
        if (d.id === "settings") settings = body;
        else if (d.id.startsWith("m-") && Array.isArray(body.movements)) movs.push(...body.movements);
      });
      if (first) {
        first = false;
        // Migra lo guardado antes en el navegador
        if (snap.empty && S.movements.length) {
          const keys = [...new Set(S.movements.map(m => monthKey(m.ts)))];
          this.saveMonths(keys); this.saveSettings(); this.clearLocal();
          S.mode = "cloud"; S.storeNote = "Guardado en tu zona privada de Claude."; render(); return;
        }
        this.clearLocal();
      }
      S.movements = movs.sort((a, b) => b.ts - a.ts);
      if (settings) { S.salary = settings.salary ?? null; S.anchor = settings.anchor ?? null; }
      S.mode = "cloud"; S.storeNote = "Guardado en tu zona privada de Claude: solo tú puedes verlo.";
      render();
    }, () => { S.mode = "local"; S.storeNote = "No se pudo conectar con tu almacenamiento. Los cambios se guardan en este navegador."; this.db = null; render(); });
  },
};
function upsertMovements(list) {
  const keys = new Set();
  list.forEach(m => {
    const i = S.movements.findIndex(x => x.id === m.id);
    if (i >= 0) { keys.add(monthKey(S.movements[i].ts)); S.movements[i] = m; } else S.movements.push(m);
    keys.add(monthKey(m.ts));
  });
  S.movements.sort((a, b) => b.ts - a.ts);
  Store.saveMonths([...keys]);
}
function deleteMovement(id) {
  const m = S.movements.find(x => x.id === id); if (!m) return;
  S.movements = S.movements.filter(x => x.id !== id);
  Store.saveMonths([monthKey(m.ts)]);
}
function currentBalance() {
  const withBal = S.movements.filter(m => m.balance != null).sort((a, b) => b.ts - a.ts)[0];
  const anchors = [S.anchor, withBal ? { value: withBal.balance, ts: withBal.ts } : null].filter(Boolean);
  if (!anchors.length) return null;
  const a = anchors.sort((p, q) => q.ts - p.ts)[0];
  return a.value + S.movements.filter(m => m.ts > a.ts).reduce((s, m) => s + (m.income ? m.amount : -m.amount), 0);

(function cosmos() {

  let W, H, dpr;
  const stars = Array.from({ length: 90 }, () => [Math.random(), Math.random(), Math.random()]);
  const resize = () => { dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; };

    const a = t / 18 * Math.PI * 2;

    ctx.fillStyle = "#04050B"; ctx.fillRect(0, 0, W, H);
    aur(W * (0.2 + 0.15 * Math.sin(a)), H * (0.12 + 0.05 * Math.cos(a)), W * 0.9, "rgba(138,92,255,A)", 0.32);
    aur(W * (0.9 + 0.1 * Math.cos(a)), H * (0.38 + 0.08 * Math.sin(a)), W * 0.8, "rgba(0,229,255,A)", 0.16);
    aur(W * (0.1 + 0.1 * Math.cos(a + 1)), H * (0.85 + 0.04 * Math.sin(a)), W * 0.9, "rgba(255,61,203,A)", 0.14);
    stars.forEach(([x, y, z]) => { const tw = 0.35 + 0.65 * (Math.sin(a * 3 + z * 20) + 1) / 2; ctx.fillStyle = `rgba(255,255,255,${0.1 + 0.35 * z * tw})`; ctx.beginPath(); ctx.arc(x * W, y * H, 0.6 + z * 1.4, 0, 7); ctx.fill(); });

    for (let i = 0; i < 10; i++) { const p = (i + shift) / 10, y = hz + (H - hz) * p * p; ctx.strokeStyle = `rgba(0,229,255,${0.03 + 0.1 * p})`; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  const fn = (cv, now) => {
    const [ctx, W, H] = setupCanvas(cv);
    const cx = W / 2, cy = H / 2, R = Math.min(W, H) / 2;
    const t = reduceMotion ? 1e9 : now - t0;
    ctx.clearRect(0, 0, W, H);
    ticks(ctx, cx, cy, R, (reduceMotion ? 0 : now / 30000) * Math.PI * 2, 90, 9);
    const pulse = 0.5 + 0.5 * (Math.sin(now / 900) + 1) / 2;
    const sel = getSel();
    rings.forEach((ring, ri) => {
      const appear = Math.min(1, Math.max(0, (t - ri * 350) / 1100)); const k = 1 - Math.pow(1 - appear, 3);
      const r = R * ring.r, w = R * ring.w;
      arc(ctx, cx, cy, r, 0, Math.PI * 2, "rgba(255,255,255,.08)", w);
      let start = -Math.PI / 2; const gap = ring.slices.length > 1 ? 0.035 : 0;
      ring.slices.forEach(s => {
        const sweep = s.frac * Math.PI * 2 * k;
        if (sweep > 0.004) {
          const isSel = sel === s.key, dim = sel && !isSel ? 0.35 : 1;
          const ww = isSel ? w * 1.45 : w;
          ctx.globalAlpha = ring.alpha * dim;
          arc(ctx, cx, cy, r, start + gap / 2, start + Math.max(gap / 2 + 0.004, sweep - gap / 2), s.color, ww, (10 + 10 * pulse) * (isSel ? 1.6 : 1));
          ctx.globalAlpha = 0.3 * ring.alpha * dim;
          arc(ctx, cx, cy, r - ww / 2 + 1, start + gap / 2, start + Math.max(gap / 2 + 0.004, sweep - gap / 2), "#fff", 1.2);
          ctx.globalAlpha = 1;
        }
        start += sweep;
      });
    });
    // Partícula en órbita
    const oa = (reduceMotion ? 0 : now / 6000) * Math.PI * 2 - Math.PI / 2, orr = R * rings[0].r + R * 0.07;
    ctx.fillStyle = "rgba(0,229,255,.25)"; ctx.beginPath(); ctx.arc(cx + Math.cos(oa) * orr, cy + Math.sin(oa) * orr, 8, 0, 7); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(cx + Math.cos(oa) * orr, cy + Math.sin(oa) * orr, 3, 0, 7); ctx.fill();
  };
  fn.t0 = t0;
  return fn;
}
function hitRing(ev, cv, rings) {
  const b = cv.getBoundingClientRect(), x = ev.clientX - b.left - b.width / 2, y = ev.clientY - b.top - b.height / 2;
  const R = Math.min(b.width, b.height) / 2, dist = Math.hypot(x, y);
  let best = null, bd = 1e9;
  rings.forEach(ring => { const d = Math.abs(dist - R * ring.r); if (d < bd && d < R * ring.w * 1.4) { bd = d; best = ring; } });
  if (!best) return null;
  let ang = Math.atan2(y, x) + Math.PI / 2; if (ang < 0) ang += Math.PI * 2;
  let acc = 0;
  for (const s of best.slices) { acc += s.frac * Math.PI * 2; if (ang <= acc) return s.key; }
  return null;
}

const inMonth = (m, [y, mo]) => { const d = new Date(m.ts); return d.getFullYear() === y && d.getMonth() === mo; };

function monthHeader(monthMovs) {

  return `
  <header class="row enter" style="--i:0">
    <span class="diamond-mark"></span>
    <div class="brand grad-text grow">SALDO<span class="ghost g1" aria-hidden="true">SALDO</span><span class="ghost g2" aria-hidden="true">SALDO</span></div>

  ${holo(`
    <div class="hud">Balance del ciclo</div>

    <div class="flux">${inc + exp > 0 ? `<span class="a" style="width:${split}%"></span><span class="b"></span>` : ""}</div>
    <div class="stats2">
      <div><div class="hud">↑ Ingresos</div><div class="mono inc" style="font-weight:700;font-size:17px" data-scr>${esc(euros(inc, true))}</div></div>
      <div><div class="hud">↓ Gastos</div><div class="mono exp" style="font-weight:700;font-size:17px" data-scr>${esc(euros(-exp, true))}</div></div>
    </div>`, "shimmer enter", "--i:2")}`;
}

  const colorOf = (k, i) => S.showIncome ? pal[i % pal.length] : catOf(k).color;

// ---------------------------------------------------------------- Render
let lastTab = null;
function render() {
  const app = $("#app");
  const tabChanged = lastTab !== S.tab;
  rings.defs.clear();
  const html = S.tab === "home" ? viewHome() : S.tab === "history" ? viewHistory() : S.tab === "charts" ? viewCharts() : S.tab === "advisor" ? viewAdvisor() : viewSettings();
  const keepScroll = !tabChanged ? scrollY : 0;
  app.innerHTML = `<div class="tab-view">${html}</div>`;
  if (!tabChanged) app.querySelectorAll(".enter").forEach(el => { el.style.animation = "none"; });
  else scrollTo(0, 0);
  if (!tabChanged) scrollTo(0, keepScroll);
  // Barras con animación de crecimiento
  requestAnimationFrame(() => {
    app.querySelectorAll(".bar .f[data-w]").forEach(el => { el.style.width = el.dataset.w + "%"; });
    app.querySelectorAll(".bar .over[data-w]").forEach(el => { el.style.width = el.dataset.w + "%"; });
    app.querySelectorAll(".bar .dot[data-l]").forEach(el => { el.style.left = Math.min(100, el.dataset.l) + "%"; });
  });
  rings.defs.forEach(({ def, getSel }, id) => anims.set(id, ringAnimator(def, getSel, tabChanged || !anims.has(id) ? performance.now() : (anims.get(id).t0 || performance.now()))));
  const sc = $("#scoreRing");
  if (sc) {
    const a = analyze(S.movements, S.period, S.salary, currentBalance());
    const t0 = performance.now(), target = a.score / 100;
    const col = a.score >= 80 ? "#3DFFB0" : a.score >= 60 ? "#00E5FF" : a.score >= 40 ? "#FFD166" : "#FF4D6D";
    anims.set("scoreRing", (cv, now) => {
      const [ctx, W, H] = setupCanvas(cv);
      const p = reduceMotion ? 1 : Math.min(1, (now - t0) / 1400), k = (1 - Math.pow(1 - p, 3)) * target;
      ctx.clearRect(0, 0, W, H);
      const cx = W / 2, cy = H / 2, r = W / 2 - 14, a0 = Math.PI * 150 / 180;
      ctx.lineCap = "round";
      arc(ctx, cx, cy, r, a0, a0 + Math.PI * 240 / 180, "rgba(255,255,255,.08)", 12);
      const g = ctx.createConicGradient ? ctx.createConicGradient(a0, cx, cy) : null;
      if (g) { g.addColorStop(0, "#FF4D6D"); g.addColorStop(0.22, "#FFD166"); g.addColorStop(0.44, "#00E5FF"); g.addColorStop(0.62, "#3DFFB0"); g.addColorStop(1, "#3DFFB0"); }
      arc(ctx, cx, cy, r, a0, a0 + Math.PI * 240 / 180 * k, g || col, 12, 14 + 6 * Math.sin(now / 500));
      const ea = a0 + Math.PI * 240 / 180 * k;
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(cx + Math.cos(ea) * r, cy + Math.sin(ea) * r, 4, 0, 7); ctx.fill();
      ctx.lineCap = "butt";
      const v = $("#scoreVal"); if (v) v.textContent = Math.round(k * 100);
    });
  }
  // Cifras: contador y descifrado
  if (tabChanged) {
    app.querySelectorAll("[data-scr]").forEach(el => scramble(el, el.textContent));
    const bv = $("#balVal"); if (bv) { bv.dataset.v = 0; countUp(bv, currentBalance() || 0, v => euros(v)); }
    const sv = $("#salVal"); if (sv) { sv.dataset.v = 0; const a = analyze(S.movements, S.period, S.salary, currentBalance()); countUp(sv, a.income, v => euros(v)); }
  }
  // Barra de navegación
  const idx = TABS.findIndex(t => t[0] === S.tab);
  const navIn = $("#nav .in");
  if (!navIn.querySelector("button")) navIn.insertAdjacentHTML("beforeend", TABS.map(([k, l, ic]) => `<button data-tab="${k}" aria-label="${l}">${ic}<span>${l}</span></button>`).join(""));
  navIn.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.tab === S.tab));
  $("#spot").style.left = (idx * 20) + "%";
  $("#fab").hidden = !(S.tab === "home" || S.tab === "history");
  if (tabChanged && lastTab !== null) scanLine();
  lastTab = S.tab;
}
function scanLine() {
  if (reduceMotion) return;
  const l = document.createElement("div");
  l.style.cssText = "position:fixed;left:0;right:0;top:0;height:120px;z-index:30;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(0,229,255,.18));border-bottom:2px solid rgba(0,229,255,.8);transition:transform .52s linear,opacity .52s linear;transform:translateY(-120px)";
  document.body.appendChild(l);
  requestAnimationFrame(() => { l.style.transform = `translateY(${innerHeight}px)`; l.style.opacity = "0"; });
  setTimeout(() => l.remove(), 600);
}

if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "pdf.worker.min.js";
async function pdfToText(data, password) {
  const doc = await pdfjsLib.getDocument({ data, password: password || undefined, isEvalSupported: false }).promise;
  let out = "";
  for (let p = 1; p <= doc.numPages; p++) {
    const page = await doc.getPage(p);
    const tc = await page.getTextContent();
    const items = tc.items.filter(i => i.str && i.str.trim()).map(i => ({ s: i.str, x: i.transform[4], y: i.transform[5], w: i.width, h: Math.abs(i.transform[3]) || 8 }));
    items.sort((a, b) => b.y - a.y || a.x - b.x);
    const lines = [];
    items.forEach(it => { const ln = lines.find(l => Math.abs(l.y - it.y) <= Math.max(2, it.h * 0.45)); if (ln) ln.items.push(it); else lines.push({ y: it.y, items: [it] }); });
    lines.sort((a, b) => b.y - a.y);
    lines.forEach(l => {
      l.items.sort((a, b) => a.x - b.x);
      let s = "", end = null;
      l.items.forEach(it => { if (end !== null && it.x - end > it.h * 0.2) s += " "; s += it.s; end = it.x + it.w; });
      out += s + "\n";
    });
  }
  return out;
}
function planImport(st) {
  const key = (d, amt, inc) => `${dkey(d)}|${Math.round(amt * 100)}|${inc}`;
  const pool = new Map();
  S.movements.forEach(m => { const k = key(new Date(m.ts), m.amount, m.income); if (!pool.has(k)) pool.set(k, []); pool.get(k).push(m); });
  const fresh = [], dups = [], updates = [];
  st.lines.forEach(l => {
    let match = null;
    for (const d of [l.date, new Date(+l.date - DAY), new Date(+l.date + DAY)]) { const arr = pool.get(key(d, l.amount, l.income)); if (arr && arr.length) { match = arr.shift(); break; } }
    if (!match) fresh.push(l); else { dups.push(l); if (l.balance !== null) updates.push([match, l.balance]); }
  });
  return { st, fresh, dups, updates };
}
function applyImport(plan) {
  const perDay = {};
  const news = plan.fresh.map(l => { const k = dkey(l.date); perDay[k] = (perDay[k] || 0) + 1; return { id: uid(), amount: l.amount, income: l.income, merchant: l.merchant, category: l.category, ts: new Date(l.date.getFullYear(), l.date.getMonth(), l.date.getDate(), 12).getTime() + perDay[k] * 1000, source: "pdf", raw: l.raw, balance: l.balance }; });
  const updated = plan.updates.map(([m, bal]) => ({ ...m, balance: bal }));
  upsertMovements([...news, ...updated]);
  return news.length;
}
let pdfBytes = null;

function readingSheet() {

async function readPdf(password) {
  const close = readingSheet();
  const t0 = Date.now();
  let result;
  try {
    if (!window.pdfjsLib) throw new Error("nolib");
    const text = await pdfToText(pdfBytes.slice(), password);
    const st = StatementParser.parse(text);
    if (!text.trim()) result = { error: "Este PDF es una imagen escaneada y no contiene texto. Descarga el extracto desde la app o la web del banco." };
    else if (!st.lines.length) result = { error: "No he encontrado movimientos en este PDF. ¿Es un extracto de cuenta o de tarjeta?" };
    else result = { plan: planImport(st) };
  } catch (err) {
    if (err && err.name === "PasswordException") result = { password: true, wrong: !!password };
    else result = { error: "No se ha podido leer el PDF. Puede que esté dañado o no sea un extracto." };
  }
  await new Promise(r => setTimeout(r, Math.max(0, 1400 - (Date.now() - t0))));
  close();
  if (result.password) passwordDialog(result.wrong);
  else if (result.error) openSheet(`<div class="hud exp">Lectura fallida</div><div style="font-family:var(--display);font-size:20px">No se pudo importar</div><div class="muted">${esc(result.error)}</div><button class="btn-primary" id="eOk">Cerrar</button>`, (ov, c) => { $("#eOk", ov).onclick = c; });
  else previewDialog(result.plan);
}
function passwordDialog(wrong) {

    <input class="field" id="pw" type="password" autocomplete="off" placeholder="Contraseña" style="${wrong ? "border-color:var(--expense)" : ""}">
    ${wrong ? '<div class="small exp">Contraseña incorrecta</div>' : ""}
    <button class="btn-primary" id="pwOk">Abrir</button><button class="btn-ghost" id="pwNo">Cancelar</button>`,
  (ov, close) => { setTimeout(() => $("#pw", ov).focus(), 50); $("#pwNo", ov).onclick = close; $("#pwOk", ov).onclick = () => { const v = $("#pw", ov).value.trim(); if (!v) return; close(); readPdf(v); }; });
}
function previewDialog(plan) {
  const st = plan.st, fresh = new Set(plan.fresh);
  const inc = plan.fresh.filter(l => l.income).reduce((s, l) => s + l.amount, 0), exp = plan.fresh.filter(l => !l.income).reduce((s, l) => s + l.amount, 0);
  const label = plan.fresh.length ? `Importar ${plan.fresh.length} movimientos` : st.finalBalance !== null ? "Actualizar saldo" : null;
  openSheet(`
    <div class="hud cyan">Extracto detectado</div>
    <div class="grad-text" style="font-family:var(--display);font-weight:900;font-size:18px;letter-spacing:.08em">${esc((st.bank || "Extracto bancario").toUpperCase())}</div>
    ${st.from ? `<div class="tiny">${esc(fmtShort(st.from))} → ${esc(st.to.toLocaleDateString("es-ES", { day: "numeric", month: "short", year: "numeric" }).replace(".", ""))}</div>` : ""}
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
      <div><div class="glow cy" style="font-size:22px">${plan.fresh.length}</div><div class="tiny" style="font-size:9px">Nuevos</div></div>
      <div><div class="glow muted" style="font-size:22px">${plan.dups.length}</div><div class="tiny" style="font-size:9px">Ya tenías</div></div>
      <div><div class="glow" style="font-size:22px">${st.lines.length}</div><div class="tiny" style="font-size:9px">Total</div></div></div>
    ${plan.fresh.length ? `<div class="spread mono small"><span class="inc">${esc(euros(inc, true))}</span><span class="exp">${esc(euros(-exp, true))}</span></div>` : ""}
    ${st.finalBalance !== null ? `<div class="spread" style="background:rgba(138,92,255,.14);padding:8px 12px"><span class="tiny">Nuevo saldo</span><span class="glow cy" style="font-size:15px">${esc(euros(st.finalBalance))}</span></div>` : ""}
    <div class="scroll">
      ${st.unrecognized.length ? `<details style="background:rgba(255,61,203,.1);padding:10px"><summary class="mono" style="color:var(--magenta);font-size:10px;letter-spacing:.1em;cursor:pointer">⚠ ${st.unrecognized.length} LÍNEAS CON IMPORTES SIN RECONOCER</summary><div class="muted small" style="margin:6px 0">No se importarán. Si son movimientos, haz una captura y envíasela al desarrollador.</div>${st.unrecognized.map(l => `<div class="mono" style="font-size:10px">&gt; ${esc(l)}</div>`).join("")}</details>` : ""}
      ${st.lines.slice().reverse().map((l, i) => { const c = catOf(l.category), isNew = fresh.has(l); return `<div class="row enter" style="--i:${Math.min(i, 12)};padding:7px 0"><span style="width:3px;height:30px;background:${isNew ? c.color : "var(--line)"}"></span><div class="grow"><div style="font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:${isNew ? "var(--text)" : "var(--muted)"}">${esc(l.merchant)}</div><div class="tiny" style="font-size:9px">${esc(fmtShort(l.date))} · ${esc(l.category)}${isNew ? "" : " · ya registrado"}</div></div><b class="mono small" style="color:${!isNew ? "var(--muted)" : l.income ? "var(--income)" : "var(--text)"}">${esc(euros(l.income ? l.amount : -l.amount, true))}</b></div>`; }).join("")}
    </div>
    ${label ? `<button class="btn-primary" id="iOk">${esc(label)}</button>` : '<div class="muted small">Todos los movimientos de este extracto ya estaban en Saldo.</div>'}
    <button class="btn-ghost" id="iNo">${label ? "Cancelar" : "Cerrar"}</button>`,
  (ov, close) => {
    $("#iNo", ov).onclick = close;
    const ok = $("#iOk", ov);
    if (ok) ok.onclick = () => {
      const n = applyImport(plan); close();
      if (st.to) S.ym = [st.to.getFullYear(), st.to.getMonth()];
      if (n > 0) S.tab = "history";
      toast("extracto importado", n > 0 ? `${n} movimientos nuevos${st.bank ? " · " + st.bank : ""}` : "Saldo actualizado", "var(--cyan)");
      render();
    };
  });
}

// ---------------------------------------------------------------- Copia de seguridad
async function exportBackup() {
  const c = window.claude;
  const dl = c && typeof c.use === "function" ? await c.use("downloads").catch(() => null) : null;
  const data = JSON.stringify({ app: "saldo", version: 1, exportedAt: new Date().toISOString(), movements: S.movements, salary: S.salary, anchor: S.anchor }, null, 1);
  if (!dl) { toast("no disponible", "Este navegador no permite descargar archivos desde aquí", "var(--expense)"); return; }
  try { await dl.save({ filename: `saldo-copia-${dkey(new Date())}.json`, data }); toast("copia guardada", `${S.movements.length} movimientos`, "var(--income)"); }
  catch (_) { toast("copia no guardada", "La descarga se canceló", "var(--muted)"); }
}
$("#backupInput").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.movements)) throw 0;
    const ids = new Set(S.movements.map(m => m.id));
    const add = d.movements.filter(m => m && m.id && typeof m.amount === "number" && typeof m.ts === "number" && !ids.has(m.id));
    upsertMovements(add);
    if (d.salary != null && S.salary == null) S.salary = d.salary;
    if (d.anchor && (!S.anchor || d.anchor.ts > S.anchor.ts)) S.anchor = d.anchor;
    Store.saveSettings();
    toast("copia restaurada", `${add.length} movimientos añadidos`, "var(--income)"); render();
  } catch (_) { toast("archivo no válido", "Elige una copia de seguridad de Saldo (.json)", "var(--expense)"); }
});

// ---------------------------------------------------------------- Eventos
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act],[data-tab],[data-edit],[data-cat],[data-group],[data-period],[data-topic],[data-tip],[data-filter]");
  if (!t) return;
  const d = t.dataset;
  if (d.tab) { haptic(); S.tab = d.tab; render(); return; }
  if (d.edit) { movementDialog(S.movements.find(m => m.id === d.edit)); return; }
  if (d.cat !== undefined) { haptic(); S.selCat = S.selCat === d.cat ? null : d.cat; render(); return; }
  if (d.group) { haptic(); S.selGroup = S.selGroup === d.group ? null : d.group; render(); return; }
  if (d.period) { S.period = d.period; S.selGroup = null; lastTab = null; render(); return; }
  if (d.topic !== undefined) { S.topic = d.topic || null; refreshTips(); t.parentElement.querySelectorAll(".pill").forEach(p => p.classList.toggle("on", p === t)); return; }
  if (d.tip) { S.openTip = S.openTip === d.tip ? null : d.tip; t.classList.toggle("open"); return; }
  if (d.filter) { S.filter = +d.filter; render(); return; }

  if (act === "hide") { HIDE = !HIDE; render(); document.querySelectorAll("[data-scr]").forEach(el => scramble(el, el.textContent)); const bv = $("#balVal"); if (bv) scramble(bv, bv.textContent); }
  else if (act === "prev" || act === "next") { const dt = new Date(S.ym[0], S.ym[1] + (act === "next" ? 1 : -1), 1); S.ym = [dt.getFullYear(), dt.getMonth()]; S.selCat = null; render(); scramble($("#monthTitle"), $("#monthTitle").textContent); document.querySelectorAll("[data-scr]").forEach(el => scramble(el, el.textContent)); }
  else if (act === "showExp" || act === "showInc") { S.showIncome = act === "showInc"; S.selCat = null; lastTab = null; render(); }
  else if (act === "balance") numberDialog("Saldo actual", "calibración", "¿Cuánto dinero tienes ahora mismo en tu cuenta?", currentBalance(), v => { S.anchor = { value: v, ts: Date.now() }; Store.saveSettings(); toast("saldo calibrado", euros(v), "var(--violet)"); render(); });
  else if (act === "salary") numberDialog("Sueldo neto mensual", "sueldo", "Lo que cobras al mes en tu cuenta, después de impuestos. Si tienes pagas extra prorrateadas, inclúyelas.", S.salary, v => { S.salary = v && v > 0 ? v : null; Store.saveSettings(); toast("sueldo actualizado", S.salary ? euros(S.salary) + " al mes" : "Se detectará con tus ingresos", "var(--violet)"); lastTab = null; render(); }, '<button class="btn-ghost" id="nExtra">Detectar</button>');
  else if (act === "import") $("#pdfInput").click();

  else if (act === "wipe") openSheet(`<div class="hud exp">Zona peligrosa</div><div style="font-family:var(--display);font-size:19px">Borrar todos los datos</div><div class="muted small">Se eliminarán ${S.movements.length} movimientos, tu saldo y tu sueldo. No se puede deshacer. Si quieres, exporta antes una copia.</div><button class="btn-primary" id="wOk" style="background:var(--expense)">Borrar todo</button><button class="btn-ghost" id="wNo">Cancelar</button>`, (ov, close) => {
    $("#wNo", ov).onclick = close;
    $("#wOk", ov).onclick = () => { const keys = [...new Set(S.movements.map(m => monthKey(m.ts)))]; S.movements = []; S.salary = null; S.anchor = null; Store.saveMonths(keys); Store.saveSettings(); close(); toast("datos borrados", "Saldo está vacío", "var(--expense)"); render(); };
  });
  else if (act && act.startsWith("tab:")) { S.tab = act.slice(4); render(); }
});
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("[role=button]")) { e.preventDefault(); e.target.click(); } });

function refreshTips() {

  const tips = [...personalTips(a), ...GENERAL_TIPS];
  const needle = normalize(S.query);
  const shown = tips.filter(t => (!S.topic || (S.topic === "__ti" && t.personal) || t.topic === S.topic) && (!needle || normalize(t.title + " " + t.body + " " + t.topic).includes(needle)));

// ---------------------------------------------------------------- Arranque
(function boot() {
  const bootEl = $("#boot"), cv = $("#bootRing"), ctx = cv.getContext("2d"), line = $("#bootLine"), bar = $("#bootBar"), pctEl = $("#bootPct");
  const done = () => { bootEl.classList.add("out"); setTimeout(() => bootEl.remove(), 500); };
  bootEl.addEventListener("click", done);
  if (reduceMotion) { done(); return; }
  const t0 = performance.now();
  const steps = [[0, "INICIANDO ENLACE SEGURO", 0], [1300, "SINCRONIZANDO SEÑALES", 55], [1700, "ENLACE ESTABLECIDO ◆", 100]];
  function f(now) {
    const t = now - t0, p = Math.min(1, t / 900), k = 1 - Math.pow(1 - p, 3);
    ctx.clearRect(0, 0, 400, 400);
    const sweep = k * Math.PI * 2;
    ctx.lineWidth = 8; ctx.lineCap = "round";
    const g = ctx.createLinearGradient(0, 0, 400, 400); g.addColorStop(0, "#00E5FF"); g.addColorStop(.5, "#8A5CFF"); g.addColorStop(1, "#FF3DCB");
    ctx.strokeStyle = g; ctx.shadowColor = "#00E5FF"; ctx.shadowBlur = 24;
    ctx.beginPath(); ctx.arc(200, 200, 176, -Math.PI / 2, -Math.PI / 2 + sweep); ctx.stroke(); ctx.shadowBlur = 0;
    for (let i = 0; i < 48 * k; i++) { const a = i / 48 * Math.PI * 2 - Math.PI / 2, r1 = 150, r2 = r1 - (i % 4 ? 8 : 20); ctx.strokeStyle = "rgba(0,229,255,.4)"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(200 + Math.cos(a) * r1, 200 + Math.sin(a) * r1); ctx.lineTo(200 + Math.cos(a) * r2, 200 + Math.sin(a) * r2); ctx.stroke(); }
    const ha = -Math.PI / 2 + sweep; ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(200 + Math.cos(ha) * 176, 200 + Math.sin(ha) * 176, 9, 0, 7); ctx.fill();
    ctx.save(); ctx.translate(200, 200); ctx.rotate(Math.PI / 4 + (1 - k) * Math.PI); ctx.scale(k, k); ctx.fillStyle = g; ctx.fillRect(-24, -24, 48, 48); ctx.restore();
    const st = steps.filter(s => t >= s[0]).pop();
    const typed = st[0] === 0 ? st[1].slice(0, Math.floor(st[1].length * Math.min(1, Math.max(0, (t - 350) / 550)))) : st[1];
    line.textContent = "> " + typed + (t < 1700 ? "▮" : "");
    const bp = st[2] === 0 ? 0 : st[2]; bar.style.width = bp + "%"; pctEl.textContent = bp + "%";
    if (t < 2150) requestAnimationFrame(f); else done();
  }
  requestAnimationFrame(f);
})();

Store.init();
