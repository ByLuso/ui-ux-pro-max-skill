<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0e1311" />
  <title>Fossil Zone Mapping — Fósiles y setas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&display=swap"
  />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-mode="fossils">
  <header id="app-header">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="15" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".35" />
        <path d="M16 6c-5 0-9 3.4-9 7.5 0 1 .8 1.5 1.8 1.5h14.4c1 0 1.8-.5 1.8-1.5C25 9.4 21 6 16 6Z" fill="currentColor" />
        <path d="M13.5 15h5l1 9.5c.1 1-.7 1.5-1.6 1.5h-3.8c-.9 0-1.7-.5-1.6-1.5l1-9.5Z" fill="currentColor" opacity=".7" />
      </svg>
      <div id="app-header-text">
        <p class="eyebrow" id="mode-eyebrow">Prospección de campo</p>
        <h1>Fossil Zone Mapping</h1>
      </div>
    </div>

    <div class="mode-switch" role="tablist" aria-label="Qué buscar">
      <button type="button" role="tab" data-mode="fossils" aria-selected="true">Fósiles</button>
      <button type="button" role="tab" data-mode="mushrooms" aria-selected="false">Setas</button>
    </div>

    <label class="region-picker">
      <span class="eyebrow" id="region-label">Región</span>
      <select id="region-select" aria-label="Región de análisis"></select>
    </label>
  </header>

  <main id="stage">
    <div id="map"></div>
    <aside id="mushroom-panel" aria-label="Buscador de setas" hidden></aside>
    <p id="loading-status" role="status"></p>
  </main>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/pmtiles/pmtiles.js"></script>
  <script src="js/config.js"></script>
  <script src="js/mushrooms.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
