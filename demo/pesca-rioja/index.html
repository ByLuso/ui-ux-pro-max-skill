<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
<title>Pesca Rioja — Mapa interactivo de pesca deportiva</title>
<meta name="description" content="Prototipo interactivo: ríos, tramos, fichas de especie y guías de pesca en La Rioja." />

<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
<script defer src="vendor/leaflet/leaflet.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css" />
</head>
<body class="theme-light">

<!-- Skip link -->
<a href="#map" class="skip-link">Saltar al mapa</a>

<!-- ===================== APP HEADER ===================== -->
<header class="app-header" role="banner">
  <div class="app-header__brand">
    <svg class="brand-mark" width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M2 12c3-4 7-6 11-6 4 0 6.5 2 8 4-1.5 2-4 4-8 4-4 0-8-2-11-6z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <circle cx="16.2" cy="10.3" r="0.9" fill="currentColor"/>
      <path d="M20 9.5c1 .3 2 1 2.5 1.9-.5.9-1.5 1.6-2.5 1.9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="app-header__title" data-i18n="appName">Pesca Rioja</span>
    <span class="badge-demo">Demo / datos ilustrativos</span>
  </div>

  <div class="app-header__search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="searchInput" type="search" data-i18n-placeholder="searchPlaceholder" placeholder="Buscar río, municipio o tramo…" autocomplete="off" />
    <div id="searchResults" class="search-results" hidden></div>
  </div>

  <div class="app-header__actions">
    <button id="btnFilters" class="icon-btn" aria-haspopup="true" aria-expanded="false" aria-controls="filtersPanel" title="Filtros">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="sr-only" data-i18n="filters">Filtros</span>
    </button>
    <button id="btnLocate" class="icon-btn" title="Tramos cerca de mí">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="sr-only" data-i18n="nearMe">Cerca de mí</span>
    </button>
    <button id="btnTools" class="icon-btn" aria-haspopup="true" aria-expanded="false" aria-controls="toolsPanel" title="Herramientas">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3l2.2 4.8L19 9l-4.8 2.2L12 16l-2.2-4.8L5 9l4.8-2.2L12 3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span class="sr-only">Herramientas</span>
    </button>
    <select id="langSelect" class="lang-select" aria-label="Idioma">
      <option value="es">ES</option>
      <option value="eu">EU</option>
      <option value="en">EN</option>
      <option value="fr">FR</option>
    </select>
    <button id="btnDark" class="icon-btn" title="Modo oscuro">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      <span class="sr-only" data-i18n="darkMode">Modo oscuro</span>
    </button>
  </div>
</header>

<!-- ===================== ALERT BANNER ===================== -->
<div id="alertBanner" class="alert-banner" role="status" hidden>
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3l10 18H2L12 3z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 10v4M12 17h.01" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
  <span id="alertBannerText"></span>
  <button id="alertBannerClose" class="alert-banner__close" aria-label="Cerrar aviso">×</button>
</div>

<!-- ===================== MAIN LAYOUT ===================== -->
<main class="app-main">

  <!-- Filters panel (slide-over) -->
  <aside id="filtersPanel" class="filters-panel" hidden>
    <div class="filters-panel__header">
      <h2 data-i18n="filters">Filtros</h2>
      <button class="icon-btn" id="btnCloseFilters" aria-label="Cerrar filtros">×</button>
    </div>

    <div class="filter-group">
      <h3 data-i18n="tramoType">Tipo de tramo</h3>
      <div id="filterTramoType" class="chip-group"></div>
    </div>

    <div class="filter-group">
      <h3 data-i18n="species">Especie</h3>
      <div id="filterSpecies" class="chip-group"></div>
    </div>

    <div class="filter-group">
      <h3 data-i18n="difficulty">Dificultad de acceso</h3>
      <div id="filterDifficulty" class="chip-group"></div>
    </div>

    <button id="btnResetFilters" class="btn-secondary btn-block">Limpiar filtros</button>
  </aside>

  <!-- Map -->
  <div id="map" class="map-container" tabindex="-1"></div>

  <!-- Legend -->
  <div id="legend" class="legend">
    <button id="legendToggle" class="legend__toggle" aria-expanded="true" aria-controls="legendBody">
      <span data-i18n="legend">Leyenda</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div id="legendBody" class="legend__body"></div>
  </div>

  <!-- Layer switcher -->
  <div class="layer-switcher" id="layerSwitcher">
    <button data-layer="standard" class="layer-switcher__btn is-active" data-i18n="standard">Estándar</button>
    <button data-layer="satellite" class="layer-switcher__btn" data-i18n="satellite">Satélite</button>
    <button data-layer="topo" class="layer-switcher__btn" data-i18n="topo">Topográfico</button>
  </div>

  <!-- Tools panel (vedas / logbook / predictor / accessibility) -->
  <aside id="toolsPanel" class="tools-panel" hidden>
    <div class="filters-panel__header">
      <h2 data-i18n="toolsTitle">Herramientas</h2>
      <button class="icon-btn" id="btnCloseTools" aria-label="Cerrar herramientas">×</button>
    </div>

    <nav class="tools-tabs" role="tablist">
      <button class="tools-tab is-active" data-tab="vedas" role="tab" aria-selected="true" data-i18n="tabVedas">Vedas</button>
      <button class="tools-tab" data-tab="predictor" role="tab" aria-selected="false" data-i18n="tabPredictor">Buen día</button>
      <button class="tools-tab" data-tab="logbook" role="tab" aria-selected="false" data-i18n="tabLogbook">Cuaderno</button>
      <button class="tools-tab" data-tab="access" role="tab" aria-selected="false" data-i18n="tabAccess">Accesib.</button>
    </nav>

    <section id="tabVedas" class="tools-tabpanel" data-tabpanel="vedas">
      <h3 data-i18n="vedasTitle">Calendario de vedas</h3>
      <div id="vedasList" class="vedas-list"></div>
    </section>

    <section id="tabPredictor" class="tools-tabpanel" data-tabpanel="predictor" hidden>
      <h3 data-i18n="predictorTitle">Predicción de buen día de pesca</h3>
      <div id="predictorCard" class="predictor-card"></div>
    </section>

    <section id="tabLogbook" class="tools-tabpanel" data-tabpanel="logbook" hidden>
      <h3 data-i18n="logbookTitle">Cuaderno de capturas</h3>
      <form id="logbookForm" class="logbook-form">
        <label>Tramo
          <select id="logbookTramo" required></select>
        </label>
        <label>Especie
          <select id="logbookSpecies" required></select>
        </label>
        <div class="form-row">
          <label>Peso (kg)
            <input type="number" id="logbookWeight" step="0.01" min="0" />
          </label>
          <label>Fecha
            <input type="date" id="logbookDate" required />
          </label>
        </div>
        <button type="submit" class="btn-primary btn-block" data-i18n="addCatch">Registrar captura</button>
      </form>
      <div id="logbookEntries" class="logbook-entries"></div>
      <button id="btnExportLogbook" class="btn-secondary btn-block" data-i18n="exportPdf">Exportar PDF</button>
    </section>

    <section id="tabAccess" class="tools-tabpanel" data-tabpanel="access" hidden>
      <h3 data-i18n="accessibilityTitle">Accesibilidad</h3>
      <label class="switch-row">
        <span data-i18n="contrastMode">Alto contraste</span>
        <input type="checkbox" id="toggleContrast" />
      </label>
      <label class="switch-row">
        <span data-i18n="fontSize">Tamaño de texto</span>
        <input type="range" id="rangeFontSize" min="0" max="2" step="1" value="0" />
      </label>
      <label class="switch-row">
        <span data-i18n="offline">Modo offline (app shell cacheado)</span>
        <input type="checkbox" id="toggleOffline" />
      </label>
      <label class="switch-row">
        <span data-i18n="guideModeTitle">Modo guía experto</span>
        <select id="expertLevel">
          <option value="principiante">Principiante</option>
          <option value="intermedio" selected>Intermedio</option>
          <option value="experto">Experto</option>
        </select>
      </label>
    </section>
  </aside>

  <!-- Tramo sheet (bottom sheet on mobile / sidebar on desktop) -->
  <section id="tramoSheet" class="sheet" hidden aria-labelledby="tramoSheetTitle">
    <div class="sheet__handle" id="sheetHandle"></div>
    <div class="sheet__scroll" id="tramoSheetContent"></div>
  </section>

  <!-- Species sheet -->
  <section id="speciesSheet" class="sheet sheet--species" hidden aria-labelledby="speciesSheetTitle">
    <div class="sheet__handle"></div>
    <div class="sheet__scroll" id="speciesSheetContent"></div>
  </section>

</main>

<div id="toastContainer" class="toast-container" aria-live="polite"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
