global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  # Métricas de Claude Code (OTLP -> collector -> :8889)
  - job_name: otel-collector
    scrape_protocols: [OpenMetricsText1.0.0, PrometheusText0.0.4]
    static_configs:
      - targets: ["otel-collector:8889"]

  # Admin API de Anthropic (usage_report + cost_report)
  - job_name: usage-exporter
    scrape_interval: 30s
    static_configs:
      - targets: ["usage-exporter:9101"]

  # Registros manuales de claude.ai (web / móvil)
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
