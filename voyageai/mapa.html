<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mapa de Destinos — VoyageAI</title>
  <meta name="description" content="Explora el mapa interactivo de VoyageAI y descubre todos los destinos disponibles. Haz clic en una chincheta para ver el itinerario completo."/>
  <link rel="stylesheet" href="assets/shared.css"/>
  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <style>
    body { overflow: hidden; }
    .page-wrapper { display: flex; height: 100dvh; flex-direction: column; }

    /* Navbar is fixed, so map needs top padding */
    .map-container {
      position: fixed; inset: 0; z-index: 0;
      padding-top: 72px;
      display: flex;
    }

    /* Sidebar */
    .map-sidebar {
      position: relative; z-index: 10;
      width: 340px; flex-shrink: 0;
      background: rgba(4,8,16,0.92);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header { padding: 20px 20px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .sidebar-title { font-family: var(--font-head); font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; }
    .sidebar-sub { font-size: 0.78rem; color: var(--fg-muted); }
    .sidebar-search { position: relative; margin-top: 14px; }
    .sidebar-search input {
      width: 100%; padding: 9px 12px 9px 36px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; color: var(--fg); font-family: var(--font-body);
      font-size: 0.85rem; outline: none; transition: border-color 0.2s;
    }
    .sidebar-search input:focus { border-color: var(--border-gold); }
    .sidebar-search input::placeholder { color: var(--fg-muted); }
    .sidebar-search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--fg-muted); pointer-events: none; }

    .sidebar-list { overflow-y: auto; flex: 1; padding: 8px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
    .sidebar-item {
      display: flex; gap: 12px; align-items: center;
      padding: 12px; border-radius: 12px; cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.2s, border-color 0.2s;
      text-decoration: none; color: var(--fg);
      margin-bottom: 4px;
    }
    .sidebar-item:hover { background: var(--surface-hover); border-color: var(--border); }
    .sidebar-item.active { background: var(--gold-glow); border-color: var(--border-gold); }
    .sidebar-dot {
      width: 42px; height: 42px; border-radius: 10px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
    }
    .sidebar-info { flex: 1; min-width: 0; }
    .sidebar-name { font-weight: 600; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sidebar-meta { font-size: 0.75rem; color: var(--fg-muted); margin-top: 2px; }
    .sidebar-price { font-size: 0.8rem; color: var(--gold); font-weight: 600; flex-shrink: 0; }

    /* Map */
    #map { flex: 1; height: 100%; }

    /* Leaflet customization */
    .leaflet-container { background: #040810 !important; font-family: var(--font-body); }
    .leaflet-tile { filter: brightness(0.85) contrast(0.95) saturate(0.7) hue-rotate(200deg); }

    /* Custom marker */
    .custom-marker {
      display: flex; align-items: center; justify-content: center;
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--gold) 0%, #a07840 100%);
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 16px rgba(201,169,110,0.4);
    }
    .custom-marker:hover { transform: rotate(-45deg) scale(1.1); box-shadow: 0 6px 24px rgba(201,169,110,0.6); }
    .custom-marker-inner { transform: rotate(45deg); font-size: 16px; }

    /* Popup */
    .leaflet-popup-content-wrapper {
      background: rgba(13,22,40,0.97) !important;
      border: 1px solid var(--border-gold) !important;
      border-radius: 16px !important;
      backdrop-filter: blur(20px);
      box-shadow: 0 16px 48px rgba(0,0,0,0.6) !important;
      padding: 0 !important;
      overflow: hidden;
    }
    .leaflet-popup-tip-container { display: none; }
    .leaflet-popup-close-button { color: var(--fg-muted) !important; font-size: 18px !important; top: 10px !important; right: 12px !important; }
    .leaflet-popup-close-button:hover { color: var(--fg) !important; }
    .popup-content { padding: 0; overflow: hidden; border-radius: 16px; }
    .popup-img { height: 120px; position: relative; overflow: hidden; }
    .popup-img-inner { position: absolute; inset: 0; }
    .popup-img-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(13,22,40,0.9) 0%, transparent 60%); }
    .popup-tag { position: absolute; top: 10px; left: 10px; padding: 3px 10px; background: rgba(4,8,16,0.75); border: 1px solid rgba(201,169,110,0.3); border-radius: 100px; font-size: 0.68rem; color: #c9a96e; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-family: 'Jost', sans-serif; }
    .popup-days { position: absolute; top: 10px; right: 10px; padding: 3px 8px; background: rgba(4,8,16,0.75); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; font-size: 0.68rem; color: rgba(237,238,242,0.55); font-family: 'Jost', sans-serif; }
    .popup-body { padding: 14px 16px 16px; }
    .popup-name { font-family: 'Bodoni Moda', Georgia, serif; font-size: 1.15rem; font-weight: 700; color: #edeef2; margin-bottom: 4px; }
    .popup-desc { font-size: 0.8rem; color: rgba(237,238,242,0.55); line-height: 1.5; margin-bottom: 12px; font-family: 'Jost', sans-serif; }
    .popup-footer { display: flex; align-items: center; justify-content: space-between; }
    .popup-price { font-size: 0.8rem; color: rgba(237,238,242,0.55); font-family: 'Jost', sans-serif; }
    .popup-price strong { color: #c9a96e; font-size: 1rem; }
    .popup-btn { display: inline-flex; align-items: center; gap: 5px; padding: 7px 14px; background: linear-gradient(135deg, #c9a96e, #a07840); border-radius: 8px; font-size: 0.78rem; font-weight: 600; color: #0a0a0a; text-decoration: none; font-family: 'Jost', sans-serif; transition: opacity 0.2s; }
    .popup-btn:hover { opacity: 0.85; }

    /* Mobile: sidebar becomes bottom sheet */
    .map-toggle-btn {
      display: none;
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      z-index: 200; padding: 12px 24px;
      background: rgba(13,22,40,0.95); border: 1px solid var(--border-gold);
      border-radius: 100px; color: var(--gold); font-size: 0.875rem; font-weight: 600;
      cursor: pointer; backdrop-filter: blur(16px);
    }

    @media(max-width:768px) {
      body { overflow: auto; }
      .map-container { flex-direction: column; }
      .map-sidebar { width: 100%; height: auto; max-height: 50vh; border-right: none; border-top: 1px solid var(--border); order: 2; }
      #map { height: 50vh; order: 1; flex: none; }
      .map-toggle-btn { display: flex; align-items: center; gap: 8px; }
    }
  </style>
</head>
<body>
<div class="aurora" aria-hidden="true"><span></span></div>

<!-- NAVBAR -->
<nav role="navigation" aria-label="Navegación principal">
  <a href="index.html" class="nav-logo">
    <div class="nav-logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></div>
    <span class="nav-logo-text">Voyage<span>AI</span></span>
  </a>
  <ul class="nav-links">
    <li><a href="index.html">Inicio</a></li>
    <li><a href="itinerarios.html">Itinerarios</a></li>
    <li><a href="mapa.html" class="active">Mapa</a></li>
    <li><a href="index.html#cta" class="nav-cta">Empezar gratis</a></li>
  </ul>
  <button class="nav-mobile-btn" onclick="toggleMenu()"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
</nav>

<!-- MAP + SIDEBAR -->
<div class="map-container" role="main">
  <!-- Sidebar -->
  <aside class="map-sidebar" aria-label="Lista de destinos">
    <div class="sidebar-header">
      <div class="sidebar-title">Destinos con itinerario</div>
      <div class="sidebar-sub">Haz clic en un destino para verlo en el mapa</div>
      <div class="sidebar-search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search" placeholder="Buscar destino..." id="sidebarSearch" oninput="filterSidebar()" aria-label="Buscar destino"/>
      </div>
    </div>
    <div class="sidebar-list" id="sidebarList" role="list"></div>
  </aside>

  <!-- Map -->
  <div id="map" role="application" aria-label="Mapa interactivo de destinos"></div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV/XN2GqLk=" crossorigin=""></script>

<script>
  // ─── Destination Data ───
  const DESTINOS = [
    {
      id: 'tokio',
      nombre: 'Tokio',
      pais: 'Japón',
      region: 'Asia',
      emoji: '🗾',
      dias: 5,
      precio: '€2,400',
      coords: [35.6762, 139.6503],
      desc: 'Gastronomía Michelin, templos y la tecnología más avanzada del mundo.',
      gradient: 'linear-gradient(160deg,#0d1b2e 0%,#1a3a5c 40%,#2d5a8a 70%,#c9a96e44 100%)',
      url: 'itinerarios/tokio.html'
    },
    {
      id: 'roma',
      nombre: 'Roma',
      pais: 'Italia',
      region: 'Europa',
      emoji: '🇮🇹',
      dias: 5,
      precio: '€1,800',
      coords: [41.9028, 12.4964],
      desc: 'La Ciudad Eterna: Vaticano, Coliseo y la mejor pasta de tu vida.',
      gradient: 'linear-gradient(160deg,#1a0a0a 0%,#3d1515 40%,#c0392b 70%,#e8c06844 100%)',
      url: 'itinerarios/roma.html'
    },
    {
      id: 'marrakech',
      nombre: 'Marrakech',
      pais: 'Marruecos',
      region: 'África',
      emoji: '🇲🇦',
      dias: 5,
      precio: '€1,200',
      coords: [31.6295, -7.9811],
      desc: 'Souks, medina laberíntica, riad con piscina y hammam tradicional.',
      gradient: 'linear-gradient(160deg,#1a0d00 0%,#4a2200 40%,#c67c1a 70%,#e8b84b44 100%)',
      url: 'itinerarios/marrakech.html'
    },
    {
      id: 'bali',
      nombre: 'Bali',
      pais: 'Indonesia',
      region: 'Asia',
      emoji: '🌴',
      dias: 7,
      precio: '€1,800',
      coords: [-8.3405, 115.0920],
      desc: 'Terrazas de arroz, templos sagrados y playas paradisíacas.',
      gradient: 'linear-gradient(160deg,#0d1a12 0%,#0d3a22 40%,#1a7a4a 70%,#34d89a44 100%)',
      url: 'itinerarios/bali.html'
    },
    {
      id: 'paris',
      nombre: 'París',
      pais: 'Francia',
      region: 'Europa',
      emoji: '🗼',
      dias: 4,
      precio: '€2,200',
      coords: [48.8566, 2.3522],
      desc: 'Torre Eiffel, el Louvre, Montmartre y los mejores bistros de Europa.',
      gradient: 'linear-gradient(160deg,#0d0a1e 0%,#1e1048 40%,#3a2090 70%,#7c6fd144 100%)',
      url: 'itinerarios/paris.html'
    },
    {
      id: 'peru',
      nombre: 'Perú',
      pais: 'Perú',
      region: 'Latinoamérica',
      emoji: '🦙',
      dias: 6,
      precio: '€2,100',
      coords: [-9.19, -75.015],
      desc: 'Lima, Cusco y Machu Picchu: historia inca y gastronomía de nivel mundial.',
      gradient: 'linear-gradient(160deg,#0d0a1e 0%,#1e1048 40%,#5c3a9e 70%,#a78bfa44 100%)',
      url: 'itinerarios/peru.html'
    },
    {
      id: 'tailandia',
      nombre: 'Tailandia',
      pais: 'Tailandia',
      region: 'Asia',
      emoji: '🏯',
      dias: 8,
      precio: '€1,600',
      coords: [13.7563, 100.5018],
      desc: 'Bangkok, Chiang Mai y las mejores islas del sur del Pacífico.',
      gradient: 'linear-gradient(160deg,#0d1a0d 0%,#1a3d1a 40%,#2a6e2a 70%,#f4d03f44 100%)',
      url: 'itinerarios/tailandia.html'
    }
  ];

  // ─── Init Map ───
  const map = L.map('map', {
    center: [20, 10],
    zoom: 2,
    zoomControl: false,
    attributionControl: true,
    minZoom: 2,
    maxZoom: 12
  });

  // Dark tile layer
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 20
  }).addTo(map);

  // Custom zoom control position
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  let activeMarker = null;
  let markers = {};

  // ─── Build markers ───
  DESTINOS.forEach(dest => {
    const icon = L.divIcon({
      className: '',
      html: `<div class="custom-marker"><div class="custom-marker-inner">${dest.emoji}</div></div>`,
      iconSize: [40, 40],
      iconAnchor: [20, 40],
      popupAnchor: [0, -44]
    });

    const marker = L.marker(dest.coords, { icon, title: dest.nombre }).addTo(map);

    const popupHTML = `
      <div class="popup-content">
        <div class="popup-img">
          <div class="popup-img-inner" style="background:${dest.gradient}"></div>
          <div class="popup-img-overlay"></div>
          <span class="popup-tag">${dest.region}</span>
          <span class="popup-days">${dest.dias} días</span>
        </div>
        <div class="popup-body">
          <div class="popup-name">${dest.nombre}, ${dest.pais}</div>
          <div class="popup-desc">${dest.desc}</div>
          <div class="popup-footer">
            <div class="popup-price">Desde <strong>${dest.precio}</strong></div>
            <a href="${dest.url}" class="popup-btn">Ver itinerario →</a>
          </div>
        </div>
      </div>`;

    marker.bindPopup(popupHTML, { maxWidth: 280, minWidth: 280, className: '' });

    marker.on('click', () => {
      activateSidebarItem(dest.id);
    });

    markers[dest.id] = marker;
  });

  // ─── Sidebar ───
  function buildSidebar(filter) {
    const list = document.getElementById('sidebarList');
    list.innerHTML = '';
    DESTINOS.filter(d => !filter || d.nombre.toLowerCase().includes(filter) || d.pais.toLowerCase().includes(filter)).forEach(dest => {
      const item = document.createElement('a');
      item.href = dest.url;
      item.className = 'sidebar-item';
      item.dataset.id = dest.id;
      item.setAttribute('role', 'listitem');
      item.innerHTML = `
        <div class="sidebar-dot" style="background:${dest.gradient}">${dest.emoji}</div>
        <div class="sidebar-info">
          <div class="sidebar-name">${dest.nombre}, ${dest.pais}</div>
          <div class="sidebar-meta">${dest.region} · ${dest.dias} días</div>
        </div>
        <div class="sidebar-price">${dest.precio}</div>`;

      item.addEventListener('click', e => {
        e.preventDefault();
        map.setView(dest.coords, 6, { animate: true, duration: 1.2 });
        markers[dest.id].openPopup();
        activateSidebarItem(dest.id);
      });
      list.appendChild(item);
    });
  }

  function activateSidebarItem(id) {
    document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
    const el = document.querySelector(`.sidebar-item[data-id="${id}"]`);
    if (el) { el.classList.add('active'); el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
  }

  function filterSidebar() {
    const q = document.getElementById('sidebarSearch').value.toLowerCase().trim();
    buildSidebar(q);
  }

  buildSidebar('');

  // ─── Nav ───
  const nav = document.querySelector('nav');
  window.addEventListener('scroll', () => { nav.style.background = window.scrollY > 40 ? 'rgba(4,8,16,0.92)' : 'rgba(4,8,16,0.6)'; }, { passive: true });

  function toggleMenu() {
    const links = document.querySelector('.nav-links');
    links.style.cssText = links.style.display === 'flex' ? '' : 'display:flex;flex-direction:column;position:absolute;top:72px;left:0;right:0;background:rgba(4,8,16,0.97);padding:16px;gap:4px;border-bottom:1px solid rgba(255,255,255,0.08);z-index:99;';
  }

  // Invalidate map size after fonts load
  setTimeout(() => map.invalidateSize(), 300);
</script>
</body>
</html>
