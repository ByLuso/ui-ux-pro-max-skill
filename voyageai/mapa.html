  <title>Mapa de Destinos — Routlo</title>
  <meta name="description" content="Explora el mapa interactivo de Routlo. Haz clic en una chincheta para ver el itinerario completo de cada destino."/>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }

    /* Full-screen layout below nav */
    .map-shell {
      position: fixed;
      top: 72px; left: 0; right: 0; bottom: 0;
      display: flex;
      z-index: 1;
    }

    /* ── Sidebar ── */
    .map-sidebar {
      width: 320px;
      flex-shrink: 0;
      background: rgba(4,8,16,0.94);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-right: 1px solid rgba(255,255,255,0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 10;
    }

    .sidebar-header {
      padding: 18px 16px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      flex-shrink: 0;
    }
    .sidebar-title {
      font-family: 'Bodoni Moda', Georgia, serif;
      font-size: 1.05rem; font-weight: 700;
      color: #edeef2; margin-bottom: 3px;
    }
    .sidebar-sub { font-size: 0.75rem; color: rgba(237,238,242,0.5); }

    .sidebar-search {
      position: relative; margin-top: 12px;
    }
    .sidebar-search input {
      width: 100%; padding: 8px 12px 8px 34px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 9px; color: #edeef2;
      font-family: 'Jost', sans-serif; font-size: 0.84rem;
      outline: none; transition: border-color 0.2s;
    }
    .sidebar-search input:focus { border-color: rgba(201,169,110,0.4); }
    .sidebar-search input::placeholder { color: rgba(237,238,242,0.35); }
    .sidebar-search svg {
      position: absolute; left: 9px; top: 50%;
      transform: translateY(-50%);
      color: rgba(237,238,242,0.4); pointer-events: none;
    }

    .sidebar-list {
      overflow-y: auto; flex: 1; padding: 8px 8px 16px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.1) transparent;
    }

    /* Each destination card */
    .dest-card {
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.07);
      background: rgba(255,255,255,0.03);
      margin-bottom: 6px;
      overflow: hidden;
      transition: border-color 0.2s, background 0.2s;
    }
    .dest-card:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.12); }
    .dest-card.active { background: rgba(201,169,110,0.08); border-color: rgba(201,169,110,0.3); }

    /* Top row: emoji + name + fly button */
    .dest-card-top {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 12px 9px;
      cursor: pointer;
    }
    .dest-emoji {
      width: 38px; height: 38px; border-radius: 9px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.15rem;
    }
    .dest-info { flex: 1; min-width: 0; }
    .dest-name {
      font-weight: 600; font-size: 0.88rem; color: #edeef2;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .dest-meta { font-size: 0.72rem; color: rgba(237,238,242,0.5); margin-top: 2px; }
    .dest-price { font-size: 0.8rem; color: #c9a96e; font-weight: 600; flex-shrink: 0; }

    /* Bottom row: link to itinerary */
    .dest-card-link {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 12px 9px;
      border-top: 1px solid rgba(255,255,255,0.05);
      text-decoration: none;
    }
    .dest-card-link span {
      font-size: 0.76rem; color: #c9a96e; font-weight: 600;
      font-family: 'Jost', sans-serif;
    }
    .dest-card-link svg { color: #c9a96e; flex-shrink: 0; }
    .dest-card.active .dest-card-link { border-top-color: rgba(201,169,110,0.15); }

    /* ── Map ── */
    #map {
      flex: 1;
      height: 100%;
      background: #040810;
    }

    /* Leaflet overrides */
    .leaflet-container {
      background: #040810 !important;
      font-family: 'Jost', sans-serif !important;
    }
    .leaflet-tile {
      filter: brightness(0.8) contrast(0.9) saturate(0.6) hue-rotate(195deg);
    }
    .leaflet-control-zoom {
      border: 1px solid rgba(255,255,255,0.1) !important;
      border-radius: 10px !important; overflow: hidden;
    }
    .leaflet-control-zoom a {
      background: rgba(4,8,16,0.9) !important;
      color: rgba(237,238,242,0.7) !important;
      border-color: rgba(255,255,255,0.08) !important;
    }
    .leaflet-control-zoom a:hover {
      background: rgba(13,22,40,0.97) !important;
      color: #c9a96e !important;
    }
    .leaflet-control-attribution {
      background: rgba(4,8,16,0.7) !important;
      color: rgba(237,238,242,0.3) !important;
      font-size: 10px !important;
    }
    .leaflet-control-attribution a { color: rgba(237,238,242,0.4) !important; }

    /* Custom pin marker */
    .map-pin {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #c9a96e 0%, #a07840 100%);
      border: 2px solid rgba(255,255,255,0.25);
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(201,169,110,0.45);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .map-pin:hover, .map-pin.open {
      transform: rotate(-45deg) scale(1.15);
      box-shadow: 0 6px 22px rgba(201,169,110,0.7);
    }
    .map-pin-emoji {
      transform: rotate(45deg);
      font-size: 15px; line-height: 1;
    }

    /* Popup */
    .leaflet-popup-content-wrapper {
      background: rgba(7,13,26,0.98) !important;
      border: 1px solid rgba(201,169,110,0.35) !important;
      border-radius: 16px !important;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7) !important;
      padding: 0 !important;
      overflow: hidden;
    }
    .leaflet-popup-tip-container { display: none !important; }
    .leaflet-popup-close-button {
      color: rgba(237,238,242,0.5) !important;
      font-size: 20px !important;
      top: 8px !important; right: 10px !important;
      z-index: 10;
    }
    .leaflet-popup-close-button:hover { color: #edeef2 !important; }
    .leaflet-popup-content { margin: 0 !important; width: 280px !important; }

    .popup-wrap { font-family: 'Jost', sans-serif; overflow: hidden; border-radius: 16px; }
    .popup-hero {
      height: 150px; position: relative; overflow: hidden;
    }
    .popup-hero-bg { position: absolute; inset: 0; background-size: cover; background-position: center; transition: transform 0.4s ease; }
    .popup-wrap:hover .popup-hero-bg { transform: scale(1.05); }
    .popup-hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(7,13,26,0.92) 0%, transparent 60%);
    }
    .popup-badges {
      position: absolute; top: 9px; left: 9px; right: 36px;
      display: flex; gap: 6px;
    }
    .popup-badge {
      padding: 2px 9px;
      background: rgba(4,8,16,0.7);
      border: 1px solid rgba(201,169,110,0.3);
      border-radius: 100px;
      font-size: 0.63rem; color: #c9a96e; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    .popup-badge.muted {
      border-color: rgba(255,255,255,0.1); color: rgba(237,238,242,0.5);
    }
    .popup-body { padding: 12px 14px 14px; }
    .popup-title {
      font-family: 'Bodoni Moda', Georgia, serif;
      font-size: 1.1rem; font-weight: 700; color: #edeef2; margin-bottom: 5px;
    }
    .popup-desc {
      font-size: 0.78rem; color: rgba(237,238,242,0.55);
      line-height: 1.55; margin-bottom: 12px;
    }
    .popup-footer {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px;
    }
    .popup-price { font-size: 0.78rem; color: rgba(237,238,242,0.5); }
    .popup-price strong { color: #c9a96e; font-size: 0.95rem; font-weight: 700; }
    .popup-cta {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 7px 14px;
      background: linear-gradient(135deg, #c9a96e, #a07840);
      border-radius: 8px; font-size: 0.78rem; font-weight: 700;
      color: #0a0a0a; text-decoration: none;
      transition: opacity 0.2s, transform 0.15s;
    }
    .popup-cta:hover { opacity: 0.88; transform: translateY(-1px); }

    /* Mobile */
    @media (max-width: 768px) {
      html, body { overflow: auto; }
      .map-shell { flex-direction: column; }
      .map-sidebar { width: 100%; height: 42vh; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.08); order: 2; }
      #map { height: 58vh; flex: none; order: 1; }
    }
  </style>

// ── Init map ──
const map = L.map('map', {
  center: [20, 10],
  zoom: 2,
  zoomControl: false,
  minZoom: 2,
  maxZoom: 14,
  worldCopyJump: true
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '© <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/attributions">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 20
}).addTo(map);

L.control.zoom({ position: 'bottomright' }).addTo(map);

const markers = {};
let activeId = null;

// ── Create markers ──
DESTINOS.forEach(d => {
  const icon = L.divIcon({
    className: '',
    html: `<div class="map-pin"><span class="map-pin-emoji">${d.emoji}</span></div>`,
    iconSize: [36, 36],
    iconAnchor: [18, 36],
    popupAnchor: [0, -40]
  });

  const popup = L.popup({ maxWidth: 280, minWidth: 280, className: '' }).setContent(`
    <div class="popup-wrap">
      <div class="popup-hero">
        <div class="popup-hero-bg" style="background:${d.gradient};background-image:url('${d.img}');background-size:cover;background-position:center"></div>
        <div class="popup-hero-overlay"></div>
        <div class="popup-badges">
          <span class="popup-badge">${d.region}</span>
          <span class="popup-badge muted">${d.dias} días</span>
        </div>
      </div>
      <div class="popup-body">
        <div class="popup-title">${d.nombre}, ${d.pais}</div>
        <div class="popup-desc">${d.desc}</div>
        <div class="popup-footer">
          <div class="popup-price">Desde <strong>${d.precio}</strong></div>
          <a href="${d.url}" class="popup-cta">
            Ver itinerario
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </a>
        </div>
      </div>
    </div>`);

  const marker = L.marker(d.coords, { icon, title: d.nombre })
    .bindPopup(popup)
    .addTo(map);

  marker.on('click', () => setActive(d.id));
  marker.on('popupclose', () => {
    if (activeId === d.id) setActive(null);
  });

  markers[d.id] = marker;
});

function setActive(id) {
  activeId = id;
  // Sync pin styles
  DESTINOS.forEach(d => {
    const el = markers[d.id].getElement();
    if (el) el.querySelector('.map-pin')?.classList.toggle('open', d.id === id);
  });
  // Sync sidebar
  document.querySelectorAll('.dest-card').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });
  if (id) {
    const el = document.querySelector(`.dest-card[data-id="${id}"]`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

// ── Build sidebar ──
function buildSidebar(q) {
  const list = document.getElementById('sidebarList');
  list.innerHTML = '';
  const filtered = q
    ? DESTINOS.filter(d => (d.nombre + d.pais + d.region).toLowerCase().includes(q))
    : DESTINOS;

  if (!filtered.length) {
    list.innerHTML = '<p style="padding:20px 14px;font-size:0.82rem;color:rgba(237,238,242,0.4);text-align:center">Sin resultados</p>';
    return;
  }

  filtered.forEach(d => {
    const card = document.createElement('div');
    card.className = 'dest-card';
    card.dataset.id = d.id;
    card.setAttribute('role', 'listitem');

    // Top row: click to fly to map
    const top = document.createElement('div');
    top.className = 'dest-card-top';
    top.innerHTML = `
      <div class="dest-emoji" style="background:${d.gradient}">${d.emoji}</div>
      <div class="dest-info">
        <div class="dest-name">${d.nombre}, ${d.pais}</div>
        <div class="dest-meta">${d.region} · ${d.dias} días</div>
      </div>
      <div class="dest-price">${d.precio}</div>`;
    top.addEventListener('click', () => {
      map.setView(d.coords, 6, { animate: true, duration: 1 });
      setTimeout(() => markers[d.id].openPopup(), 600);
      setActive(d.id);
    });

    // Bottom row: direct link to itinerary page
    const link = document.createElement('a');
    link.className = 'dest-card-link';
    link.href = d.url;
    link.innerHTML = `
      <span>Ver itinerario completo</span>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>`;

    card.appendChild(top);
    card.appendChild(link);
    list.appendChild(card);
  });
}

function filterSidebar() {
  const q = document.getElementById('sidebarSearch').value.toLowerCase().trim();
  buildSidebar(q);
}

buildSidebar('');

// Ensure map renders correctly after layout settles
setTimeout(() => map.invalidateSize(), 200);
window.addEventListener('resize', () => map.invalidateSize());

(function initNav() {
  const token = localStorage.getItem('routlo_token');
  const user = JSON.parse(localStorage.getItem('routlo_user') || 'null');
  const authLi = document.getElementById('navAuth');
  if (!authLi) return;
  if (token && user) {
    authLi.innerHTML = `<a href="chatbot.html" class="nav-cta">✈️ Planificador</a><a href="chatbot.html" class="nav-user-badge" title="${user.name}">${user.name[0].toUpperCase()}</a>`;
  } else {
    authLi.innerHTML = `<a href="login.html" class="nav-login-link">Iniciar sesión</a><a href="registro.html" class="nav-cta">Registrarse</a>`;
  }
})();
</script>
