<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Planificador IA — Routlo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,700;1,400&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <!-- marked.js for markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body { background: #040810; color: #edeef2; font-family: 'Jost', system-ui, sans-serif; line-height: 1.6; display: flex; }

    /* ── Sidebar ─────────────────────────────────────────────────────── */
    .sidebar {
      width: 272px; flex-shrink: 0;
      background: rgba(4,8,16,0.96);
      border-right: 1px solid rgba(255,255,255,0.07);
      display: flex; flex-direction: column;
      height: 100vh; overflow: hidden;
      transition: transform 0.3s ease;
    }

    .sidebar-top {
      padding: 16px 14px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      flex-shrink: 0;
    }
    .sidebar-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; text-decoration: none; }
    .sidebar-logo img { height: 30px; border-radius: 7px; background: #fff; padding: 3px 8px; }

    .new-chat-btn {
      width: 100%; padding: 10px 14px;
      background: rgba(201,169,110,0.12);
      border: 1px solid rgba(201,169,110,0.25);
      border-radius: 10px;
      color: #c9a96e;
      font-family: 'Jost', sans-serif; font-size: 0.875rem; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; gap: 8px;
      transition: background 0.2s, border-color 0.2s;
    }
    .new-chat-btn:hover { background: rgba(201,169,110,0.18); border-color: rgba(201,169,110,0.4); }

    .conv-list { flex: 1; overflow-y: auto; padding: 8px 8px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.08) transparent; }
    .conv-group-label { font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(237,238,242,0.3); padding: 10px 8px 4px; }
    .conv-item {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 10px; border-radius: 9px; cursor: pointer;
      transition: background 0.15s; margin-bottom: 2px;
      border: 1px solid transparent;
    }
    .conv-item:hover { background: rgba(255,255,255,0.05); }
    .conv-item.active { background: rgba(201,169,110,0.1); border-color: rgba(201,169,110,0.2); }
    .conv-title { font-size: 0.83rem; color: rgba(237,238,242,0.7); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-item.active .conv-title { color: #c9a96e; }
    .conv-del { opacity: 0; padding: 2px 4px; border-radius: 4px; color: rgba(237,238,242,0.4); background: none; border: none; cursor: pointer; font-size: 0.8rem; transition: opacity 0.15s, color 0.15s; flex-shrink: 0; }
    .conv-item:hover .conv-del { opacity: 1; }
    .conv-del:hover { color: #e07070; }

    .sidebar-footer {
      padding: 12px 14px;
      border-top: 1px solid rgba(255,255,255,0.07);
      flex-shrink: 0;
    }
    .user-card {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      margin-bottom: 8px;
    }
    .user-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: linear-gradient(135deg, #c9a96e, #a07840);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Bodoni Moda', serif; font-size: 0.95rem; font-weight: 700;
      color: #0a0a0a; flex-shrink: 0;
    }
    .user-info { flex: 1; min-width: 0; }
    .user-name { font-size: 0.84rem; font-weight: 600; color: #edeef2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-email { font-size: 0.72rem; color: rgba(237,238,242,0.4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .logout-btn {
      width: 100%; padding: 8px;
      background: none; border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px; color: rgba(237,238,242,0.45);
      font-family: 'Jost', sans-serif; font-size: 0.8rem;
      cursor: pointer; transition: border-color 0.2s, color 0.2s;
    }
    .logout-btn:hover { border-color: rgba(220,80,80,0.3); color: #e07070; }

    /* ── Main ───────────────────────────────────────────────────────── */
    .main { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; position: relative; }

    /* Header */
    .chat-header {
      padding: 0 20px; height: 56px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.07); flex-shrink: 0;
      background: rgba(4,8,16,0.6); backdrop-filter: blur(20px);
    }
    .chat-header-title { font-family: 'Bodoni Moda', serif; font-size: 1rem; font-weight: 700; color: #edeef2; }
    .mobile-menu-btn { display: none; background: none; border: none; color: rgba(237,238,242,0.6); cursor: pointer; padding: 6px; border-radius: 8px; }
    .mobile-menu-btn:hover { background: rgba(255,255,255,0.08); }

    /* Messages */
    .messages-wrap { flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.08) transparent; }
    .messages-inner { max-width: 820px; margin: 0 auto; padding: 28px 20px 8px; }

    /* Welcome screen */
    .welcome {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center;
      padding: 60px 20px; min-height: 60vh;
    }
    .welcome-icon { font-size: 3.5rem; margin-bottom: 20px; }
    .welcome-title { font-family: 'Bodoni Moda', serif; font-size: 2rem; font-weight: 700; color: #edeef2; margin-bottom: 10px; }
    .welcome-sub { font-size: 0.95rem; color: rgba(237,238,242,0.55); max-width: 460px; margin-bottom: 36px; line-height: 1.7; }
    .suggestions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 640px; }
    .suggestion-chip {
      padding: 14px 16px; background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
      text-align: left; cursor: pointer; transition: background 0.2s, border-color 0.2s;
      font-family: 'Jost', sans-serif;
    }
    .suggestion-chip:hover { background: rgba(201,169,110,0.08); border-color: rgba(201,169,110,0.25); }
    .suggestion-chip .chip-emoji { font-size: 1.1rem; display: block; margin-bottom: 5px; }
    .suggestion-chip .chip-text { font-size: 0.82rem; color: rgba(237,238,242,0.7); line-height: 1.4; }

    /* Message bubbles */
    .msg { margin-bottom: 24px; display: flex; gap: 12px; }
    .msg-user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; margin-top: 2px;
      display: flex; align-items: center; justify-content: center; font-size: 0.9rem;
    }
    .msg-user .msg-avatar { background: linear-gradient(135deg, #c9a96e, #a07840); font-weight: 700; font-family: 'Bodoni Moda', serif; color: #0a0a0a; }
    .msg-ai .msg-avatar { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); font-size: 1rem; }

    .msg-body { flex: 1; max-width: 85%; }
    .msg-user .msg-body { display: flex; flex-direction: column; align-items: flex-end; }

    .msg-bubble {
      padding: 12px 16px; border-radius: 16px;
      font-size: 0.9rem; line-height: 1.65;
    }
    .msg-user .msg-bubble {
      background: rgba(201,169,110,0.15);
      border: 1px solid rgba(201,169,110,0.25);
      border-bottom-right-radius: 4px;
      color: #edeef2;
    }
    .msg-ai .msg-bubble {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-bottom-left-radius: 4px;
      width: 100%;
    }

    /* Markdown rendered content */
    .msg-ai .msg-bubble h1, .msg-ai .msg-bubble h2 { font-family: 'Bodoni Moda', serif; color: #edeef2; margin: 20px 0 10px; line-height: 1.2; }
    .msg-ai .msg-bubble h1 { font-size: 1.4rem; }
    .msg-ai .msg-bubble h2 { font-size: 1.1rem; }
    .msg-ai .msg-bubble h3 { font-size: 0.95rem; font-weight: 700; color: #c9a96e; margin: 14px 0 6px; }
    .msg-ai .msg-bubble h4 { font-size: 0.88rem; font-weight: 700; color: rgba(237,238,242,0.8); margin: 10px 0 4px; }
    .msg-ai .msg-bubble p { margin-bottom: 10px; color: rgba(237,238,242,0.85); }
    .msg-ai .msg-bubble p:last-child { margin-bottom: 0; }
    .msg-ai .msg-bubble strong { color: #edeef2; font-weight: 700; }
    .msg-ai .msg-bubble em { color: rgba(237,238,242,0.7); font-style: italic; }
    .msg-ai .msg-bubble ul, .msg-ai .msg-bubble ol { padding-left: 20px; margin-bottom: 10px; }
    .msg-ai .msg-bubble li { margin-bottom: 4px; color: rgba(237,238,242,0.8); font-size: 0.88rem; }
    .msg-ai .msg-bubble blockquote { border-left: 3px solid rgba(201,169,110,0.4); padding: 8px 14px; margin: 10px 0; background: rgba(201,169,110,0.06); border-radius: 0 8px 8px 0; }
    .msg-ai .msg-bubble blockquote p { color: rgba(237,238,242,0.65); font-size: 0.85rem; margin-bottom: 0; }
    .msg-ai .msg-bubble code { background: rgba(255,255,255,0.08); padding: 2px 6px; border-radius: 4px; font-size: 0.82rem; color: #c9a96e; font-family: monospace; }
    .msg-ai .msg-bubble pre { background: rgba(4,8,16,0.8); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 14px; overflow-x: auto; margin: 10px 0; }
    .msg-ai .msg-bubble pre code { background: none; padding: 0; color: #edeef2; font-size: 0.82rem; }
    .msg-ai .msg-bubble table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 0.82rem; }
    .msg-ai .msg-bubble th { background: rgba(201,169,110,0.12); color: #c9a96e; padding: 8px 12px; text-align: left; border: 1px solid rgba(255,255,255,0.08); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .msg-ai .msg-bubble td { padding: 7px 12px; border: 1px solid rgba(255,255,255,0.06); color: rgba(237,238,242,0.75); }
    .msg-ai .msg-bubble tr:hover td { background: rgba(255,255,255,0.03); }
    .msg-ai .msg-bubble a { color: #c9a96e; text-decoration: underline; text-decoration-color: rgba(201,169,110,0.4); }
    .msg-ai .msg-bubble hr { border: none; border-top: 1px solid rgba(255,255,255,0.08); margin: 16px 0; }

    /* Typing indicator */
    .typing { display: flex; gap: 5px; align-items: center; padding: 12px 16px; }
    .typing-dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(201,169,110,0.6); animation: typing 1.2s ease-in-out infinite; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing { 0%,60%,100%{transform:translateY(0);opacity:0.5} 30%{transform:translateY(-6px);opacity:1} }

    /* Input area */
    .input-area {
      padding: 14px 20px 18px; border-top: 1px solid rgba(255,255,255,0.07);
      background: rgba(4,8,16,0.8); backdrop-filter: blur(20px); flex-shrink: 0;
    }
    .input-wrap {
      max-width: 820px; margin: 0 auto;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px; display: flex; align-items: flex-end; gap: 10px; padding: 12px 14px;
      transition: border-color 0.2s;
    }
    .input-wrap:focus-within { border-color: rgba(201,169,110,0.35); }
    .chat-input {
      flex: 1; background: none; border: none; outline: none;
      color: #edeef2; font-family: 'Jost', sans-serif; font-size: 0.9rem;
      resize: none; min-height: 24px; max-height: 180px; line-height: 1.5;
      scrollbar-width: thin;
    }
    .chat-input::placeholder { color: rgba(237,238,242,0.35); }
    .send-btn {
      width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
      background: linear-gradient(135deg, #c9a96e, #a07840);
      border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: opacity 0.2s, transform 0.15s;
    }
    .send-btn:hover:not(:disabled) { opacity: 0.85; transform: scale(1.05); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .send-btn svg { width: 16px; height: 16px; color: #0a0a0a; }
    .input-hint { max-width: 820px; margin: 6px auto 0; font-size: 0.72rem; color: rgba(237,238,242,0.3); text-align: center; }

    /* Stop button */
    .stop-btn {
      display: none; margin: 0 auto 8px; max-width: 820px;
      padding: 7px 16px; background: rgba(220,80,80,0.1);
      border: 1px solid rgba(220,80,80,0.25); border-radius: 8px;
      color: #e07070; font-family: 'Jost', sans-serif; font-size: 0.8rem;
      cursor: pointer; transition: background 0.2s;
    }
    .stop-btn:hover { background: rgba(220,80,80,0.18); }
    .stop-btn.show { display: block; }

    /* Aurora (subtle) */
    .aurora-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .aurora-bg::before { content: ''; position: absolute; width: 600px; height: 600px; border-radius: 50%; filter: blur(100px); background: radial-gradient(circle, rgba(13,24,48,0.4) 0%, transparent 70%); top: -100px; right: -100px; }
    .aurora-bg::after { content: ''; position: absolute; width: 500px; height: 500px; border-radius: 50%; filter: blur(100px); background: radial-gradient(circle, rgba(201,169,110,0.04) 0%, transparent 70%); bottom: 0; left: 50%; }

    /* Sidebar overlay for mobile */
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(4,8,16,0.7); z-index: 19; }

    /* Mobile */
    @media (max-width: 768px) {
      .sidebar { position: fixed; left: 0; top: 0; z-index: 20; transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); box-shadow: 4px 0 24px rgba(0,0,0,0.5); }
      .mobile-menu-btn { display: flex; }
      .sidebar-overlay.show { display: block; }
      .suggestions { grid-template-columns: 1fr; }
      .msg-body { max-width: 92%; }
    }
    @media (max-width: 480px) {
      .messages-inner { padding: 18px 14px 8px; }
      .input-area { padding: 10px 14px 14px; }
      .welcome-title { font-size: 1.5rem; }
      .welcome-sub { font-size: 0.875rem; }
    }
  </style>
</head>
<body>
<div class="aurora-bg" aria-hidden="true"></div>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<!-- ── Sidebar ─────────────────────────────────────────────────────────────── -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-top">
    <a href="index.html" class="sidebar-logo">
      <img src="assets/routlo-logo.png" alt="Routlo"/>
    </a>
    <button class="new-chat-btn" onclick="newChat()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Nueva consulta
    </button>
  </div>

  <div class="conv-list" id="convList">
    <!-- Populated by JS -->
  </div>

  <div class="sidebar-footer">
    <div class="user-card" id="userCard">
      <div class="user-avatar" id="userAvatar">?</div>
      <div class="user-info">
        <div class="user-name" id="userName">Cargando...</div>
        <div class="user-email" id="userEmail">—</div>
      </div>
    </div>
    <a id="authFooterBtn" class="logout-btn" style="cursor:pointer">Cerrar sesión</a>
  </div>
</aside>

<!-- ── Main ──────────────────────────────────────────────────────────────── -->
<div class="main">
  <header class="chat-header">
    <button class="mobile-menu-btn" onclick="openSidebar()" aria-label="Abrir menú">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="chat-header-title" id="headerTitle">Planificador de viajes</div>
    <div style="width:32px"></div>
  </header>

  <div class="messages-wrap" id="messagesWrap">
    <div class="messages-inner" id="messagesInner">
      <!-- Welcome shown by default -->
      <div class="welcome" id="welcome">
        <div class="welcome-icon">✈️</div>
        <h2 class="welcome-title">¿A dónde vamos?</h2>
        <p class="welcome-sub">Cuéntame tu destino, duración, número de personas y presupuesto. Routlo generará un itinerario completo al instante.</p>
        <div class="suggestions">
          <button class="suggestion-chip" onclick="useSuggestion(this)">
            <span class="chip-emoji">🗾</span>
            <span class="chip-text">5 días en Japón para 2 personas con €3.000 de presupuesto</span>
          </button>
          <button class="suggestion-chip" onclick="useSuggestion(this)">
            <span class="chip-emoji">🏖️</span>
            <span class="chip-text">Semana en Tailandia para mochileros con €1.500/persona</span>
          </button>
          <button class="suggestion-chip" onclick="useSuggestion(this)">
            <span class="chip-emoji">🏙️</span>
            <span class="chip-text">Fin de semana en Lisboa para una pareja con €600</span>
          </button>
          <button class="suggestion-chip" onclick="useSuggestion(this)">
            <span class="chip-emoji">🌎</span>
            <span class="chip-text">10 días por Perú y Machu Picchu para 3 amigos</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="input-area">
    <button class="stop-btn" id="stopBtn" onclick="stopGeneration()">⏹ Detener generación</button>
    <div class="input-wrap">
      <textarea class="chat-input" id="chatInput" placeholder="Escribe tu destino, duración y presupuesto..." rows="1" aria-label="Mensaje al planificador"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()" aria-label="Enviar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
    <div class="input-hint">Routlo puede cometer errores. Verifica precios y horarios antes de reservar.</div>
  </div>
</div>

<script>
  const API = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
    ? 'http://localhost:3001'
    : 'https://TU-SERVIDOR.up.railway.app';  // ← cambia esto por tu URL

  // ── Auth (opcional — sin login el chatbot funciona igual) ───────────────────
  const token = localStorage.getItem('routlo_token');
  const userStr = localStorage.getItem('routlo_user');
  const user = userStr ? JSON.parse(userStr) : null;
  const isLoggedIn = !!(token && user);

  // ── Init user UI ────────────────────────────────────────────────────────────
  if (isLoggedIn) {
    document.getElementById('userAvatar').textContent = user.name[0].toUpperCase();
    document.getElementById('userName').textContent = user.name;
    document.getElementById('userEmail').textContent = user.email;
    document.getElementById('authFooterBtn').textContent = 'Cerrar sesión';
    document.getElementById('authFooterBtn').onclick = logout;
  } else {
    document.getElementById('userAvatar').textContent = '✈️';
    document.getElementById('userAvatar').style.fontSize = '1rem';
    document.getElementById('userName').textContent = 'Viajero anónimo';
    document.getElementById('userEmail').textContent = 'Historial guardado en este navegador';
    const btn = document.getElementById('authFooterBtn');
    btn.textContent = 'Crear cuenta gratis';
    btn.href = 'registro.html';
    btn.style.textAlign = 'center';
    btn.style.textDecoration = 'none';
    btn.style.display = 'block';
    btn.style.color = '#c9a96e';
  }

  // ── Conversations (localStorage) ────────────────────────────────────────────
  let conversations = JSON.parse(localStorage.getItem('routlo_convs') || '[]');
  let activeConvId = null;
  let currentMessages = [];
  let isGenerating = false;
  let abortController = null;

  function saveConversations() {
    localStorage.setItem('routlo_convs', JSON.stringify(conversations));
  }

  function renderSidebar() {
    const list = document.getElementById('convList');
    if (!conversations.length) {
      list.innerHTML = '<div style="padding:20px 10px;text-align:center;font-size:0.8rem;color:rgba(237,238,242,0.3)">Sin conversaciones aún.<br>¡Empieza una nueva!</div>';
      return;
    }

    const today = new Date().toDateString();
    const yesterday = new Date(Date.now() - 86400000).toDateString();
    const groups = { 'Hoy': [], 'Ayer': [], 'Esta semana': [], 'Anteriores': [] };

    conversations.slice().reverse().forEach(c => {
      const d = new Date(c.createdAt).toDateString();
      const daysDiff = (Date.now() - new Date(c.createdAt)) / 86400000;
      if (d === today) groups['Hoy'].push(c);
      else if (d === yesterday) groups['Ayer'].push(c);
      else if (daysDiff < 7) groups['Esta semana'].push(c);
      else groups['Anteriores'].push(c);
    });

    list.innerHTML = Object.entries(groups).map(([label, convs]) => {
      if (!convs.length) return '';
      return `<div class="conv-group-label">${label}</div>` +
        convs.map(c => `
          <div class="conv-item${c.id === activeConvId ? ' active' : ''}" onclick="loadConv('${c.id}')">
            <div class="conv-title">${escHtml(c.title)}</div>
            <button class="conv-del" onclick="event.stopPropagation();deleteConv('${c.id}')" title="Eliminar">✕</button>
          </div>
        `).join('');
    }).join('');
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function newChat() {
    activeConvId = null;
    currentMessages = [];
    document.getElementById('messagesInner').innerHTML = `
      <div class="welcome" id="welcome">
        <div class="welcome-icon">✈️</div>
        <h2 class="welcome-title">¿A dónde vamos?</h2>
        <p class="welcome-sub">Cuéntame tu destino, duración, número de personas y presupuesto. Routlo generará un itinerario completo al instante.</p>
        <div class="suggestions">
          <button class="suggestion-chip" onclick="useSuggestion(this)"><span class="chip-emoji">🗾</span><span class="chip-text">5 días en Japón para 2 personas con €3.000 de presupuesto</span></button>
          <button class="suggestion-chip" onclick="useSuggestion(this)"><span class="chip-emoji">🏖️</span><span class="chip-text">Semana en Tailandia para mochileros con €1.500/persona</span></button>
          <button class="suggestion-chip" onclick="useSuggestion(this)"><span class="chip-emoji">🏙️</span><span class="chip-text">Fin de semana en Lisboa para una pareja con €600</span></button>
          <button class="suggestion-chip" onclick="useSuggestion(this)"><span class="chip-emoji">🌎</span><span class="chip-text">10 días por Perú y Machu Picchu para 3 amigos</span></button>
        </div>
      </div>`;
    document.getElementById('headerTitle').textContent = 'Planificador de viajes';
    document.getElementById('chatInput').focus();
    renderSidebar();
    closeSidebar();
  }

  function loadConv(id) {
    const conv = conversations.find(c => c.id === id);
    if (!conv) return;
    activeConvId = id;
    currentMessages = [...conv.messages];
    document.getElementById('headerTitle').textContent = conv.title;
    renderSidebar();
    renderMessages();
    closeSidebar();
  }

  function deleteConv(id) {
    conversations = conversations.filter(c => c.id !== id);
    saveConversations();
    if (activeConvId === id) newChat();
    else renderSidebar();
  }

  function renderMessages() {
    const inner = document.getElementById('messagesInner');
    inner.innerHTML = currentMessages.map(m => renderMsg(m.role, m.content)).join('');
    scrollToBottom();
  }

  function renderMsg(role, content) {
    if (role === 'user') {
      return `<div class="msg msg-user">
        <div class="msg-avatar">${escHtml((user.name || 'U')[0].toUpperCase())}</div>
        <div class="msg-body"><div class="msg-bubble">${escHtml(content)}</div></div>
      </div>`;
    }
    return `<div class="msg msg-ai">
      <div class="msg-avatar">🗺️</div>
      <div class="msg-body"><div class="msg-bubble">${marked.parse(content)}</div></div>
    </div>`;
  }

  function scrollToBottom() {
    const wrap = document.getElementById('messagesWrap');
    wrap.scrollTop = wrap.scrollHeight;
  }

  // ── Sending messages ────────────────────────────────────────────────────────
  async function sendMessage() {
    if (isGenerating) return;
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;

    // Clear welcome
    const welcome = document.getElementById('welcome');
    if (welcome) welcome.remove();

    input.value = '';
    input.style.height = 'auto';

    // Add user message
    currentMessages.push({ role: 'user', content: text });
    appendMsg('user', text);

    // Create/update conversation
    if (!activeConvId) {
      activeConvId = Date.now().toString();
      const title = text.length > 48 ? text.slice(0, 48) + '…' : text;
      conversations.push({ id: activeConvId, title, messages: [], createdAt: new Date().toISOString() });
      document.getElementById('headerTitle').textContent = title;
    }

    setGenerating(true);

    // Add AI bubble with typing indicator
    const aiMsgId = 'ai-' + Date.now();
    const inner = document.getElementById('messagesInner');
    inner.insertAdjacentHTML('beforeend', `
      <div class="msg msg-ai" id="${aiMsgId}">
        <div class="msg-avatar">🗺️</div>
        <div class="msg-body"><div class="msg-bubble">
          <div class="typing"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>
        </div></div>
      </div>`);
    scrollToBottom();

    let fullText = '';
    abortController = new AbortController();

    try {
      const headers = { 'Content-Type': 'application/json' };
      if (token) headers['Authorization'] = `Bearer ${token}`;

      const res = await fetch(`${API}/api/chat`, {
        method: 'POST',
        headers,
        body: JSON.stringify({ messages: currentMessages }),
        signal: abortController.signal
      });

      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.error || 'Error del servidor');
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      const bubble = document.querySelector(`#${aiMsgId} .msg-bubble`);

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const raw = line.slice(6).trim();
          if (!raw) continue;
          try {
            const data = JSON.parse(raw);
            if (data.error) throw new Error(data.error);
            if (data.done) break;
            if (data.text) {
              fullText += data.text;
              bubble.innerHTML = marked.parse(fullText);
              scrollToBottom();
            }
          } catch (parseErr) {
            if (parseErr.message !== 'Unexpected end of JSON input') throw parseErr;
          }
        }
      }

      // Save AI message
      currentMessages.push({ role: 'assistant', content: fullText });
      const conv = conversations.find(c => c.id === activeConvId);
      if (conv) { conv.messages = currentMessages; saveConversations(); }
      renderSidebar();

    } catch (err) {
      const bubble = document.querySelector(`#${aiMsgId} .msg-bubble`);
      if (bubble) {
        if (err.name === 'AbortError') {
          if (fullText) {
            bubble.innerHTML = marked.parse(fullText + '\n\n*[Generación detenida]*');
            currentMessages.push({ role: 'assistant', content: fullText });
            const conv = conversations.find(c => c.id === activeConvId);
            if (conv) { conv.messages = currentMessages; saveConversations(); }
          } else {
            document.getElementById(aiMsgId)?.remove();
            currentMessages.pop();
          }
        } else {
          bubble.innerHTML = `<div style="color:#e07070;font-size:0.85rem">⚠️ ${escHtml(err.message)}</div>`;
          currentMessages.pop();
        }
      }
    } finally {
      setGenerating(false);
      renderSidebar();
    }
  }

  function appendMsg(role, content) {
    document.getElementById('messagesInner').insertAdjacentHTML('beforeend', renderMsg(role, content));
    scrollToBottom();
  }

  function setGenerating(on) {
    isGenerating = on;
    document.getElementById('sendBtn').disabled = on;
    document.getElementById('stopBtn').classList.toggle('show', on);
  }

  function stopGeneration() {
    abortController?.abort();
  }

  function useSuggestion(btn) {
    const text = btn.querySelector('.chip-text').textContent;
    document.getElementById('chatInput').value = text;
    document.getElementById('chatInput').dispatchEvent(new Event('input'));
    sendMessage();
  }

  // ── Textarea auto-resize ────────────────────────────────────────────────────
  const chatInput = document.getElementById('chatInput');
  chatInput.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 180) + 'px';
  });
  chatInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // ── Mobile sidebar ──────────────────────────────────────────────────────────
  function openSidebar() {
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('sidebarOverlay').classList.add('show');
  }
  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('show');
  }

  // ── Auth ────────────────────────────────────────────────────────────────────
  function logout() {
    if (!confirm('¿Cerrar sesión?')) return;
    localStorage.removeItem('routlo_token');
    localStorage.removeItem('routlo_user');
    window.location.href = 'login.html';
  }

  // ── marked.js config ────────────────────────────────────────────────────────
  marked.setOptions({
    breaks: true,
    gfm: true
  });

  // ── Init ────────────────────────────────────────────────────────────────────
  renderSidebar();
</script>
</body>
</html>
