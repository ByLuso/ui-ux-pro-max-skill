<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mapa Interactivo de España — Routlo</title>
  <meta name="description" content="Explora el mapa interactivo de España con los 81 itinerarios de Routlo: ciudades, costas, parques naturales, rutas de senderismo y escapadas de un día por toda la península, islas y Baleares."/>
  <link rel="stylesheet" href="assets/shared.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }

    /* Aurora — Spanish crimson/gold */
    .aurora::before { background: radial-gradient(circle, #5c0808 0%, transparent 70%) !important; }
    .aurora::after  { background: radial-gradient(circle, #3a1500 0%, transparent 70%) !important; }
    .aurora span    { background: radial-gradient(circle, #2a0d0a 0%, transparent 70%) !important; }

    .map-shell {
      position: fixed;
      top: 72px; left: 0; right: 0; bottom: 0;
      display: flex; z-index: 1;
    }

    /* ── Sidebar ── */
    .map-sidebar {
      width: 320px; flex-shrink: 0;
      background: rgba(4,8,16,0.95);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border-right: 1px solid rgba(255,255,255,0.08);
      display: flex; flex-direction: column;
      overflow: hidden; z-index: 10;
    }

    .sidebar-back {
      display: flex; align-items: center; gap: 7px;
      padding: 9px 16px;
      background: rgba(255,255,255,0.025);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      text-decoration: none;
      color: rgba(237,238,242,0.45); font-size: 0.76rem;
      transition: color 0.2s, background 0.2s;
      flex-shrink: 0;
    }
    .sidebar-back:hover { color: rgba(237,238,242,0.8); background: rgba(255,255,255,0.04); }
    .sidebar-back svg { width:12px; height:12px; flex-shrink:0; }

    .sidebar-header {
      padding: 16px 16px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      flex-shrink: 0;
    }
    .sidebar-flag-row {
      display: flex; align-items: center; gap: 10px; margin-bottom: 4px;
    }
    .spain-flag {
      width: 28px; height: 20px; border-radius: 3px; flex-shrink: 0; overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.5);
      display: flex; flex-direction: column;
    }
    .spain-flag-red { flex: 1; background: #c60b1e; }
    .spain-flag-yellow { flex: 1.4; background: #ffc400; }
    .sidebar-title {
      font-family: 'Bodoni Moda', Georgia, serif;
      font-size: 1.08rem; font-weight: 700; color: #edeef2;
    }
    .sidebar-sub { font-size: 0.74rem; color: rgba(237,238,242,0.5); }

    .sidebar-quick-nav {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 12px;
    }
    .quick-btn {
      padding: 7px 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 9px;
      color: rgba(237,238,242,0.65);
      font-family: 'Jost', sans-serif; font-size: 0.77rem; font-weight: 500;
      cursor: pointer; text-align: center;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .quick-btn:hover {
      background: rgba(201,169,110,0.1);
      border-color: rgba(201,169,110,0.3);
      color: #c9a96e;
    }
    .quick-btn.active-view {
      background: rgba(201,169,110,0.12);
      border-color: rgba(201,169,110,0.35);
      color: #c9a96e;
    }

    /* ── Tabs ── */
    .sidebar-tabs {
      display: flex; border-bottom: 1px solid rgba(255,255,255,0.08);
      flex-shrink: 0;
    }
    .sidebar-tab {
      flex: 1; padding: 10px 12px;
      font-family: 'Jost', sans-serif; font-size: 0.8rem; font-weight: 500;
      color: rgba(237,238,242,0.45);
      background: none; border: none; border-bottom: 2px solid transparent;
      cursor: pointer; text-align: center;
      transition: color 0.2s, border-color 0.2s;
    }
    .sidebar-tab.active { color: #c9a96e; border-bottom-color: #c9a96e; }
    .sidebar-tab-count {
      display: inline-flex; align-items: center; justify-content: center;
      width: 18px; height: 18px; border-radius: 50%;
      background: rgba(201,169,110,0.15); border: 1px solid rgba(201,169,110,0.2);
      font-size: 0.62rem; font-weight: 700; color: #c9a96e;
      margin-left: 5px; vertical-align: middle;
    }

    /* ── Search ── */
    .sidebar-search { position: relative; padding: 10px 8px 0; flex-shrink: 0; }
    .sidebar-search input {
      width: 100%; padding: 8px 12px 8px 34px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 9px; color: #edeef2;
      font-family: 'Jost', sans-serif; font-size: 0.84rem;
      outline: none; transition: border-color 0.2s;
    }
    .sidebar-search input:focus { border-color: rgba(201,169,110,0.4); }
    .sidebar-search input::placeholder { color: rgba(237,238,242,0.3); }
    .sidebar-search svg { position: absolute; left: 17px; top: 50%; transform: translateY(-50%); color: rgba(237,238,242,0.4); pointer-events: none; }

    /* ── List ── */
    .sidebar-list {
      overflow-y: auto; flex: 1; padding: 8px 8px 16px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.1) transparent;
    }

    .region-divider {
      font-size: 0.68rem; font-weight: 600; letter-spacing: 0.15em;
      text-transform: uppercase; color: rgba(201,169,110,0.5);
      padding: 10px 6px 4px; display: flex; align-items: center; gap: 8px;
    }
    .region-divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.06); }

    /* Destination card */
    .dest-card {
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.07);
      background: rgba(255,255,255,0.03);
      margin-bottom: 5px; overflow: hidden;
      transition: border-color 0.2s, background 0.2s;
    }
    .dest-card:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.12); }
    .dest-card.active { background: rgba(201,169,110,0.08); border-color: rgba(201,169,110,0.3); }

    .dest-card-top {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px 8px; cursor: pointer;
    }
    .dest-emoji {
      width: 36px; height: 36px; border-radius: 9px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
    }
    .dest-info { flex: 1; min-width: 0; }
    .dest-name { font-weight: 600; font-size: 0.87rem; color: #edeef2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dest-meta { font-size: 0.71rem; color: rgba(237,238,242,0.5); margin-top: 2px; }
    .dest-price { font-size: 0.78rem; color: #c9a96e; font-weight: 600; flex-shrink: 0; }

    .dest-card-link {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 12px 8px;
      border-top: 1px solid rgba(255,255,255,0.05);
      text-decoration: none;
    }
    .dest-card-link span { font-size: 0.74rem; color: #c9a96e; font-weight: 600; font-family: 'Jost', sans-serif; }
    .dest-card-link svg { color: #c9a96e; }
    .dest-card.active .dest-card-link { border-top-color: rgba(201,169,110,0.15); }

    /* Coming soon card */
    .dest-card.soon { opacity: 0.65; }
    .dest-card.soon:hover { opacity: 0.85; }
    .soon-badge {
      font-size: 0.66rem; font-weight: 600; letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 2px 8px; border-radius: 20px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(237,238,242,0.4);
      flex-shrink: 0; white-space: nowrap;
    }

    /* Stats strip */
    .sidebar-stats {
      display: flex; gap: 0;
      border-top: 1px solid rgba(255,255,255,0.08);
      flex-shrink: 0;
    }
    .stat-item {
      flex: 1; padding: 8px 4px;
      text-align: center;
      border-right: 1px solid rgba(255,255,255,0.06);
    }
    .stat-item:last-child { border-right: none; }
    .stat-val { display: block; font-size: 0.95rem; font-weight: 700; color: #c9a96e; font-family: 'Bodoni Moda', serif; line-height: 1.1; }
    .stat-lbl { font-size: 0.63rem; color: rgba(237,238,242,0.4); text-transform: uppercase; letter-spacing: 0.08em; }

    /* ── Map ── */
    #map { flex: 1; height: 100%; background: #040810; }
    .leaflet-container { background: #040810 !important; font-family: 'Jost', sans-serif !important; }
    .leaflet-tile { filter: brightness(0.82) contrast(0.88) saturate(0.55) hue-rotate(190deg); }
    .tile-osm-es { filter: grayscale(0.25) brightness(0.72) contrast(0.9) saturate(0.7) invert(1) hue-rotate(180deg); }
    .leaflet-control-zoom { border: 1px solid rgba(255,255,255,0.1) !important; border-radius: 10px !important; overflow: hidden; }
    .leaflet-control-zoom a { background: rgba(4,8,16,0.9) !important; color: rgba(237,238,242,0.7) !important; border-color: rgba(255,255,255,0.08) !important; }
    .leaflet-control-zoom a:hover { background: rgba(13,22,40,0.97) !important; color: #c9a96e !important; }
    .leaflet-control-attribution { background: rgba(4,8,16,0.7) !important; color: rgba(237,238,242,0.3) !important; font-size: 10px !important; }
    .leaflet-control-attribution a { color: rgba(237,238,242,0.4) !important; }

    /* Spain boundary hint */
    .map-region-label {
      background: rgba(4,8,16,0.8) !important;
      border: 1px solid rgba(201,169,110,0.25) !important;
      border-radius: 20px; padding: 3px 10px;
      font-family: 'Jost', sans-serif; font-size: 0.7rem;
      color: rgba(201,169,110,0.7); font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase;
      white-space: nowrap; box-shadow: none !important;
    }
    .map-region-label::before { display: none !important; }
    .leaflet-tooltip.map-region-label { background: rgba(4,8,16,0.85) !important; border: 1px solid rgba(201,169,110,0.25) !important; box-shadow: none !important; }

    /* ── Active (gold) map pin ── */
    .map-pin {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #c9a96e 0%, #a07840 100%);
      border: 2px solid rgba(255,255,255,0.25);
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(201,169,110,0.5);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .map-pin:hover, .map-pin.open {
      transform: rotate(-45deg) scale(1.15);
      box-shadow: 0 6px 24px rgba(201,169,110,0.75);
    }
    .map-pin-emoji { transform: rotate(45deg); font-size: 15px; line-height: 1; }

    /* ── Coming soon (grey) pin ── */
    .map-pin-soon {
      width: 28px; height: 28px;
      background: rgba(50,55,65,0.75);
      border: 1.5px dashed rgba(255,255,255,0.2);
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
      transition: transform 0.2s, background 0.2s;
    }
    .map-pin-soon:hover { transform: rotate(-45deg) scale(1.12); background: rgba(70,75,85,0.85); }
    .map-pin-soon-inner { transform: rotate(45deg); font-size: 11px; opacity: 0.55; }

    /* ── Popups ── */
    .leaflet-popup-content-wrapper {
      background: rgba(7,13,26,0.98) !important;
      border: 1px solid rgba(201,169,110,0.35) !important;
      border-radius: 16px !important;
      box-shadow: 0 20px 60px rgba(0,0,0,0.75) !important;
      padding: 0 !important; overflow: hidden;
    }
    .leaflet-popup-tip-container { display: none !important; }
    .leaflet-popup-close-button { color: rgba(237,238,242,0.5) !important; font-size: 20px !important; top: 8px !important; right: 10px !important; z-index: 10; }
    .leaflet-popup-close-button:hover { color: #edeef2 !important; }
    .leaflet-popup-content { margin: 0 !important; width: 280px !important; }

    .popup-wrap { font-family: 'Jost', sans-serif; overflow: hidden; border-radius: 16px; }
    .popup-hero { height: 150px; position: relative; overflow: hidden; }
    .popup-hero-bg { position: absolute; inset: 0; background-size: cover; background-position: center; transition: transform 0.4s ease; }
    .popup-wrap:hover .popup-hero-bg { transform: scale(1.05); }
    .popup-hero-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(7,13,26,0.92) 0%, transparent 60%); }
    .popup-badges { position: absolute; top: 9px; left: 9px; right: 36px; display: flex; gap: 6px; }
    .popup-badge { padding: 2px 9px; background: rgba(4,8,16,0.7); border: 1px solid rgba(201,169,110,0.3); border-radius: 100px; font-size: 0.63rem; color: #c9a96e; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
    .popup-badge.muted { border-color: rgba(255,255,255,0.1); color: rgba(237,238,242,0.5); }
    .popup-body { padding: 12px 14px 14px; }
    .popup-title { font-family: 'Bodoni Moda', Georgia, serif; font-size: 1.1rem; font-weight: 700; color: #edeef2; margin-bottom: 5px; }
    .popup-desc { font-size: 0.78rem; color: rgba(237,238,242,0.55); line-height: 1.55; margin-bottom: 12px; }
    .popup-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .popup-price { font-size: 0.78rem; color: rgba(237,238,242,0.5); }
    .popup-price strong { color: #c9a96e; font-size: 0.95rem; font-weight: 700; }
    .popup-cta { display: inline-flex; align-items: center; gap: 5px; padding: 7px 14px; background: linear-gradient(135deg, #c9a96e, #a07840); border-radius: 8px; font-size: 0.78rem; font-weight: 700; color: #0a0a0a; text-decoration: none; transition: opacity 0.2s, transform 0.15s; }
    .popup-cta:hover { opacity: 0.88; transform: translateY(-1px); }

    /* Coming-soon popup */
    .popup-soon { font-family: 'Jost', sans-serif; padding: 20px 20px 22px; text-align: center; }
    .popup-soon-emoji { font-size: 2.6rem; margin-bottom: 10px; display: block; }
    .popup-soon-title { font-family: 'Bodoni Moda', Georgia, serif; font-size: 1.12rem; font-weight: 700; color: #edeef2; margin-bottom: 6px; }
    .popup-soon-sub { font-size: 0.77rem; color: rgba(237,238,242,0.5); line-height: 1.6; margin-bottom: 14px; }
    .popup-soon-pill { display: inline-flex; align-items: center; gap: 5px; padding: 5px 13px; background: rgba(201,169,110,0.1); border: 1px solid rgba(201,169,110,0.25); border-radius: 20px; font-size: 0.72rem; font-weight: 600; color: #c9a96e; }
    .popup-soon-cta { display: block; margin-top: 12px; font-size: 0.75rem; color: rgba(237,238,242,0.35); text-decoration: none; }
    .popup-soon-cta:hover { color: rgba(237,238,242,0.6); }

    /* Mobile — bottom sheet */
    @media (max-width: 768px) {
      html, body { overflow: hidden; height: 100dvh; }
      /* map-shell keeps position:fixed from desktop, just adjust top */
      .map-shell { top: 60px; flex-direction: row; }
      /* map fills all remaining flex space (sidebar is out of flow) */
      #map { flex: 1; width: 100%; height: 100%; }
      /* sidebar floats as a fixed bottom sheet, independent of map-shell */
      .map-sidebar {
        position: fixed !important; bottom: 0; left: 0; right: 0;
        width: 100%; height: 88vh; max-height: 88vh;
        border-right: none; border-top: 1.5px solid rgba(255,255,255,0.1);
        border-radius: 20px 20px 0 0;
        transform: translateY(calc(100% - 78px));
        transition: transform 0.42s cubic-bezier(0.32,0.72,0,1);
        z-index: 500; overflow: hidden;
        display: flex; flex-direction: column;
        box-shadow: 0 -12px 48px rgba(0,0,0,0.55);
        background: #080c18;
      }
      .map-sidebar.sheet-half { transform: translateY(calc(100% - 52vh)); }
      .map-sidebar.sheet-full { transform: translateY(0); }
      .sheet-handle {
        display: flex !important; justify-content: center; align-items: center;
        padding: 10px 0 8px; cursor: grab; flex-shrink: 0; touch-action: none;
      }
      .sheet-handle::after {
        content: ''; width: 38px; height: 4px;
        background: rgba(255,255,255,0.22); border-radius: 100px;
        transition: background 0.2s;
      }
      .map-sidebar.sheet-half .sheet-handle::after,
      .map-sidebar.sheet-full .sheet-handle::after { background: rgba(201,169,110,0.5); }
      .sidebar-back { display: none !important; }
      .sidebar-list { overflow-y: auto !important; -webkit-overflow-scrolling: touch; flex: 1; min-height: 0; }
      .sidebar-stats { flex-shrink: 0; }
    }
  </style>

</head>

<div class="aurora" aria-hidden="true"><span></span></div>

<!-- Navbar -->
<nav role="navigation" aria-label="Navegación principal">
  <a href="index.html" class="nav-logo">
    <img src="assets/routlo-logo.png" alt="Routlo" style="height:38px;border-radius:8px;background:#fff;padding:3px 10px;box-shadow:0 2px 8px rgba(0,0,0,0.28);">
  </a>

    <li><a href="index.html">Inicio</a></li>

  <button class="nav-mobile-btn" aria-label="Menú" onclick="
    const ul=document.querySelector('.nav-links');

    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
</nav>

<div class="map-shell">
  <!-- ── Sidebar ── -->
  <aside class="map-sidebar" aria-label="Destinos en España" id="mobileSheet">
    <!-- Drag handle (only visible on mobile) -->
    <div class="sheet-handle" id="sheetHandle" aria-hidden="true"></div>
    <!-- Back to world map -->
    <a href="mapa.html" class="sidebar-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      Mapa Mundial
    </a>

    <!-- Header -->
    <div class="sidebar-header">
      <div class="sidebar-flag-row">
        <div class="spain-flag" aria-hidden="true">
          <div class="spain-flag-red"></div>
          <div class="spain-flag-yellow"></div>
          <div class="spain-flag-red"></div>
        </div>
        <div class="sidebar-title">Mapa de España</div>
      </div>
      <div class="sidebar-sub">81 itinerarios: ciudades, naturaleza y escapadas</div>
      <!-- Quick nav -->
      <div class="sidebar-quick-nav">
        <button class="quick-btn" onclick="flyToPeninsula()" id="btnPeninsula">🌍 Península</button>
        <button class="quick-btn active-view" onclick="flyToCanarias()" id="btnCanarias">🏝️ Canarias</button>
        <button class="quick-btn" onclick="flyToBaleares()" id="btnBaleares">⛵ Baleares</button>
        <button class="quick-btn" onclick="flyToAll()" id="btnAll">🗺️ Ver todo</button>
      </div>
    </div>

    <!-- Tabs -->
    <div class="sidebar-tabs">
      <button class="sidebar-tab active" id="tabActivos" onclick="switchTab('activos')">
        Con itinerario <span class="sidebar-tab-count">9</span>
      </button>
      <button class="sidebar-tab" id="tabParques" onclick="switchTab('parques')">
        Naturaleza <span class="sidebar-tab-count" style="background:rgba(94,203,138,0.15);border-color:rgba(94,203,138,0.25);color:rgba(94,203,138,0.9);">100</span>
      </button>
      <button class="sidebar-tab" id="tabProximos" onclick="switchTab('proximos')">
        Próximos <span class="sidebar-tab-count">1</span>
      </button>
    </div>

    <!-- Search -->
    <div class="sidebar-search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" id="sidebarSearch" placeholder="Buscar destino..." aria-label="Buscar destino en España" oninput="filterSidebar()"/>
    </div>

    <!-- List -->
    <div class="sidebar-list" id="sidebarList" role="list"></div>

    <!-- Stats -->
    <div class="sidebar-stats" aria-label="Estadísticas">
      <div class="stat-item"><span class="stat-val">9</span><span class="stat-lbl">Activos</span></div>
      <div class="stat-item"><span class="stat-val" style="color:rgba(94,203,138,0.9)">100</span><span class="stat-lbl">Naturaleza</span></div>
      <div class="stat-item"><span class="stat-val">109</span><span class="stat-lbl">Itinerarios</span></div>
    </div>
  </aside>

  <!-- ── Map ── -->

  _isEs
    ? 'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
    : 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',

    maxZoom: 20,
    className: _isEs ? 'tile-osm-es' : ''
  }
).addTo(map);

// ── Navigation helpers ────────────────────────────────────

function updateQuickBtns(active) {
  ['btnPeninsula','btnCanarias','btnBaleares','btnAll'].forEach(id => {
    document.getElementById(id)?.classList.remove('active-view');
  });
  if (active) document.getElementById(active)?.classList.add('active-view');
}

function flyToPeninsula() {
  map.flyTo([40.4, -3.7], 6, { duration: 1.2 });
  updateQuickBtns('btnPeninsula');
}
function flyToCanarias() {
  map.flyTo([28.3, -15.7], 8, { duration: 1.2 });
  updateQuickBtns('btnCanarias');
}
function flyToBaleares() {
  map.flyTo([39.7, 2.9], 9, { duration: 1.2 });
  updateQuickBtns('btnBaleares');
}
function flyToAll() {
  map.fitBounds([[27.0, -19.5], [43.8, 5.0]], { padding: [20, 20], animate: true, duration: 1.2 });
  updateQuickBtns('btnAll');
}

      <div class="popup-soon-sub">${d.desc}</div>
      <div class="popup-soon-pill">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>
        Itinerario próximamente
      </div>
      <a href="chatbot.html" class="popup-soon-cta">Planifica ${d.nombre} con IA →</a>
    </div>`);

  const marker = L.marker(d.coords, { icon, title: d.nombre + ' (próximamente)' })
    .bindPopup(popup).addTo(map);
  soonMarkers[d.id] = marker;
});

// Green park pins
function createGreenIcon(emoji) {
  return L.divIcon({
    className: '',
    html: `<div class="map-pin-park" style="width:32px;height:32px;background:rgba(94,203,138,0.2);border:2px solid rgba(94,203,138,0.6);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;">${emoji}</div>`,
    iconSize: [32, 32],
    iconAnchor: [16, 16],
    popupAnchor: [0, -16]
  });
}

const parkMarkers = {};
PARQUES.forEach(d => {
  const icon = createGreenIcon(d.emoji);
  const popup = L.popup({ maxWidth: 280, minWidth: 280 }).setContent(`
    <div class="popup-wrap">
      <div class="popup-hero">
        <div class="popup-hero-bg" style="background:${d.gradient};background-size:cover;background-position:center"></div>
        <div class="popup-hero-overlay"></div>
        <div class="popup-badges">
          <span class="popup-badge" style="border-color:rgba(94,203,138,0.4);color:rgba(94,203,138,0.9);">${d.region}</span>
          <span class="popup-badge muted">${d.dias} día</span>
        </div>
      </div>
      <div class="popup-body">
        <div class="popup-title">${d.nombre}</div>
        <div class="popup-desc">${d.desc}</div>
        <div class="popup-footer">
          <div class="popup-price">Desde <strong style="color:rgba(94,203,138,0.9)">${d.precio}</strong></div>
          <a href="${d.url}" class="popup-cta" style="background:linear-gradient(135deg,rgba(94,203,138,0.8),rgba(46,160,100,0.9));">
            Ver itinerario
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </a>
        </div>
      </div>
    </div>`);

  const marker = L.marker(d.coords, { icon, title: d.nombre })
    .bindPopup(popup).addTo(map);
  parkMarkers[d.id] = marker;
});

// ── Active state ──────────────────────────────────────────

function setActive(id) {
  activeId = id;
  ACTIVOS.forEach(d => {
    const el = activeMarkers[d.id]?.getElement();
    if (el) el.querySelector('.map-pin')?.classList.toggle('open', d.id === id);
  });
  document.querySelectorAll('.dest-card[data-active-id]').forEach(el => {
    el.classList.toggle('active', el.dataset.activeId === id);
  });
  if (id) {
    const el = document.querySelector(`.dest-card[data-active-id="${id}"]`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

// ── Sidebar rendering ─────────────────────────────────────

let currentTab = 'activos';

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tabActivos').classList.toggle('active', tab === 'activos');
  document.getElementById('tabParques').classList.toggle('active', tab === 'parques');
  document.getElementById('tabProximos').classList.toggle('active', tab === 'proximos');
  buildSidebar(document.getElementById('sidebarSearch').value.toLowerCase().trim());
}

function buildSidebar(q) {
  const list = document.getElementById('sidebarList');
  list.innerHTML = '';

  if (currentTab === 'activos') {
    const filtered = ACTIVOS.filter(d => !q || (d.nombre + d.region).toLowerCase().includes(q));
    if (!filtered.length) { list.innerHTML = '<p style="padding:20px 14px;font-size:0.82rem;color:rgba(237,238,242,0.35);text-align:center">Sin resultados</p>'; return; }

    // Group by region
    const byRegion = {};
    filtered.forEach(d => { (byRegion[d.region] = byRegion[d.region] || []).push(d); });
    Object.entries(byRegion).forEach(([region, items]) => {
      const div = document.createElement('div');
      div.className = 'region-divider'; div.textContent = region;
      list.appendChild(div);
      items.forEach(d => {
        const card = document.createElement('div');
        card.className = 'dest-card'; card.dataset.activeId = d.id;
        card.setAttribute('role', 'listitem');
        const top = document.createElement('div'); top.className = 'dest-card-top';
        top.innerHTML = `
          <div class="dest-emoji" style="background:${d.gradient}">${d.emoji}</div>
          <div class="dest-info">
            <div class="dest-name">${d.nombre}</div>
            <div class="dest-meta">${d.region} · ${d.dias} días</div>
          </div>
          <div class="dest-price">${d.precio}</div>`;
        top.addEventListener('click', () => {
          map.setView(d.coords, 9, { animate: true, duration: 1 });
          setTimeout(() => activeMarkers[d.id]?.openPopup(), 700);
          setActive(d.id);
        });
        const link = document.createElement('a'); link.className = 'dest-card-link'; link.href = d.url;
        link.innerHTML = `<span>Ver itinerario completo</span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>`;
        card.appendChild(top); card.appendChild(link);
        list.appendChild(card);
      });
    });

  } else if (currentTab === 'parques') {
    const filtered = PARQUES.filter(d => !q || (d.nombre + d.region + d.zona).toLowerCase().includes(q));
    if (!filtered.length) { list.innerHTML = '<p style="padding:20px 14px;font-size:0.82rem;color:rgba(237,238,242,0.35);text-align:center">Sin resultados</p>'; return; }

    // Group by zona, in a fixed geographic order
    const byZona = {};
    filtered.forEach(d => { (byZona[d.zona] = byZona[d.zona] || []).push(d); });
    const orderedZonas = ZONA_ORDER.filter(z => byZona[z]).concat(Object.keys(byZona).filter(z => !ZONA_ORDER.includes(z)));

    orderedZonas.forEach(zona => {
      const div = document.createElement('div');
      div.className = 'region-divider'; div.textContent = zona;
      list.appendChild(div);
      byZona[zona].forEach(d => {
        const card = document.createElement('div');
        card.className = 'dest-card'; card.setAttribute('role', 'listitem');
        const top = document.createElement('div'); top.className = 'dest-card-top';
        top.innerHTML = `
          <div class="dest-emoji" style="background:${d.gradient}">${d.emoji}</div>
          <div class="dest-info">
            <div class="dest-name">${d.nombre}</div>
            <div class="dest-meta">${d.region} · ${d.dias} día${d.dias > 1 ? 's' : ''}</div>
          </div>
          <div class="dest-price" style="color:rgba(94,203,138,0.9)">${d.precio}</div>`;
        top.addEventListener('click', () => {
          map.setView(d.coords, 10, { animate: true, duration: 1 });
          setTimeout(() => parkMarkers[d.id]?.openPopup(), 700);
        });
        const link = document.createElement('a'); link.className = 'dest-card-link'; link.href = d.url;
        link.style.cssText = 'border-top-color:rgba(94,203,138,0.12)';
        link.innerHTML = `<span style="color:rgba(94,203,138,0.9)">Ver itinerario completo</span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(94,203,138,0.9)" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>`;
        card.appendChild(top); card.appendChild(link);
        list.appendChild(card);
      });
    });

  } else {
    const filtered = PROXIMOS.filter(d => !q || (d.nombre + d.region).toLowerCase().includes(q));
    if (!filtered.length) { list.innerHTML = '<p style="padding:20px 14px;font-size:0.82rem;color:rgba(237,238,242,0.35);text-align:center">Sin resultados</p>'; return; }

    const byRegion = {};
    filtered.forEach(d => {
      const r = d.region.includes('Andalucía') ? 'Andalucía' : d.region.includes('Madrid') ? 'Centro' : d.region.includes('Canarias') ? 'Islas Canarias' : d.region.includes('Baleares') ? 'Islas Baleares' : d.region;
      (byRegion[r] = byRegion[r] || []).push(d);
    });

    Object.entries(byRegion).forEach(([region, items]) => {
      const div = document.createElement('div'); div.className = 'region-divider'; div.textContent = region;
      list.appendChild(div);
      items.forEach(d => {
        const card = document.createElement('div');
        card.className = 'dest-card soon'; card.setAttribute('role', 'listitem');
        const top = document.createElement('div'); top.className = 'dest-card-top';
        top.innerHTML = `
          <div class="dest-emoji" style="background:rgba(40,45,55,0.9)">${d.emoji}</div>
          <div class="dest-info">
            <div class="dest-name">${d.nombre}</div>
            <div class="dest-meta">${d.region}</div>
          </div>
          <span class="soon-badge">Pronto</span>`;
        top.addEventListener('click', () => {
          map.setView(d.coords, 9, { animate: true, duration: 1 });
          setTimeout(() => soonMarkers[d.id]?.openPopup(), 700);
        });
        card.appendChild(top);
        list.appendChild(card);
      });
    });
  }
}

function filterSidebar() {
  const q = document.getElementById('sidebarSearch').value.toLowerCase().trim();
  buildSidebar(q);
}

buildSidebar('');

// ── Mobile bottom sheet ─────────────────────────────────────────────────────
(function(){
  if (window.innerWidth > 768) return;
  const sheet = document.getElementById('mobileSheet');
  const handle = document.getElementById('sheetHandle');
  if (!sheet || !handle) return;

  const STATES = ['peek', 'half', 'full'];
  let state = 'peek';

  function applyState(s) {
    state = s;
    sheet.classList.remove('sheet-half', 'sheet-full');
    if (s === 'half') sheet.classList.add('sheet-half');
    if (s === 'full') sheet.classList.add('sheet-full');
  }

  // Tap handle → cycle peek → half → full → peek
  handle.addEventListener('click', () => {
    const i = STATES.indexOf(state);
    applyState(STATES[(i + 1) % STATES.length]);
  });

  // Drag to resize
  let startY = 0, startTY = 0, dragging = false;

  function getCurrentTY() {
    const m = new DOMMatrix(getComputedStyle(sheet).transform);
    return m.m42;
  }

  handle.addEventListener('touchstart', e => {
    startY = e.touches[0].clientY;
    startTY = getCurrentTY();
    dragging = true;
    sheet.style.transition = 'none';
  }, { passive: true });

  window.addEventListener('touchmove', e => {
    if (!dragging) return;
    const dy = e.touches[0].clientY - startY;
    const next = Math.max(0, startTY + dy);
    sheet.style.transform = `translateY(${next}px)`;
  }, { passive: true });

  window.addEventListener('touchend', () => {
    if (!dragging) return;
    dragging = false;
    sheet.style.transition = '';
    const ty = getCurrentTY();
    const h = sheet.offsetHeight;
    const vh = window.innerHeight;
    // Snap thresholds
    const peekTY = h - 78;
    const halfTY = h - vh * 0.52;
    const fullTY = 0;
    const dists = { peek: Math.abs(ty - peekTY), half: Math.abs(ty - halfTY), full: Math.abs(ty - fullTY) };
    applyState(Object.keys(dists).reduce((a, b) => dists[a] <= dists[b] ? a : b));
  }, { passive: true });

  // Also expand when user taps a tab
  document.querySelectorAll('.sidebar-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      if (state === 'peek') applyState('half');
    });
  });
})();
</script>
